  const fuelList = (t.fuels || []).map(f => `<div class="item">
      <div class="n" style="background:var(--g)">⛽</div>
      <div class="tx"><div class="h">${nf(f.liters, 2)} ลิตร${f.amount_thb ? ' · ' + nf(f.amount_thb, 2) + ' บาท' : ''}</div>
      <div class="s">${esc(f.station || 'ไม่ระบุปั๊ม')} · ${thTime(new Date(f.filled_at))}</div></div></div>`).join('');

  const nodes = [
    el(`<div class="note ${tracking() ? 'g' : 'w'}"><span>${tracking() ? '◉' : '⏸'}</span><span>${
      !tracking() ? 'การบันทึกเส้นทางหยุดอยู่ — แตะปุ่มด้านล่างเพื่อเริ่มใหม่'
      : NATIVE.on
        ? '<b>กำลังบันทึกเส้นทางแม้ล็อกหน้าจอ</b><br>ปิดหน้าจอหรือสลับไปแอปอื่นได้ตามปกติ ระบบเก็บพิกัดต่อจนกว่าจะกด "สิ้นสุดการทำงาน"'
        : '<b>กำลังบันทึกเส้นทางแบบต่อเนื่อง</b><br>เปิดแอปนี้ค้างไว้ระหว่างเดินทาง ถ้าปิดแท็บหรือล็อกหน้าจอนาน เบราว์เซอร์จะหยุดส่งพิกัด'}</span></div>`),
    el(`<div class="row">
        <div class="stat"><div class="lb">เวลาที่ใช้</div><div class="v" id="a-time">${dur(Date.now() - new Date(t.startAt))}</div></div>
        <div class="stat"><div class="lb">ระยะทาง GPS</div><div class="v"><span id="a-dist">${nf(t.distM / 1000)}</span><small>กม.</small></div></div></div>`),
    el(`<div class="row">
        <div class="stat"><div class="lb">จุดพิกัด</div><div class="v" id="a-pts">${t.points.length}</div></div>
        <div class="stat"><div class="lb">เติมน้ำมัน</div><div class="v">${nf(liters, 2)}<small>ลิตร</small></div></div></div>`),
    el(`<div class="card"><h3>จุดปฏิบัติงานในทริปนี้</h3>
        <div class="sub">แต่ละจุดระบุประเภทงานแยกกัน · แวะที่ไหนเกิน ${CFG.dwellMinutes} นาที ระบบบันทึกพิกัดให้เอง แล้วให้คุณเลือกว่าแวะทำอะไร</div>
        <div class="list">${stopList}</div></div>`),
    el(`<div class="row"><button class="btn gh" id="addstop">📍 เพิ่มจุด</button>
        <button class="btn gh" id="addfuel">⛽ เติมน้ำมัน</button></div>`),
  ];
  if (fuelList) nodes.push(el(`<div class="card"><h3>การเติมน้ำมัน</h3><div class="list">${fuelList}</div></div>`));
  if (!tracking()) nodes.push(el('<button class="btn gh" id="resume">▶ เริ่มบันทึกเส้นทางต่อ</button>'));
  nodes.push(el('<button class="btn stop lg" id="end">■ สิ้นสุดการทำงาน</button>'));

  shell('กำลังปฏิบัติงาน', nodes, { back: () => go('home'), tabs: false, actions: false });
  $('#addstop').onclick = () => viewStopForm();
  $('#addfuel').onclick = () => viewFuelForm();
  $('#end').onclick = () => viewTripEnd();
  if ($('#resume')) $('#resume').onclick = () => { startWatch(); go('active'); };
  document.querySelectorAll('[data-cls]').forEach(b => b.onclick = () => {
    const s = t.stops.find(x => x.id === b.dataset.cls); askDwell(s.id, s.dwell_minutes || 0); });
  document.querySelectorAll('[data-out]').forEach(b => b.onclick = async () => {
    const s = t.stops.find(x => x.id === b.dataset.out);
    try { const p = await getPos(12000);
      s.depart_at = new Date().toISOString(); s.depart_lat = p.coords.latitude; s.depart_lng = p.coords.longitude;
    } catch { s.depart_at = new Date().toISOString(); }
    s._dirty = 1; saveTrip(); sync(); go('active');
  });
  if (S.pendingDwell) { const d = S.pendingDwell; S.pendingDwell = null; askDwell(d.id, d.mins); }
}

/* ปิดงานที่ค้าง "กำลังทำงาน" ที่เซิร์ฟเวอร์ (sql/31) — สำหรับทริปที่ถูกกู้มา
   ใช้เมื่อผู้ใช้ปิดงานไปแล้วแต่ระบบยังค้าง เพราะ sync ปิดขึ้นเซิร์ฟเวอร์ไม่สำเร็จ */
async function closeStuckSession() {
  if (!await askConfirm('ปิดงานที่ค้าง',
      'ระบบจะปิดงานนี้ให้จบทันที และคำนวณระยะทางจากพิกัดที่บันทึกไว้\n\n'
      + 'ใช้เมื่อคุณปิดงานไปแล้วแต่ระบบยังแสดงว่ากำลังทำงานอยู่', 'ปิดงานที่ค้าง', true)) return;
  loading('กำลังปิดงานที่ค้าง…');
  try {
    const { data, error } = await sb.rpc('close_my_active_session', { p_note: null });
    if (error || data?.ok !== true) {
      const code = { NO_ACTIVE: 'ไม่พบงานที่ค้างอยู่แล้ว', NO_AUTH: 'เซสชันหมดอายุ เข้าระบบใหม่' }[data?.code];
      // แสดง error จริง (sqlerrm) ถ้ามี เพื่อให้รู้ต้นเหตุแน่ชัด
      const detail = data?.error || data?.code || error?.message || 'ไม่ทราบสาเหตุ';
      toast(code || ('ปิดไม่สำเร็จ: ' + detail), 1, 12000);
    } else {
      toast('ปิดงานที่ค้างเรียบร้อยแล้ว');
    }
  } catch (e) { toast('ปิดไม่สำเร็จ: ' + (e?.message || e), 1, 6000); }
  // ล้างสถานะในเครื่องแล้วโหลดใหม่จากเซิร์ฟเวอร์ ให้ตรงกัน
  stopWatch(); LS.del('trip'); LS.del('lastTrip'); S.trip = null;
  boot();
}

/* ---------------- แผ่นเลือกสาขา ---------------- */
async function pickStore(onPick) {
  let nearby = [];
  if (S.lastPos) {
    try {
      const { data } = await sb.rpc('nearest_stores',
        { p_lat: S.lastPos.coords.latitude, p_lng: S.lastPos.coords.longitude, p_limit: 8 });
      nearby = data || [];
    } catch {}
  }
  const all = S.master.stores || [];
  const sheet = el(`<div class="sheet">
    <h3>ค้นหาสาขา</h3>
    <label class="f"><span>พิมพ์รหัส (125) หรือชื่อสาขา</span>
      <input id="sq" placeholder="กระทุ่มล้ม หรือ CJX00125 หรือ TH0001"></label>
    <div class="lb" id="scount"></div>
    <div class="list" id="slist" style="max-height:52vh;overflow:auto"></div>
    <button class="link" id="sx">ปิด</button></div>`);
  overlay(sheet);
  const norm = s => String(s || '').toLowerCase();
  const digits = s => String(s || '').replace(/\D/g, '').replace(/^0+/, '');
  const draw = (q) => {
    const t = q.trim();
    let rows, near = false;
    if (!t && nearby.length) { rows = nearby; near = true; }
    else rows = all.filter(s => {
      const d = digits(t);
      return norm(s.code).includes(norm(t)) || norm(s.name).includes(norm(t))
        || norm(s.legacy_code).includes(norm(t)) || (d && digits(s.code).startsWith(d));
    }).slice(0, 60);
    $('#scount').innerHTML = near
      ? `<span style="color:#00713F">◎ สาขาใกล้คุณ ${rows.length} แห่ง — พิมพ์เพื่อค้นจากทั้งหมด ${all.length}</span>`
      : `พบ ${rows.length} สาขา จากทั้งหมด ${all.length}`;
    $('#slist').innerHTML = rows.map(s => `<div class="item" data-code="${esc(s.code)}" style="cursor:pointer">
      <div class="tx"><div class="h mono" style="font-size:13.5px">${esc(s.code)} : ${esc(s.name)}</div>
        <div class="s">${s.chain === 'TD' ? 'สาขา TD' : 'สาขา CJx'}${
          s.legacy_code ? ' · รหัสเดิม ' + esc(s.legacy_code) : ''}</div></div>
      ${s.distance_km != null ? `<div class="mono" style="font-size:12px;font-weight:700;color:#00713F">${nf(s.distance_km, 1)} กม.</div>` : '<div>›</div>'}
    </div>`).join('') || '<div class="lb">ไม่พบสาขาที่ตรงกับคำค้น</div>';
    $('#slist').querySelectorAll('[data-code]').forEach(n => n.onclick = () => {
      const s = (near ? nearby : all).find(x => x.code === n.dataset.code)
             || all.find(x => x.code === n.dataset.code);
      closeOverlay(); onPick(s);
    });
  };
  draw('');
  $('#sq').oninput = e => draw(e.target.value);
  $('#sx').onclick = closeOverlay;
  setTimeout(() => $('#sq')?.focus(), 120);
}

/* ---------------- เพิ่มจุดปฏิบัติงาน ---------------- */
function viewStopForm() {
  let store = null, pos = null;
  const jts = S.master.job_types;
  const b = el(`<main>
    <div class="card" id="poscard"><h3>ตำแหน่งที่อยู่ตอนนี้</h3>
      <div class="lb" id="posv">กำลังจับสัญญาณ GPS…</div></div>
    <label class="f"><span>ประเภทงานที่ไปทำ</span><select id="jt"><option value="">— เลือก —</option>
      ${jts.map(j => `<option value="${esc(j.code)}">${esc(j.name_th)}${j.billable ? '' : ' (ไม่นับระยะงาน)'}</option>`).join('')}
    </select></label>
    <div class="hint">ถ้าไม่มีประเภทที่ตรง เลือก "อื่นๆ" แล้วพิมพ์เหตุผลได้</div>
    <div id="noteWrap" class="hide"><label class="f"><span>เหตุผล (บังคับ)</span>
      <textarea id="jn" placeholder="พิมพ์ได้เลยว่ามาทำอะไร"></textarea></label>
      <div class="hint">Admin จะรวบรวมเหตุผลเหล่านี้เพื่อดูว่าควรเพิ่มประเภทงานใหม่อะไร</div></div>
    <div id="stWrap"><div class="card" id="stcard" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:9px">
        <span style="font-size:19px">🏪</span>
        <div style="flex:1"><div class="lb" id="stlb">สาขา (ถ้าไปที่สาขา)</div>
          <div class="vl mono" id="stv" style="font-size:13.5px;color:var(--faint)">แตะเพื่อเลือก / ค้นหาสาขา</div></div>
        <button class="link" id="stclr" style="padding:0 4px;display:none">ล้าง</button>
        <span id="stmag">🔍</span></div>
      <div class="hint" style="padding:4px 0 0">พิมพ์ชื่อสาขา หรือรหัส (CJX00125 / TH000530 / 125) เพื่อค้นหา
        — ไม่พิมพ์อะไรจะแนะนำสาขาที่ใกล้คุณที่สุดให้</div></div></div>
    <label class="f"><span>ชื่อสถานที่</span>
      <input id="pl2" autocomplete="off"
             placeholder="พิมพ์คำค้น เช่น กระทุ่ม — ระบบจะแนะนำสถานที่ให้"></label>
    <div id="plsug"></div>
    <div id="plfar"></div>
    <label class="f"><span>หมายเหตุ (ไม่บังคับ)</span><textarea id="nt"></textarea></label>
    <button class="btn" id="ok">บันทึกจุดปฏิบัติงาน</button>
  </main>`);
  shell('เพิ่มจุดปฏิบัติงาน', [...b.childNodes], { back: () => go('active'), tabs: false, actions: false });

  getPos(15000).then(p => { pos = p;
    $('#posv').innerHTML = `<span class="mono">${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}</span>
      (± ${Math.round(p.coords.accuracy)} ม.)<br>${thDate(new Date())} ${thSec(new Date())}`;
  }).catch(() => { pos = S.lastPos; $('#posv').textContent = pos ? 'ใช้พิกัดล่าสุดที่บันทึกไว้' : 'จับพิกัดไม่ได้'; });

  // ช่องสาขาขึ้นเสมอทุกประเภทงาน — เปลี่ยนแค่ป้ายว่าบังคับหรือไม่
  // (เดิมซ่อนไว้ถ้างานประเภทนั้นไม่บังคับ ทำให้เลือกสาขาไม่ได้เลย)
  const onJt = () => {
    const j = jts.find(x => x.code === $('#jt').value);
    $('#noteWrap').classList.toggle('hide', !j?.requires_note);
    $('#stlb').textContent = j?.needs_store
      ? 'สาขา (งานประเภทนี้ต้องระบุ)' : 'สาขา (ถ้าไปที่สาขา)';
    $('#stcard').style.border = (j?.needs_store && !store)
      ? '2px solid var(--y-dk)' : '';
  };
  $('#jt').onchange = onJt;

  const setStore = (x) => {
    store = x;
    $('#stv').textContent = x ? x.code + ' : ' + x.name : 'แตะเพื่อเลือก / ค้นหาสาขา';
    $('#stv').style.color = x ? '' : 'var(--faint)';
    $('#stclr').style.display = x ? '' : 'none';
    $('#stmag').style.display = x ? 'none' : '';
    onJt();
  };
  $('#stcard').onclick = (e) => {
    if (e.target.id === 'stclr') return;          // ปุ่มล้างมี handler ของตัวเอง
    pickStore(x => afterPick(x));
  };
  $('#stclr').onclick = (e) => {
    e.stopPropagation();
    // ล้างชื่อสถานที่ที่เติมให้ตอนเลือกสาขาด้วย ไม่งั้นชื่อเก่าค้างอยู่
    // แล้วบันทึกไปเป็นสาขาหนึ่งแต่ชื่อสถานที่เป็นอีกสาขา
    setStore(null);
    $('#pl2').value = '';
    setFar(null);
    $('#plsug').innerHTML = '';
    toast('ล้างสาขาและชื่อสถานที่แล้ว');
  };

  /* ระยะสูงสุดจากสถานที่ที่เลือก ไกลกว่านี้ถือว่ายังไปไม่ถึง
     เจตนาคือกันการกดเพิ่มจุดจากที่อื่นแล้วอ้างว่าไปถึงสาขาแล้ว */
  const MAX_AWAY_KM = 1;
  let farKm = null;

  const setFar = (km) => {
    farKm = km;
    const box = $('#plfar');
    if (km == null) { box.innerHTML = ''; }
    else if (km > MAX_AWAY_KM) {
      box.innerHTML = `<div class="note e"><span>🛑</span><span>
        <b>คุณอยู่ห่างจากสถานที่นี้ ${nf(km, 1)} กม.</b><br>
        เพิ่มจุดปฏิบัติงานได้เมื่อไปถึงสถานที่จริงแล้วเท่านั้น
        (ต้องอยู่ในระยะ ${MAX_AWAY_KM} กม.)</span></div>`;
    } else {
      box.innerHTML = `<div class="note g"><span>✅</span><span>
        อยู่ห่างจากสถานที่นี้ ${nf(km, 2)} กม. — อยู่ในระยะที่ยืนยันได้</span></div>`;
    }
    const blocked = km != null && km > MAX_AWAY_KM;
    $('#ok').disabled = blocked;
    $('#ok').textContent = blocked
      ? 'ยังเพิ่มจุดไม่ได้ — ไปให้ถึงสถานที่ก่อน'
      : 'บันทึกจุดปฏิบัติงาน';
  };

  const kmFromHere = (lat, lng) => {
    const c = pos?.coords || S.lastPos?.coords;
    if (!c || lat == null || lng == null) return null;
    return haversineM(c.latitude, c.longitude, lat, lng) / 1000;
  };

  // เลือกสถานที่จากลิสต์ = จำพิกัด + ตรวจระยะทันที
  // (สาขา CJx/TD มี code · สถานที่ทั่วไปจาก OSM ไม่มี code แต่มีพิกัด)
  const afterPick = (x) => {
    if (x.code) setStore(x);            // สาขาในระบบ -> ผูก store_code
    else setStore(null);                // สถานที่ทั่วไป -> เก็บแค่ชื่อ+พิกัด
    $('#pl2').value = x.name;
    S.pickedPlaceLL = (x.lat != null && x.lng != null) ? { lat: x.lat, lng: x.lng } : null;
    $('#plsug').innerHTML = '';
    setFar(kmFromHere(x.lat, x.lng));
  };

  const renderSug = (rows) => {
    if (!rows.length) { $('#plsug').innerHTML = ''; return; }
    $('#plsug').innerHTML = `<div class="list" style="margin:-4px 0 10px">${
      rows.map((x, i) => {
        const km = kmFromHere(x.lat, x.lng);
        const head = x.code ? esc(x.code) + ' : ' + esc(x.name) : esc(x.name);
        return `<div class="item" data-i="${i}" style="cursor:pointer">
          <div class="tx"><div class="h" style="font-size:13px">${head}</div>
          <div class="s">${x.code ? '' : '📍 '}${km == null ? 'ไม่มีพิกัด'
            : (km > MAX_AWAY_KM ? '<b style="color:var(--r)">ห่าง ' + nf(km, 1) + ' กม.</b>'
                                : 'ห่าง ' + nf(km, 2) + ' กม.')}${
            x.lat != null ? ' · ' + Number(x.lat).toFixed(5) + ', ' + Number(x.lng).toFixed(5) : ''}</div></div></div>`;
      }).join('')}</div>`;
    $('#plsug').querySelectorAll('[data-i]').forEach(node =>
      node.onclick = () => afterPick(rows[+node.dataset.i]));
  };

  // ค้นสถานที่ทั่วไปจาก Photon (บริการค้นหาสถานที่ของ OSM ฟรี ไม่ต้องใช้ API key
  // ออกแบบมาเพื่อ autocomplete โดยเฉพาะ) — เอียงผลไปใกล้ตำแหน่งปัจจุบัน
  let osmTimer = null, lastQ = '';
  async function searchOsm(q) {
    const c = pos?.coords || S.lastPos?.coords;
    let url = 'https://photon.komoot.io/api/?lang=default&limit=6&q='
      + encodeURIComponent(q);
    if (c) url += '&lat=' + c.latitude + '&lon=' + c.longitude;
    try {
      const r = await fetch(url);
      if (!r.ok) return [];
      const j = await r.json();
      return (j.features || []).map(f => {
        const p = f.properties || {}, g = (f.geometry || {}).coordinates || [];
        const name = [p.name, p.street, p.district || p.city, p.state]
          .filter(Boolean).slice(0, 3).join(', ');
        return { name: name || p.name || q, lat: g[1], lng: g[0] };
      }).filter(x => x.lat != null);
    } catch { return []; }
  }

  // พิมพ์แล้วแนะนำ: สาขาในระบบก่อน (ทันที) + สถานที่ทั่วไปจาก OSM (หน่วง)
  $('#pl2').oninput = () => {
    const raw = $('#pl2').value.trim(), q = raw.toLowerCase();
    setFar(null); S.pickedPlaceLL = null;
    if (q.length < 2) { $('#plsug').innerHTML = ''; return; }

    const stores = (S.master.stores || []).filter(x =>
      String(x.name || '').toLowerCase().includes(q) ||
      String(x.code || '').toLowerCase().includes(q) ||
      String(x.legacy_code || '').toLowerCase().includes(q)).slice(0, 6);
    renderSug(stores);                         // โชว์สาขาทันที

    clearTimeout(osmTimer);
    if (q.length < 3) return;
    osmTimer = setTimeout(async () => {
      if (raw === lastQ) return; lastQ = raw;
      const places = await searchOsm(raw);
      if ($('#pl2').value.trim() !== raw) return;   // พิมพ์ต่อแล้ว ทิ้งผลเก่า
      renderSug(stores.concat(places));             // รวมสาขา + สถานที่ทั่วไป
    }, 600);
  };

  $('#ok').onclick = async (e) => {
    const j = jts.find(x => x.code === $('#jt').value);
    if (!j) return toast('เลือกประเภทงาน', 1);
    if (farKm != null && farKm > MAX_AWAY_KM)
      return toast('คุณอยู่ห่างจากสถานที่ ' + nf(farKm, 1)
        + ' กม. — ไปให้ถึงสถานที่ก่อนแล้วค่อยกดเพิ่มจุด', 1, 8000);
    if (j.requires_note && $('#jn').value.trim().length < 3) return toast('ประเภทงาน "อื่นๆ" ต้องพิมพ์เหตุผล', 1);
    if (j.needs_store && !store) return toast('งานประเภทนี้ต้องเลือกสาขา', 1);
    if (!pos) return toast('ยังจับพิกัดไม่ได้ รอสักครู่แล้วลองใหม่', 1);
    e.target.disabled = true;
    const t = S.trip;

    // เพิ่มจุดใหม่ = ออกจากจุดก่อนหน้าแล้ว ปิดให้อัตโนมัติที่พิกัดของจุดนั้นเอง
    // (ไม่ใช่พิกัดปัจจุบัน เพราะตอนออกจากจุดนั้นคนยังอยู่ที่จุดนั้น)
    const prev = [...t.stops].reverse().find(x => !x.depart_at);
    if (prev) {
      prev.depart_at = new Date().toISOString();
      prev.depart_lat = prev.arrive_lat;
      prev.depart_lng = prev.arrive_lng;
      prev._dirty = 1;
    }

    t.stops.push({ id: uuid(), session_id: t.id, seq: t.stops.length + 1,
      job_type_code: j.code, job_note: $('#jn').value.trim() || null,
      store_code: store?.code || null, store_name: store?.name || null,
      place_label: $('#pl2').value.trim() || store?.name || null,
      arrive_at: new Date().toISOString(),
      arrive_lat: pos.coords.latitude, arrive_lng: pos.coords.longitude,
      note: $('#nt').value.trim() || null, source: 'manual', _dirty: 1 });
    saveTrip(); sync();
    toast(prev ? 'บันทึกจุดใหม่ และปิดจุดก่อนหน้าให้แล้ว' : 'บันทึกจุดปฏิบัติงานแล้ว');
    go('active');
  };
}

/* ---------------- แผ่นถามจุดที่แวะ ---------------- */
function askDwell(stopId, mins) {
  const t = S.trip; const s = t.stops.find(x => x.id === stopId); if (!s) return;
  let store = null;
  const jts = S.master.job_types;
  const sheet = el(`<div class="sheet" data-dismiss="no">
    <div style="text-align:center;font-size:26px">📍</div>
    <h3 style="text-align:center">บันทึกจุดที่แวะ (${mins} นาที)</h3>
    <div style="font-size:13px;color:#3C4655;text-align:center;line-height:1.6">
      ระบบบันทึกพิกัดจุดนี้ไว้ให้แล้ว ช่วยเลือกว่าแวะทำอะไร
      เพื่อให้ระยะทางและค่าน้ำมันของวันนี้คิดให้คุณได้ถูกต้องครบถ้วน<br>
      <b>ถ้าเป็นการพักหรือธุระส่วนตัว เลือกได้ตามจริง ไม่มีผลเสียกับคุณ</b></div>
    <label class="f"><span>ประเภทงาน</span><select id="dj"><option value="">— เลือก —</option>
      ${jts.map(j => `<option value="${esc(j.code)}">${esc(j.name_th)}</option>`).join('')}</select></label>
    <div id="dnw" class="hide"><label class="f"><span>เหตุผล (บังคับ)</span>
      <input id="dn" placeholder="พิมพ์ได้เลยว่าแวะทำอะไร"></label></div>
    <div id="dsw"><button class="btn gh" id="dst">🏪 เลือก / ค้นหาสาขา (ถ้าไปที่สาขา)</button></div>
    <button class="btn" id="dok">บันทึกเป็นจุดปฏิบัติงาน</button>
    <button class="btn gh" id="dbk">☕ พัก / ธุระส่วนตัว</button>
    <button class="link" id="dl">ไว้ทีหลัง</button></div>`);
  overlay(sheet);
  $('#dj').onchange = () => {
    const j = jts.find(x => x.code === $('#dj').value);
    $('#dnw').classList.toggle('hide', !j?.requires_note);
    // ช่องสาขาขึ้นเสมอ เปลี่ยนแค่ข้อความว่าบังคับหรือไม่
    if (!store) $('#dst').textContent = j?.needs_store
      ? '🏪 เลือกสาขา (งานประเภทนี้ต้องระบุ)'
      : '🏪 เลือก / ค้นหาสาขา (ถ้าไปที่สาขา)';
  };
  $('#dst').onclick = () => pickStore(x => { store = x; $('#dst').textContent = '🏪 ' + x.code + ' : ' + x.name; });
  const finish = (patch) => { Object.assign(s, patch, { needs_reason: !patch.job_type_code, _dirty: 1 });
    saveTrip(); sync(); closeOverlay(); go('active'); };
  $('#dok').onclick = () => {
    const j = jts.find(x => x.code === $('#dj').value);
    if (!j) return toast('เลือกประเภทงาน', 1);
    if (j.requires_note && $('#dn').value.trim().length < 3) return toast('กรอกเหตุผล', 1);
    if (j.needs_store && !store) return toast('งานประเภทนี้ต้องเลือกสาขา', 1);
    finish({ job_type_code: j.code, job_note: $('#dn').value.trim() || null,
      store_code: store?.code || null, store_name: store?.name || null,
      place_label: store?.name || null });
  };
  $('#dbk').onclick = () => {
    const other = jts.find(j => j.code === 'OTHER');
    finish({ job_type_code: other?.code || null, job_note: 'พัก / ธุระส่วนตัว' });
  };
  $('#dl').onclick = closeOverlay;
}

/* ---------------- เติมน้ำมัน ---------------- */
function viewFuelForm() {
  let photo = null, ocr = null;
  const q = S.quota;
  const b = el(`<main>
    <div class="card"><h3>รูปสลิปน้ำมัน</h3>
      <div class="sub">ถ่ายให้เห็นจำนวนลิตรและยอดเงินชัด ๆ AI จะอ่านมาเติมให้</div>
      ${photoField('fp', 'ยังไม่ได้ถ่ายรูปสลิป')}
      <div class="hint" id="fhint"></div></div>
    <label class="f big"><span>จำนวนลิตร</span><input id="lt" inputmode="decimal" placeholder="32.15"></label>
    <div class="row">
      <label class="f"><span>ยอดเงิน (บาท)</span><input id="am" inputmode="decimal"></label>
      <label class="f"><span>ราคา/ลิตร</span><input id="pr" inputmode="decimal"></label></div>
    <label class="f"><span>ปั๊ม / สาขา</span><input id="stn"></label>
    <label class="f ${CFG.showFuelOdometer ? '' : 'hide'}">
      <span>เลขไมล์ตอนเติม (ถ้าจำได้)</span>
      <input id="fodo" inputmode="numeric" maxlength="7"></label>
    <div id="qbox"></div>
    <button class="btn" id="ok">บันทึกการเติมน้ำมัน</button>
  </main>`);
  shell('บันทึกการเติมน้ำมัน', [...b.childNodes], { back: () => go('active'), tabs: false, actions: false });

  const drawQuota = () => {
    const box = $('#qbox'); box.innerHTML = '';
    if (!q || q.state === 'no_quota') { box.append(quotaCard(true)); return; }
    const unit = q.unit === 'thb' ? 'บาท' : 'ลิตร', dg = q.unit === 'thb' ? 0 : 1;
    const add = q.unit === 'thb' ? (parseFloat($('#am').value) || 0) : (parseFloat($('#lt').value) || 0);
    const after = (q.used || 0) + add, lim = q.quota || 0;
    const pct = lim ? after / lim : 0;
    const col = pct >= 1 ? 'var(--r)' : pct >= .85 ? 'var(--warn)' : '#00713F';
    box.append(el(`<div class="card" style="border-color:${col}">
      <div class="note i" style="margin-bottom:9px"><span>🗺</span><span>
        <b>กรุณาวางแผนการเดินทางอย่างรอบคอบทุกครั้งก่อนเดินทาง</b></span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span>${pct >= 1 ? '⛔' : pct >= .85 ? '⚠️' : '✅'}</span>
        <div class="vl" style="color:${col};flex:1">${add > 0
          ? `เติมครั้งนี้แล้วจะใช้โควต้าไป ${Math.round(pct * 100)}%`
          : `โควต้าเดือนนี้ใช้ไป ${Math.round((q.used_pct || 0) * 100)}%`}</div></div>
      <div class="lb" style="color:${col};margin-top:4px">${nf(after, dg)} / ${nf(lim, dg)} ${unit} ·
        ${pct >= 1 ? 'เกินโควต้า ' + nf(after - lim, dg) : 'เหลือ ' + nf(Math.max(lim - after, 0), dg)} ${unit}</div>
      </div>`));
  };
  drawQuota();

  const autofill = () => {
    const l = parseFloat($('#lt').value), a = parseFloat($('#am').value), p = parseFloat($('#pr').value);
    if (l && p && !a) $('#am').value = (l * p).toFixed(2);
    else if (l && a && !p && l > 0) $('#pr').value = (a / l).toFixed(2);
    else if (a && p && !l && p > 0) $('#lt').value = (a / p).toFixed(2);
    drawQuota();
  };
  ['lt', 'am', 'pr'].forEach(id => $('#' + id).oninput = autofill);

  $('#fp').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    photo = f;
    $('#fpph').outerHTML = `<img class="thumb" id="fpph" alt="สลิปน้ำมัน" src="${URL.createObjectURL(f)}">`;
    $('#fhint').textContent = 'กำลังให้ AI อ่านสลิป…';
    const r = await readImage(f, 'fuel_slip');
    ocr = r.data;
    if (r.status === 'read') {
      const d = r.data;
      if (d.liters) $('#lt').value = (+d.liters).toFixed(2);
      if (d.amount_thb) $('#am').value = (+d.amount_thb).toFixed(2);
      if (d.price_per_liter) $('#pr').value = (+d.price_per_liter).toFixed(2);
      if (d.station) $('#stn').value = d.station;
      $('#fhint').textContent = d.warning || 'AI อ่านสลิปแล้ว — ตรวจตัวเลขให้ตรงก่อนบันทึก';
      drawQuota();
    } else if (r.status === 'unreadable') {
      // สลิปยังให้กรอกเองได้ (ต่างจากรูปเลขไมล์ที่บังคับให้ถ่ายใหม่)
      // เพราะบางปั๊มพิมพ์สลิปจาง อ่านไม่ออกจริง ๆ แต่ยอดเงินยังต้องเบิกได้
      $('#fhint').innerHTML = '<b style="color:var(--stop)">ภาพสลิปไม่ชัด ระบบอ่านไม่ออก</b>' +
        ' — ถ้าถ่ายใหม่ให้ชัดกว่านี้ได้จะดีที่สุด หรือกรอกจำนวนลิตรและยอดเงินเอง';
    } else {
      $('#fhint').innerHTML = '<b style="color:var(--warn)">ยังตรวจรูปอัตโนมัติไม่ได้</b>' +
        ' (ไม่มีสัญญาณ หรือระบบอ่านรูปไม่พร้อม) กรุณากรอกตัวเลขเอง';
    }
  };

  $('#ok').onclick = async (e) => {
    const l = parseFloat($('#lt').value);
    if (!photo) return toast('ต้องถ่ายรูปสลิปน้ำมันก่อน', 1);
    if (!l || l <= 0 || l > 500) return toast('จำนวนลิตรไม่ถูกต้อง', 1);
    e.target.disabled = true; e.target.textContent = 'กำลังบันทึก…';
    const t = S.trip, fid = uuid();
    t.fuels.push({ id: fid, session_id: t.id, filled_at: new Date().toISOString(),
      liters: l, amount_thb: parseFloat($('#am').value) || null,
      price_per_liter: parseFloat($('#pr').value) || null,
      station: $('#stn').value.trim() || null,
      odo_at_fill: parseInt($('#fodo').value.replace(/\D/g, ''), 10) || null,
      paid_by: pickedVehicle()?.ownership === 'company' ? 'fleet_card' : 'own',
      ai_raw: ocr || null, _dirty: 1 });
    await queuePhoto(t.id, 'fuel_slip', photo, S.lastPos?.coords, ocr);
    t.media[t.media.length - 1].fuel_id = fid;
    saveTrip(); await sync(); await refreshQuota();
    toast('บันทึกการเติมน้ำมันแล้ว'); go('active');
  };
}

/* ---------------- สิ้นสุดการทำงาน ---------------- */
function viewTripEnd() {
  const t = S.trip;
  let photo = null, ocr = null, pos = null, photoOk = false;
  const b = el(`<main>
    <div class="row">
      <div class="stat"><div class="lb">เวลาทั้งหมด</div><div class="v">${dur(Date.now() - new Date(t.startAt))}</div></div>
      <div class="stat"><div class="lb">ระยะ GPS</div><div class="v">${nf(t.distM / 1000)}<small>กม.</small></div></div></div>
    <div class="card" id="pc"><h3>จุดสิ้นสุดการทำงาน</h3><div class="lb" id="pv">กำลังจับสัญญาณ GPS…</div></div>
    <div class="card"><h3>เลขไมล์ปลายทาง</h3>
      <div class="sub">เลขไมล์ต้นทางที่บันทึกไว้: <b class="mono">${ni(t.odo_start)}</b> กม.</div>
      ${photoField('ep', 'ยังไม่ได้ถ่ายรูปเลขไมล์ปลายทาง')}
      <label class="f big" style="margin-top:11px"><span>เลขไมล์ปลายทาง (กม.)</span>
        <input id="odo" inputmode="numeric" maxlength="7"></label>
      <div class="hint" id="eh">AI จะเติมให้จากรูป — เลขที่กรอกต้องตรงกับรูป</div>
      <div id="warn"></div></div>
    <label class="f"><span>หมายเหตุปิดงาน (ไม่บังคับ)</span>
      <textarea id="nt"></textarea></label>
    <button class="btn stop lg" id="ok">ยืนยันสิ้นสุดการทำงาน</button>
  </main>`);
  shell('สิ้นสุดการทำงาน', [...b.childNodes], { back: () => go('active'), tabs: false, actions: false });

  getPos(15000).then(p => { pos = p;
    $('#pv').innerHTML = `${thDate(new Date())} ${thSec(new Date())}<br>
      <span class="mono">${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}</span> (± ${Math.round(p.coords.accuracy)} ม.)`;
  }).catch(() => { pos = S.lastPos; $('#pv').textContent = pos ? 'ใช้พิกัดล่าสุดที่บันทึกไว้' : 'จับพิกัดไม่ได้'; });

  const checkOdo = () => {
    const e2 = parseInt($('#odo').value.replace(/\D/g, ''), 10);
    const w = $('#warn'); w.innerHTML = '';

    // เลขที่พิมพ์ต้องตรงกับรูป — กฎเดียวกับตอนเริ่มงาน
    // ปลายทางคือจุดที่อ้างระยะทางเพื่อเบิกเงิน จึงต้องคุมเข้มเท่ากัน
    const mis = e2 ? odoMismatch(e2, ocr?.odometer_km ?? null) : null;
    $('#ok').disabled = !!mis;
    if (mis) {
      w.innerHTML = `<div class="note e" style="margin-top:9px"><span>⛔</span><span>${esc(mis)}</span></div>`;
      return;
    }
    if (!e2 || !t.odo_start) return;
    if (e2 < t.odo_start) { w.append(el(`<div class="note e" style="margin-top:9px"><span>⛔</span><span>
      เลขไมล์ปลายทาง (${ni(e2)}) น้อยกว่าต้นทาง (${ni(t.odo_start)}) — ตรวจสอบรูปอีกครั้ง</span></div>`)); return; }
    const odoKm = e2 - t.odo_start, gps = t.distM / 1000;
    if (gps < 1) return;
    const gap = Math.abs(odoKm - gps) / gps;
    if (gap > CFG.odoGapWarnPct) w.append(el(`<div class="note e" style="margin-top:9px"><span>🚩</span><span>
      ระยะจากเลขไมล์ ${ni(odoKm)} กม. ต่างจากระยะ GPS ${nf(gps)} กม. (${Math.round(gap * 100)}%)
      เกินเกณฑ์ ${Math.round(CFG.odoGapWarnPct * 100)}% —
      ระบบจะบันทึกทั้งสองค่า ติดธงไว้ และ<b>แจ้งหัวหน้างานอัตโนมัติ</b></span></div>`));
  };
  $('#odo').oninput = checkOdo;

  $('#ep').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const stale = freshPhotoProblem(f);
    if (stale) {
      e.target.value = '';
      $('#eh').innerHTML = `<b style="color:var(--r)">${esc(stale)}</b>`;
      return toast(stale, 1, 8000);
    }
    photo = f; photoOk = false; ocr = null;
    $('#epph').outerHTML = `<img class="thumb" id="epph" alt="เลขไมล์ปลายทาง" src="${URL.createObjectURL(f)}">`;
    $('#eh').textContent = 'กำลังให้ AI อ่านเลขไมล์…';
    $('#ok').disabled = true;
    const r = await readImage(f, 'odometer');
    ocr = r.data;
    if (r.status === 'read') {
      photoOk = true;
      $('#odo').value = r.data.odometer_km;
      $('#eh').innerHTML = `AI อ่านได้ <b>${r.data.odometer_km}</b> · ความมั่นใจ ${
        r.data.confidence || '-'} — ถ้าอ่านผิดให้ถ่ายรูปใหม่ ไม่ใช่แก้ตัวเลข`;
      checkOdo();
    } else if (r.status === 'unreadable') {
      // AI อ่านไม่ได้ -> ให้กรอกเอง (รูปถูกเก็บ หัวหน้าตรวจเทียบรูปได้)
      photoOk = true;
      $('#warn').innerHTML = '';
      $('#eh').innerHTML = '<b style="color:var(--warn)">AI อ่านเลขจากรูปนี้ไม่ได้</b>'
        + ' — ถ้ารูปเบลอ/ย้อนแสง แนะนำถ่ายใหม่ให้ชัด หรือ<b>กรอกเลขไมล์เอง</b>'
        + ' (รูปถูกบันทึกไว้แล้ว หัวหน้าจะตรวจเทียบกับรูป)';
    } else {
      photoOk = true;
      $('#eh').innerHTML = '<b style="color:var(--warn)">ยังตรวจรูปอัตโนมัติไม่ได้</b>' +
        ' (ไม่มีสัญญาณ หรือระบบอ่านรูปไม่พร้อม) กรุณากรอกเลขไมล์เอง';
    }
    $('#ok').disabled = false;
  };

  $('#ok').onclick = async (e) => {
    const odo = parseInt($('#odo').value.replace(/\D/g, ''), 10);
    if (!photo) return toast('ต้องถ่ายรูปเลขไมล์ปลายทางก่อน', 1);
    if (!photoOk) return toast('รูปเลขไมล์ไม่ชัด กรุณาถ่ายใหม่ให้เห็นตัวเลขชัดเจน', 1);
    if (!odo) return toast('กรอกเลขไมล์ปลายทาง', 1);
    if (t.odo_start && odo < t.odo_start) return toast('เลขไมล์ปลายทางน้อยกว่าต้นทาง', 1);
    const misEnd = odoMismatch(odo, ocr?.odometer_km ?? null);
    if (misEnd) return toast(misEnd, 1, 8000);
    const open = t.stops.filter(s => !s.job_type_code).length;

    // ระยะต่างเกินเกณฑ์ = ต้องยืนยันแยกอีกชั้น ไม่ให้กดผ่านไปโดยไม่ทันอ่าน
    const gpsKm = t.distM / 1000;
    const odoKm = t.odo_start ? odo - t.odo_start : null;
    const gap = (odoKm != null && gpsKm > 1) ? Math.abs(odoKm - gpsKm) / gpsKm : null;
    if (gap != null && gap > CFG.odoGapWarnPct) {
      const ok = await askConfirm('ระยะทางไม่ตรงกัน',
        'ระยะจากเลขไมล์ ' + ni(odoKm) + ' กม.\n'
        + 'ระยะที่ GPS บันทึกได้ ' + nf(gpsKm) + ' กม.\n'
        + 'ต่างกัน ' + Math.round(gap * 100) + '% (เกณฑ์ที่ยอมรับได้ '
        + Math.round(CFG.odoGapWarnPct * 100) + '%)\n\n'
        + 'ระบบจะบันทึกทั้งสองค่าและรายงานหัวหน้างานให้ตรวจสอบ\n'
        + 'ถ้ามีเหตุผล เช่น สัญญาณ GPS หลุดระหว่างทาง ให้เขียนไว้ในหมายเหตุปิดงาน',
        'รับทราบ และปิดงาน', true);
      if (!ok) return;
    }

    const msg = 'ปิดแล้วจะแก้ไขข้อมูลทริปนี้ไม่ได้อีก\n\nระยะทาง GPS: ' + nf(gpsKm) + ' กม.'
      + (odoKm != null ? '\nระยะจากเลขไมล์: ' + ni(odoKm) + ' กม.' : '')
      + (open ? '\n\nยังมีจุดที่แวะ ' + open + ' จุดที่ยังไม่ได้ระบุ' : '')
      + '\n\nระบบจะแจ้งหัวหน้างานว่าคุณปิดงานแล้ว';
    if (!await askConfirm('ยืนยันสิ้นสุดการทำงาน?', msg, 'ปิดงาน', true)) return;
    e.target.disabled = true; e.target.textContent = 'กำลังปิดงาน…';

    const c = pos?.coords || S.lastPos?.coords || {};
    await queuePhoto(t.id, 'odo_end', photo, c, ocr);
    t.status = 'ended';
    t.end_at = new Date().toISOString();
    t.end_lat = c.latitude ?? null; t.end_lng = c.longitude ?? null; t.end_accuracy_m = c.accuracy ?? null;
    t.odo_end = odo; t.odo_end_ai = ocr?.odometer_km ?? null;
    t.note = $('#nt').value.trim() || null;
    // ดึงพิกัดที่เปลือกแอปเก็บไว้ตอนล็อกจอ/สลับแอป ให้ครบก่อนสรุป
    // (ถ้าไม่รอ จุดเบื้องหลังจะยังค้างใน buffer แล้วสรุปเห็นเป็นสัญญาณขาด)
    if (NATIVE.on) { try { await drainNativePoints(); } catch {} }
    detectDwellStops(t);   // จับจุดจอดนานที่ยังไม่ถูก mark (รวมช่วงที่อยู่เบื้องหลัง)
    stopWatch(); saveTrip();

    const done = { ...t };
    // ล้าง state ในเครื่องก่อน แล้วโชว์สรุปทันทีจากข้อมูลในเครื่อง
    // ไม่รอเน็ต — sync/quota ทำเบื้องหลัง (คิวออฟไลน์กันข้อมูลหายอยู่แล้ว)
    LS.set('lastTrip', done); LS.del('trip'); S.trip = null;
    S.dwellAnchor = null; S.dwellStopId = null;
    viewSummary(done, true);
    // ปิดงานให้จบแบบชัวร์ 3 ชั้น (กันบั๊ก "ปิดแล้วยังขึ้นกำลังทำงาน"):
    //   1) sync() — ดันสถานะ ended + จุด + รูปขึ้น server (อาจล้มถ้าติดเงื่อนไขบางฟิลด์)
    //   2) update ตรง ๆ เฉพาะ status/end_at — ฟิลด์น้อย โอกาสสำเร็จสูงสุด (RLS ให้แก้ทริปตัวเองที่ยัง active ได้)
    //   3) RPC close_my_active_session — การันตีฝั่ง server (เผื่อ 1–2 ล้ม)
    finalizeClose(done);
  };
}

/* ปิดงานให้จบฝั่งเซิร์ฟเวอร์แบบชัวร์ + เก็บ error ไว้ดูในหน้า "สถานะการซิงค์" */
async function finalizeClose(done) {
  S.lastCloseError = null;
  // ส่งจุดพิกัด/รูป/น้ำมันขึ้นระบบก่อน (best effort — ล้มก็ยังปิดงานต่อได้)
  try { await sync(); } catch (e) { S.lastCloseError = 'sync: ' + (e?.message || e); }
  // ปิดงานด้วย RPC ที่ปิดสำเร็จทุกครั้ง (ปิด trigger ชั่วคราว + idempotent)
  // ถ้า RPC สำเร็จ ให้ถือว่าปิดงานเสร็จสมบูรณ์ และล้าง error จากขั้น sync ทิ้ง
  try {
    const { data, error } = await sb.rpc('close_my_active_session', { p_note: done.note || null });
    if (error) S.lastCloseError = 'rpc: ' + error.message;
    else if (data && data.ok === true) S.lastCloseError = null;      // ปิดสำเร็จแน่นอน
    else S.lastCloseError = 'ปิดงานไม่สำเร็จ: ' + (data?.error || data?.code || 'ไม่ทราบสาเหตุ');
  } catch (e) { S.lastCloseError = 'rpc: ' + (e?.message || e); }
  try { await refreshQuota(); } catch {}
  if (S.lastCloseError) {
    console.warn('finalizeClose', S.lastCloseError);
    // แจ้งให้เห็นชัด ๆ พร้อมสาเหตุจริง — จะได้ไม่เข้าใจผิดว่าปิดแล้วทั้งที่ยังค้าง
    toast('ปิดงานขึ้นระบบไม่สำเร็จ — ' + S.lastCloseError
      + '\nไปที่ ตั้งค่า › สถานะการซิงค์ เพื่อปิดงานที่ค้างอีกครั้ง', 1, 12000);
  }
}

      — เส้นตรงบนแผนที่คือการเชื่อมสองจุด ไม่ใช่เส้นทางจริง ระยะทางช่วงนั้นไม่ถูกนับ<br>

/* วาดเส้นทางบนแผนที่จริง ซูมเข้าออก ลากดูได้เหมือนแอปแผนที่ทั่วไป
   pts = [[lat,lng], ...]  ·  stops = [{arrive_lat, arrive_lng, seq, ...}]
   คืน true ถ้าวาดได้ / false ถ้า Leaflet ยังไม่พร้อม (ให้ผู้เรียกถอยไป canvas) */
/* แยกเส้นทางเป็นช่วง ๆ ตามเวลาที่ขาดหาย
   รับได้ทั้ง [lat,lng] (ไม่มีเวลา) และ {lat,lng,at} / [lat,lng,epoch]
   คืน { segs: [[[la,ln],...], ...], blindSec, gaps: [{from,to,sec}] } */
function splitByGaps(raw) {
  const pts = (raw || []).map(p => Array.isArray(p)
    ? { ll: [p[0], p[1]], t: p[2] != null ? Number(p[2]) : null }
    : { ll: [p.lat, p.lng], t: p.at ? new Date(p.at).getTime() : null })
    .filter(p => p.ll[0] != null && p.ll[1] != null);

  const segs = [], gaps = [];
  let cur = [], blindSec = 0, stationarySec = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], prev = pts[i - 1];
    const gapSec = (prev && p.t && prev.t) ? (p.t - prev.t) / 1000 : 0;
    if (gapSec > CFG.gpsBlindGapSec) {
      // เตือนเฉพาะเมื่อ "ระยะที่หายไป" มีนัยสำคัญ (ปลายสองจุดห่างกันมาก
      // = ขยับไกลระหว่างที่ไม่มีจุด สัญญาณขาดจริงตอนวิ่ง เช่น อุโมงค์/พื้นที่อับ)
      // ปลายใกล้กัน = จอดนิ่ง/รถติดคลาน เปลือกแอปไม่ส่งจุดเพราะขยับน้อย ไม่ใช่สัญญาณหลุด
      const movedM = haversineM(prev.ll[0], prev.ll[1], p.ll[0], p.ll[1]);
      if (movedM > 250) {
        if (cur.length) segs.push(cur);
        gaps.push({ from: prev.ll, to: p.ll, sec: gapSec });
        blindSec += gapSec;
        cur = [];
      } else {
        // จอดนิ่ง — ต่อเส้นตามปกติ ไม่ถือเป็นช่วงขาดสัญญาณ
        stationarySec += gapSec;
      }
    }
    cur.push(p.ll);
  }
  if (cur.length) segs.push(cur);
  return { segs, gaps, blindSec, stationarySec, all: pts.map(p => p.ll) };
}

function renderMap(box, pts, stops) {
  if (!box || typeof L === 'undefined' || !pts || pts.length < 2) return false;
  try {
    const map = L.map(box, { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap',
    }).addTo(map);

    const { segs, gaps, all } = splitByGaps(pts);

    // ช่วงที่บันทึกได้จริง = เส้นทึบสีแดง
    segs.filter(sg => sg.length > 1).forEach(sg =>
      L.polyline(sg, { color: '#E30613', weight: 5, opacity: .85 }).addTo(map));

    // ช่วงที่ขาดสัญญาณ = เส้นประสีเทา บอกให้รู้ว่าระบบไม่รู้ว่าไปทางไหน
    gaps.forEach(g => {
      L.polyline([g.from, g.to], {
        color: '#8A94A1', weight: 4, opacity: .8, dashArray: '6 9',
      }).addTo(map).bindPopup(
        '<b>ไม่ได้รับสัญญาณ ' + Math.round(g.sec / 60) + ' นาที</b><br>'
        + 'ระบบไม่รู้ว่าเดินทางเส้นทางไหนในช่วงนี้<br>เส้นประคือเส้นตรงระหว่างสองจุด');
      L.circleMarker(g.from, {
        radius: 6, color: '#fff', weight: 2, fillColor: '#8A94A1', fillOpacity: 1,
      }).addTo(map).bindPopup('สัญญาณขาดตรงนี้');
    });

    const line = L.polyline(all, { opacity: 0 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [26, 26] });

    const pin = (ll, color, label) => L.circleMarker(ll, {
      radius: 8, color: '#fff', weight: 3, fillColor: color, fillOpacity: 1,
    }).addTo(map).bindPopup(label);

    pin(all[0], '#00A651', 'เริ่มปฏิบัติงาน');
    pin(all[all.length - 1], '#C00510', 'สิ้นสุดการทำงาน');

    (stops || []).forEach(st => {
      const la = st.arrive_lat, ln = st.arrive_lng;
      if (la == null || ln == null) return;
      L.circleMarker([la, ln], {
        radius: 7, color: '#fff', weight: 2.5,
        fillColor: st.job_type_code ? '#1B3A93' : '#C9A227', fillOpacity: 1,
      }).addTo(map).bindPopup(
        `<b>จุดที่ ${st.seq || '?'}</b><br>${esc(st.job_name || st.job_type_code || 'ยังไม่ระบุประเภทงาน')}`
        + (st.place_label ? '<br>' + esc(st.place_label) : ''));
    });

    // เปิดจากในการ์ดที่เพิ่งถูกเพิ่มเข้า DOM ขนาดยังไม่นิ่ง ต้องบอกให้วัดใหม่
    setTimeout(() => map.invalidateSize(), 120);
    return true;
  } catch (e) {
    console.warn('map', e?.message);
    return false;
  }
}

function drawRoute(cv, t) {
  if (!cv) return;
  const pts = (t.points || []).filter(p => p.lat && p.lng);
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.fillStyle = '#E9EFE8'; g.fillRect(0, 0, w, h);
  if (pts.length < 2) {
    g.fillStyle = '#8A94A1'; g.font = '13px sans-serif'; g.textAlign = 'center';
    g.fillText('จุดพิกัดน้อยเกินไป ยังวาดเส้นทางไม่ได้', w / 2, h / 2); return;
  }
  const la = pts.map(p => p.lat), ln = pts.map(p => p.lng);
  const minLa = Math.min(...la), maxLa = Math.max(...la), minLn = Math.min(...ln), maxLn = Math.max(...ln);
  const pad = 18;
  const sx = (maxLn - minLn) || 1e-6, sy = (maxLa - minLa) || 1e-6;
  const sc = Math.min((w - pad * 2) / sx, (h - pad * 2) / sy);
  const X = x => pad + (x - minLn) * sc + ((w - pad * 2) - sx * sc) / 2;
  const Y = y => h - pad - (y - minLa) * sc - ((h - pad * 2) - sy * sc) / 2;

  g.strokeStyle = '#D3DCD2'; g.lineWidth = 5;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, h * i / 4); g.lineTo(w, h * i / 4); g.stroke(); }
  g.strokeStyle = '#E30613'; g.lineWidth = 3.4; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(X(pts[0].lng), Y(pts[0].lat));
  pts.slice(1).forEach(p => g.lineTo(X(p.lng), Y(p.lat))); g.stroke();

  const dot = (x, y, col, r = 6) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = col; g.fill();
    g.lineWidth = 2.4; g.strokeStyle = '#fff'; g.stroke(); };
  (t.stops || []).forEach(s => { if (s.arrive_lat)
    dot(X(s.arrive_lng), Y(s.arrive_lat), s.job_type_code ? '#fff' : '#C9A227', 5); });
  dot(X(pts[0].lng), Y(pts[0].lat), '#00A651');
  dot(X(pts[pts.length - 1].lng), Y(pts[pts.length - 1].lat), '#C00510');
}

/* หัวหน้า (หรือเจ้าตัว/Admin) เปิดดูรายละเอียดทริปจากกล่องแจ้งเตือน
   ตรวจสิทธิ์ที่ฝั่งฐานข้อมูลใน session_detail() ไม่ใช่ที่หน้าจอ */
async function viewSessionDetail(sessionId, opts = {}) {
  const back = opts.back || (() => go('alerts'));
  loading('กำลังโหลดรายละเอียดการเดินทาง…');
  let d = null;
  try {
    const { data } = await sb.rpc('session_detail', { p_session_id: sessionId });
    d = data;
  } catch (e) {
    return shell('รายละเอียดการเดินทาง',
      [el(`<div class="note e"><span>⚠</span><span>โหลดไม่ได้: ${esc(String(e?.message || e))}
        <br>ยังไม่ได้รัน sql/23_trip_alerts.sql หรือเปล่า</span></div>`)],
      { back });
  }
  if (d?.ok !== true) {
    return shell('รายละเอียดการเดินทาง', [el(`<div class="note e"><span>🔒</span><span>${
      d?.code === 'NOT_ALLOWED' ? 'คุณไม่มีสิทธิ์ดูทริปนี้' : 'ไม่พบทริปนี้'}</span></div>`)],
      { back });
  }

  const w = d.session || {}, own = d.owner || {};
  const gpsKm = (w.gps_distance_m || 0) / 1000;
  const odoKm = (w.odo_end && w.odo_start) ? w.odo_end - w.odo_start : null;
  const gap = (odoKm != null && gpsKm > 1) ? Math.abs(odoKm - gpsKm) / gpsKm : null;
  const pts = (d.points || []).filter(p => Array.isArray(p) && p.length === 2);

  const nodes = [
    el(`<div class="card"><h3>${esc(own.full_name || '—')}</h3>
      <div class="lb mono">${esc(own.employee_code || '')}</div>
      <div class="lb" style="margin-top:6px">${w.start_at ? thDT(new Date(w.start_at)) : ''}
        ${w.end_at ? ' → ' + thTime(new Date(w.end_at)) : ''}</div></div>`),

    el(`<div class="row">
      <div class="stat"><div class="lb">ระยะ GPS</div><div class="v">${nf(gpsKm)}<small>กม.</small></div></div>
      <div class="stat"><div class="lb">ระยะจากเลขไมล์</div><div class="v">${
        odoKm != null ? ni(odoKm) : '—'}<small>กม.</small></div></div></div>`),
  ];

  if (gap != null && gap > CFG.odoGapWarnPct) {
    nodes.push(el(`<div class="note e"><span>🚩</span><span>
      <b>ระยะทางต่างกัน ${Math.round(gap * 100)}%</b> เกินเกณฑ์ ${
      Math.round(CFG.odoGapWarnPct * 100)}% — เลขไมล์ ${ni(w.odo_start)} → ${ni(w.odo_end)}
      ${w.note ? '<br>หมายเหตุจากพนักงาน: ' + esc(w.note) : '<br>พนักงานไม่ได้ระบุหมายเหตุ'}</span></div>`));
  } else if (w.note) {
    nodes.push(el(`<div class="note i"><span>📝</span><span>${esc(w.note)}</span></div>`));
  }
  if (w.auto_closed) {
    nodes.push(el(`<div class="note w"><span>🌙</span><span>
      ทริปนี้ระบบปิดให้อัตโนมัติ พนักงานไม่ได้กดปิดเอง</span></div>`));
  }

  // --- ตรวจเลขไมล์ที่กรอก เทียบกับรูปหน้าปัด (สำหรับหัวหน้า/Admin) ---
  const odoDefs = [
    { label: 'เลขไมล์ต้นทาง', typed: w.odo_start, ai: w.odo_start_ai, kind: 'odo_start' },
    { label: 'เลขไมล์ปลายทาง', typed: w.odo_end, ai: w.odo_end_ai, kind: 'odo_end' },
  ];
  const odoMedia = d.odo_media || [];
  const odoCards = [];
  for (const o of odoDefs) {
    if (o.typed == null && o.ai == null && !odoMedia.some(x => x.kind === o.kind)) continue;
    const m = odoMedia.find(x => x.kind === o.kind);
    let url = null;
    if (m?.path) {
      try { const { data: su } = await sb.storage.from(CFG.bucket).createSignedUrl(m.path, 600);
        url = su?.signedUrl || null; } catch {}
    }
    const aiVal = o.ai != null ? o.ai : (m?.ai?.odometer_km ?? null);
    const match = (o.typed != null && aiVal != null) ? (Number(o.typed) === Number(aiVal)) : null;
    const badge = match === true ? '<span class="pill g">✅ ตรงกับรูป</span>'
      : match === false ? '<span class="pill e">🚩 ไม่ตรงกับรูป</span>'
      : '<span class="pill n">AI อ่านไม่ได้ — ดูจากรูป</span>';
    odoCards.push(`<div style="border-top:1px solid #EEF0F3;padding:11px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1"><div class="lb">${o.label}</div>
          <div class="vl" style="font-size:16px">${o.typed != null ? ni(o.typed) : '—'}
            <span class="lb">กม. (พนักงานกรอก)</span></div>
          <div class="lb">AI อ่านจากรูป: ${aiVal != null ? ni(aiVal) : '—'}</div></div>
        ${badge}</div>
      ${url ? `<a href="${esc(url)}" ${NATIVE.on ? '' : 'target="_blank" rel="noopener"'}>
        <img src="${esc(url)}" alt="รูปเลขไมล์" loading="lazy"
          style="width:100%;max-height:230px;object-fit:contain;border-radius:10px;margin-top:8px;background:#111"></a>`
        : '<div class="lb" style="margin-top:6px">— ไม่มีรูปหน้าปัด —</div>'}</div>`);
  }
  if (odoCards.length) nodes.push(el(`<div class="card"><h3>ตรวจเลขไมล์กับรูปหน้าปัด</h3>
    <div class="sub">แตะรูปเพื่อดูเต็ม · <b>"ตรงกับรูป"</b> = เลขที่พนักงานกรอกตรงกับที่ AI อ่านได้ตอนถ่าย
      (ระบบบังคับให้ตรงตั้งแต่ถ่าย ถ้าขึ้น "ไม่ตรง" แปลว่ามีการแก้ภายหลัง ควรตรวจสอบ)</div>
    ${odoCards.join('')}</div>`));

  const bl = splitByGaps(pts);
  const blMin = Math.round(bl.blindSec / 60);
  nodes.push(el(`<div class="card"><h3>เส้นทางการเดินทาง</h3>
    <div class="sub">${pts.length} จุดพิกัด — ซูมเข้าออกและลากดูได้</div>
    <div class="map" id="dmap"></div>
    ${blMin >= 2 ? `<div class="note w" style="margin-top:9px"><span>📵</span><span>
      <b>สัญญาณ GPS ขาดช่วงระหว่างเคลื่อนที่รวม ${blMin} นาที</b> (${bl.gaps.length} ช่วง)
      — เส้นตรงคือการเชื่อมสองจุด ไม่ใช่เส้นทางจริง
      ระยะ GPS ที่เห็นจึงต่ำกว่าระยะที่วิ่งจริงในช่วงนั้น (ช่วงจอดนิ่งไม่นับ)</span></div>` : ''}
    </div>`));

  nodes.push(el(`<div class="card"><h3>จุดปฏิบัติงาน ${(d.stops || []).length} จุด</h3>
    <div class="list">${(d.stops || []).map(st => `<div class="item">
      <div class="n ${st.job_type_code ? '' : 'q'}">${st.seq || '?'}</div>
      <div class="tx"><div class="h">${esc(st.job_name || st.job_type_code || 'ยังไม่ระบุประเภทงาน')}</div>
        <div class="s">${st.store_code ? esc(st.store_code) + ' · ' : ''}${esc(st.place_label || '')}<br>
          เข้า ${st.arrive_at ? thTime(new Date(st.arrive_at)) : '-'}${
          st.depart_at ? ' → ออก ' + thTime(new Date(st.depart_at)) : ' (ยังไม่ได้ปิดจุด)'}
          ${st.note ? '<br>' + esc(st.note) : ''}</div></div></div>`).join('')
      || '<div class="lb">ไม่มีจุดปฏิบัติงานในทริปนี้</div>'}</div></div>`));

  if ((d.fuels || []).length) {
    nodes.push(el(`<div class="card"><h3>การเติมน้ำมัน</h3><div class="list">${
      d.fuels.map(f => `<div class="item"><div class="tx">
        <div class="h">${nf(f.liters, 2)} ลิตร${f.amount_thb ? ' · ' + nf(f.amount_thb, 2) + ' บาท' : ''}</div>
        <div class="s">${f.filled_at ? thDT(new Date(f.filled_at)) : ''}${
          f.station_name ? ' · ' + esc(f.station_name) : ''}</div></div></div>`).join('')}</div></div>`));
  }

  // superadmin: ลบทริปที่ error ของ user คนใดก็ได้ (ลบจริง + ลบรูป + บันทึก audit)
  if (S.profile.role === 'superadmin') {
    nodes.push(el(`<div class="card" style="border:1px solid #F3C2C2">
      <h3 style="color:var(--r)">ลบบันทึกการปฏิบัติงานนี้</h3>
      <div class="sub">ใช้เมื่อทริปนี้ผิดพลาด (เช่น GPS เพี้ยน ทดสอบ ซ้ำ) — ลบถาวรพร้อมพิกัด/จุดงาน/น้ำมัน/รูปทั้งหมด กู้คืนไม่ได้</div>
      <button class="btn stop" id="delses" style="margin-top:10px">🗑 ลบทริปนี้ถาวร</button></div>`));
  }

  shell('รายละเอียดการเดินทาง', nodes, { back });
  if (!renderMap($('#dmap'), pts, d.stops)) {
    $('#dmap').innerHTML = '<div class="lb" style="padding:14px;text-align:center">'
      + 'แสดงแผนที่ไม่ได้ตอนนี้ — ต้องมีสัญญาณอินเทอร์เน็ต</div>';
  }
  if ($('#delses')) $('#delses').onclick = async () => {
    const who = `${own.full_name || ''} ${own.employee_code || ''}`.trim();
    if (!await askConfirm('ลบทริปถาวร',
      `จะลบทริปของ ${who}\nวันที่ ${w.start_at ? thDT(new Date(w.start_at)) : ''}\n\n`
      + 'ข้อมูลพิกัด จุดงาน การเติมน้ำมัน และรูปทั้งหมดจะถูกลบถาวร กู้คืนไม่ได้', 'ลบถาวร', true)) return;
    const reason = await askText('เหตุผลการลบ', 'ระบุเหตุผล (เก็บใน audit log)', 'เช่น GPS เพี้ยน / ทดสอบ / ทริปซ้ำ', true);
    if (reason === null) return;
    loading('กำลังลบทริป…');
    try {
      const { data, error } = await sb.rpc('admin_delete_session',
        { p_session_id: sessionId, p_reason: reason });
      if (error || (data?.ok !== true)) {
        const msg = { NOT_SUPERADMIN: 'เฉพาะ superadmin เท่านั้น' }[data?.code]
          || data?.error || error?.message || data?.code || 'ไม่ทราบสาเหตุ';
        toast('ลบไม่สำเร็จ: ' + msg, 1, 8000); return back();
      }
      toast('ลบทริปเรียบร้อยแล้ว' + (data.files_removed ? ` (ลบรูป ${data.files_removed} ไฟล์)` : ''));
    } catch (e) { toast('ลบไม่สำเร็จ: ' + (e?.message || e), 1, 8000); }
    back();
  };
}

async function viewHistory() {
  S.tab = 'history'; loading('กำลังโหลดประวัติ…');
  let rows = [];
  try {
    const { data } = await sb.from('work_sessions').select('*')
      .eq('user_id', S.profile.id).order('start_at', { ascending: false }).limit(60);
    rows = data || [];
  } catch { toast('ดึงประวัติจากเซิร์ฟเวอร์ไม่ได้', 1); }
  // แสดง lastTrip ที่ค้างในเครื่องเฉพาะของเจ้าของบัญชีนี้เท่านั้น (กันข้อมูลข้ามคน)
  const last = LS.get('lastTrip');
  if (last && last.user_id === S.profile.id && !rows.some(r => r.id === last.id))
    rows.unshift({ ...last, start_at: last.startAt });

  // จัดกลุ่มตามเดือน (MMM-YY เช่น Aug-26) แล้วแสดงแต่ละเดือนแยกกัน
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthKey = d => MON[d.getMonth()] + '-' + String(d.getFullYear() % 100).padStart(2, '0');

  const tripCard = (r) => {
    const st = new Date(r.start_at), km = (r.gps_distance_m || r.distM || 0) / 1000;
    const flagged = r.mock_detected || r.auto_closed;
    return el(`<div class="card" data-id="${esc(r.id)}" style="cursor:pointer${flagged ? ';border-color:var(--warn)' : ''}">
      <div style="display:flex;align-items:center"><h3 style="flex:1">${thDate(st)}</h3>
        <span class="pill ${r.status === 'active' ? 'g' : r.status === 'auto_closed' ? 'w' : 'n'}">${
          r.status === 'active' ? 'กำลังทำงาน' : r.status === 'auto_closed' ? 'ระบบปิดให้' : 'ปิดงานแล้ว'}</span></div>
      <div class="lb" style="margin-top:5px">🕐 ${thTime(st)} → ${r.end_at ? thTime(new Date(r.end_at)) : '—'}
        &nbsp;·&nbsp; 🛣 <b>${nf(km)} กม.</b></div></div>`);
  };

  let nodes;
  if (!rows.length) {
    nodes = [el('<div class="note i"><span>📭</span><span>ยังไม่มีประวัติการเดินทาง</span></div>')];
  } else {
    nodes = [];
    let curMonth = null;
    for (const r of rows) {
      const mk = monthKey(new Date(r.start_at));
      if (mk !== curMonth) {
        curMonth = mk;
        // สรุประยะรวมของเดือนนั้น
        const monKm = rows.filter(x => monthKey(new Date(x.start_at)) === mk)
          .reduce((a, x) => a + (x.gps_distance_m || x.distM || 0) / 1000, 0);
        const monN = rows.filter(x => monthKey(new Date(x.start_at)) === mk).length;
        nodes.push(el(`<div style="display:flex;align-items:baseline;gap:8px;margin:6px 2px 2px">
          <div style="font-size:17px;font-weight:800">${mk}</div>
          <div class="lb">${monN} ทริป · รวม ${nf(monKm)} กม.</div></div>`));
      }
      nodes.push(tripCard(r));
    }
  }

  shell('ประวัติการเดินทาง', nodes, { tabs: true });
  document.querySelectorAll('[data-id]').forEach(n => n.onclick = async () => {
    const r = rows.find(x => x.id === n.dataset.id);
    if (r.points) return viewSummary(r);
    loading('กำลังโหลดทริป…');
    const [pts, sts, fus] = await Promise.all([
      sb.from('session_points').select('at,lat,lng').eq('session_id', r.id).order('at'),
      sb.from('stops').select('*').eq('session_id', r.id).order('seq'),
      sb.from('fuel_records').select('*').eq('session_id', r.id),
    ]);
    viewSummary({ ...r, startAt: r.start_at, points: pts.data || [], stops: sts.data || [], fuels: fus.data || [] });
  });
}

async function viewAlerts() {

  const { data } = await sb.from('alerts').select('*')
    .eq('to_user', S.profile.id).order('created_at', { ascending: false }).limit(60);

      <div style="display:flex;gap:10px">

          <div class="vl" style="margin-top:5px">${esc(a.title)}</div>
          ${a.body ? `<div class="lb" style="white-space:pre-line">${esc(a.body)}</div>` : ''}
          ${a.session_id ? `<button class="link" data-sd="${esc(a.session_id)}"
              style="padding:6px 0 0">ดูรายละเอียดการเดินทาง ›</button>` : ''}</div>
        ${a.read_at ? '' : '<span style="width:9px;height:9px;border-radius:50%;background:var(--r);flex:none;margin-top:5px"></span>'}
      </div></div>`))
    : [el('<div class="note i"><span>🔔</span><span>ยังไม่มีการแจ้งเตือน</span></div>')];
  nodes.unshift(el('<button class="btn gh" id="rall">ทำเครื่องหมายว่าอ่านทั้งหมด</button>'));
  shell('กล่องแจ้งเตือน', nodes, { tabs: true });
  document.querySelectorAll('[data-sd]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    viewSessionDetail(b.dataset.sd);
  });
  $('#rall').onclick = async () => {
    await sb.from('alerts').update({ read_at: new Date().toISOString() })
      .eq('to_user', S.profile.id).is('read_at', null);
    await refreshCounts(); go('alerts');
  };
  document.querySelectorAll('[data-a]').forEach(n => n.onclick = async () => {
    await sb.from('alerts').update({ read_at: new Date().toISOString() }).eq('id', n.dataset.a);
    await refreshCounts(); go('alerts');
  });
}

const REQ_TYPES = [
  ['fleet_card', 'เปลี่ยนเลข Fleet card', 'บัตรชำรุด / บัตรหาย / ได้บัตรใหม่'],
  // เปลี่ยนทะเบียน = เปลี่ยนรถทั้งคัน จึงพาไปกรอกสเปคเต็มเหมือนตอนเพิ่มรถใหม่
  ['plate', 'เปลี่ยนรถประจำ (ถาวร)', 'ซื้อรถใหม่ / เปลี่ยนรถที่ใช้ประจำ'],
  // ใช้ชั่วคราว = ไปหน้าเดียวกับขอใช้รถสำรอง
  ['vehicle_replace', 'ขอใช้รถทดแทนชั่วคราว', 'รถเสีย เข้าอู่ ต้องใช้รถคันอื่นชั่วคราว'],
  ['backup_extend', 'ต่ออายุการใช้รถทดแทน', 'ยังต้องใช้รถทดแทนต่อจากกำหนดเดิม'],
  // ปิด "ขอเพิ่มโควต้าน้ำมัน" ไว้ก่อนตามที่สั่ง 25 ส.ค. 2569 (ทำเผื่อไว้ ยังไม่ใช้)
  // เปิดคืนเมื่อไหร่ เอาคอมเมนต์บรรทัดล่างออก
  // ['quota', 'ขอเพิ่มโควต้าน้ำมัน', 'ปริมาณงานเพิ่มขึ้นจนโควต้าไม่พอ'],
];

async function viewRequests(opts = {}) {
  S.tab = 'requests';
  if (opts.preset === 'vehicle_replace') return go('backup');
  if (opts.preset === 'plate') return go('platechange');
  let type = opts.preset || 'fleet_card';
  let vehicle = opts.vehicle || pickedVehicle();
  let reasonCode = 'damaged';
  const { data: mine } = await sb.from('change_requests').select('*')
    .eq('user_id', S.profile.id).order('created_at', { ascending: false }).limit(30);

  const render = () => {
    const isFleet = type === 'fleet_card';
    const needsVeh = ['fleet_card', 'plate', 'vehicle_replace', 'backup_extend'].includes(type);
    const needsDates = type === 'backup_extend';
    const oldVal = { fleet_card: vehicle?.fleet_card_no, plate: vehicle?.plate,
      vehicle_replace: vehicle ? vehicle.plate + ' ' + (vehicle.brand_name || '') : null,
      backup_extend: vehicle?.use_to,
      profile: (S.profile.full_name || '') + ' · ' + (S.profile.cost_center_code || ''),
      quota: S.quota?.quota ? nf(S.quota.quota, S.quota.unit === 'thb' ? 0 : 1) + ' ' + (S.quota.unit === 'thb' ? 'บาท' : 'ลิตร') + '/เดือน' : null }[type];

    const nodes = [
      el(`<div class="lb">เลือกเรื่องที่ต้องการเปลี่ยน</div>`),
      el(`<div id="tt" style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
        ${REQ_TYPES.map(([k, l, h]) => `<div class="card" data-t="${k}" style="cursor:pointer;padding:11px${k === type ? ';border:2px solid var(--y-dk)' : ''}">
          <div style="font-size:13px;font-weight:700">${l}</div><div class="lb" style="font-size:10.5px">${h}</div></div>`).join('')}</div>`),
    ];
    // ต่ออายุรถสำรอง = เลือกได้เฉพาะรถที่ลงทะเบียนเป็นรถสำรอง ไม่ใช่รถหลัก
    const vehList = type === 'backup_extend'
      ? S.vehicles.filter(v => v.is_backup) : S.vehicles;
    // ถ้ารถที่เลือกอยู่ไม่เข้าพวกกับประเภทนี้ (เช่น เข้ามาจากแถบล่างแล้ว default
    // เป็นรถหลัก) ให้ดีดไปคันแรกที่ถูกประเภท
    if (needsVeh && !vehList.some(v => v.id === vehicle?.id)) vehicle = vehList[0] || null;
    // ต่ออายุรถทดแทน แต่ยังไม่เคยมีรถทดแทน = ต้องยื่น "ใช้รถทดแทนชั่วคราว" ก่อน
    // ไม่ต้องโชว์ฟอร์มรายละเอียด เพราะยังไม่มีอะไรให้ต่ออายุ
    if (type === 'backup_extend' && !vehList.length) {
      nodes.push(el(`<div class="note w"><span>🚗</span><span>
        คุณยังไม่มีรถทดแทนที่ใช้งานอยู่ — ต้องยื่น <b>"ใช้รถทดแทนชั่วคราว"</b>
        และหัวหน้าอนุมัติก่อน จึงจะกดต่ออายุได้</span></div>`));
      nodes.push(el(`<button class="btn" id="goreplace">ไปยื่นขอใช้รถทดแทนชั่วคราว</button>`));
      shell('แจ้งเปลี่ยนแปลงข้อมูล', nodes, { tabs: true, back: () => go('home') });
      document.querySelectorAll('[data-t]').forEach(node => node.onclick = () => {
        if (node.dataset.t === 'vehicle_replace') return go('backup');
        if (node.dataset.t === 'plate') return go('platechange');
        type = node.dataset.t; render();
      });
      $('#goreplace').onclick = () => go('backup');
      return;   // หยุดตรงนี้ ไม่ต่อฟอร์มรายละเอียด/ปุ่มส่ง
    }

    if (needsVeh) nodes.push(vehList.length
      ? el(`<label class="f"><span>รถที่เกี่ยวข้อง</span><select id="vh">
          ${vehList.map(v => `<option value="${v.id}" ${v.id === vehicle?.id ? 'selected' : ''}>${esc(v.plate)} · ${v.is_backup ? 'สำรอง' : 'หลัก'}</option>`).join('')}
          </select></label>`)
      : el(`<div class="note w"><span>🚗</span><span>ยังไม่มีรถในระบบ</span></div>`));
    nodes.push(el(`<div class="card"><h3>รายละเอียดคำขอ</h3>
      <div class="lb" style="margin-top:7px">ค่าเดิม</div><div class="vl mono">${esc(oldVal || '(ไม่มี)')}</div>
      ${isFleet ? `<div class="lb" style="margin-top:11px">สาเหตุที่ต้องออกบัตรใบใหม่</div>
        <div class="seg" id="rc" style="margin-top:5px">
          <button data-r="damaged" class="on">บัตรชำรุด</button>
          <button data-r="lost">บัตรหาย</button>
          <button data-r="other">อื่นๆ</button></div>
        <div class="note i" style="margin-top:10px"><span>🏦</span><span>
          <b>ไม่ต้องกรอกเลขบัตรใบใหม่ตอนนี้</b> — หัวหน้าอนุมัติแล้ว ระบบจะส่งเรื่องให้แผนกบัญชี
          ติดต่อธนาคารผู้ออกบัตร เมื่อบัตรมาถึงจะแจ้งให้คุณไปรับ แล้วอัปเดตเลขบัตรให้อัตโนมัติ</span></div>`
        : needsDates ? `<div class="row" style="margin-top:11px">
            <label class="f"><span>ใช้ต่อตั้งแต่</span><input id="d1" type="date" value="${esc(vehicle?.use_to || new Date().toISOString().slice(0,10))}"></label>
            <label class="f"><span>ถึงวันที่</span><input id="d2" type="date" value="${new Date(Date.now()+14*864e5).toISOString().slice(0,10)}"></label></div>`
        : `<label class="f" style="margin-top:11px"><span>ค่าใหม่</span><input id="nv"></label>`}
      <label class="f" style="margin-top:11px"><span>เหตุผล (บังคับ)</span>
        <textarea id="rs"></textarea></label>
      </div>`));
    nodes.push(el(`<div class="note ${S.profile.supervisor_employee_code ? 'i' : 'w'}"><span>👤</span><span>${
      S.profile.supervisor_employee_code
        ? 'คำขอจะส่งถึงหัวหน้างานตามสายอนุมัติ — ' + supervisorLabel()
        : 'ยังไม่มีข้อมูลหัวหน้างานในระบบ — คำขอจะถูกบันทึกไว้แต่ยังไม่มีใครอนุมัติได้ แจ้ง Admin'}</span></div>`));
    nodes.push(el(`<button class="btn" id="sub">${isFleet ? 'ส่งคำขอออกบัตรใบใหม่' : 'ส่งคำขอให้หัวหน้าอนุมัติ'}</button>`));

    if (mine?.length) nodes.push(el(`<div class="card"><h3>คำขอของฉัน</h3><div class="list">
      ${mine.map(r => `<div class="item"><div class="tx">
        <div style="display:flex;gap:7px;align-items:center">
          <span class="pill ${r.status === 'approved' ? 'g' : r.status === 'rejected' ? 'e' : 'w'}">${
            { pending: 'รออนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ไม่อนุมัติ', cancelled: 'ยกเลิก' }[r.status] || r.status}</span>
          <span class="lb">${thDate(new Date(r.created_at))}</span></div>
        <div class="h" style="margin-top:3px">${esc(r.field_label)}</div>
        <div class="s">${esc(r.old_value || '(ไม่มี)')}${r.new_value ? ' → ' + esc(r.new_value) : ''}
          ${r.decision_note ? '<br>หมายเหตุ: ' + esc(r.decision_note) : ''}
          ${r.fulfillment_status ? '<br><b>' + { pending_issue: '⏳ บัญชีกำลังออกบัตรใบใหม่',
            issued: '🎁 บัตรพร้อมให้รับแล้ว', collected: '✓ รับบัตรแล้ว' }[r.fulfillment_status] + '</b>' : ''}</div>
        ${r.fulfillment_status === 'issued' ? `<button class="btn" data-got="${r.id}" style="margin-top:8px;padding:9px">✓ ยืนยันว่ารับบัตรแล้ว</button>` : ''}
        ${r.status === 'pending' ? `<button class="link" data-cancel="${r.id}" style="padding:6px 0 0;color:var(--r)">ยกเลิกคำขอนี้</button>` : ''}
      </div></div>`).join('')}</div></div>`));

    shell('แจ้งเปลี่ยนแปลงข้อมูล', nodes, { tabs: true, back: () => go('home') });
    document.querySelectorAll('[data-t]').forEach(n => n.onclick = () => {
      // 2 ประเภทนี้มีหน้าเฉพาะของตัวเอง ไม่ใช้ฟอร์มกลาง
      if (n.dataset.t === 'vehicle_replace') return go('backup');
      if (n.dataset.t === 'plate') return go('platechange');
      type = n.dataset.t; render();
    });
    if ($('#rc')) $('#rc').querySelectorAll('button').forEach(x => x.onclick = () => {
      reasonCode = x.dataset.r; $('#rc').querySelectorAll('button').forEach(y => y.classList.toggle('on', y === x)); });
    if ($('#vh')) $('#vh').onchange = e => vehicle = S.vehicles.find(v => v.id === e.target.value);
    document.querySelectorAll('[data-got]').forEach(b => b.onclick = async () => {
      const { data } = await sb.rpc('confirm_fleet_card_collected', { p_request: b.dataset.got });
      toast(data?.ok ? 'อัปเดตเลขบัตรใหม่ให้เรียบร้อยแล้ว' : 'ทำรายการไม่สำเร็จ', !data?.ok);
      boot();
    });
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
      if (!await askConfirm('ยกเลิกคำขอนี้',
          'คำขอจะถูกยกเลิก และแจ้งให้หัวหน้างานทราบว่าไม่ต้องดำเนินการต่อ',
          'ยกเลิกคำขอ', true)) return;
      const { data } = await sb.rpc('cancel_change_request', { p_request: b.dataset.cancel });
      if (data?.ok !== true) return toast(({
        NOT_OWNER: 'ยกเลิกได้เฉพาะคำขอของตัวเอง',
        ALREADY_DECIDED: 'คำขอนี้ถูกตัดสินไปแล้ว ยกเลิกไม่ได้',
      })[data?.code] || 'ยกเลิกไม่สำเร็จ', 1);
      toast('ยกเลิกคำขอแล้ว แจ้งหัวหน้างานเรียบร้อย');
      go('requests');
    });
    $('#sub').onclick = async (e) => {
      const reason = $('#rs').value.trim();
      if (reason.length < 5) return toast('กรุณาอธิบายเหตุผลให้หัวหน้าเข้าใจ', 1);
      const newVal = isFleet ? '' : needsDates ? $('#d2').value : ($('#nv')?.value.trim() || '');
      if (!isFleet && !newVal) return toast('กรอกค่าใหม่', 1);
      e.target.disabled = true; e.target.textContent = 'กำลังส่ง…';
      const { data, error } = await sb.rpc('submit_change_request', {
        p_type: type, p_field: REQ_TYPES.find(t => t[0] === type)[1],
        p_old: oldVal || null, p_new: newVal, p_reason: reason,
        p_vehicle: needsVeh ? (vehicle?.id || null) : null,
        p_from: needsDates ? $('#d1').value : null, p_to: needsDates ? $('#d2').value : null,
        p_reason_code: isFleet ? reasonCode : null });
      if (error || data?.ok !== true) { e.target.disabled = false;
        return toast(error ? friendly(error) : 'ส่งคำขอไม่สำเร็จ', 1); }
      toast(data.has_supervisor ? 'ส่งคำขอให้หัวหน้าเรียบร้อย' : 'บันทึกคำขอแล้ว แต่ยังไม่พบหัวหน้าในระบบ');
      go('requests');
    };
  };
  render();
}

async function viewApprovals() {
  S.tab = 'approvals'; loading('กำลังโหลดรายการรออนุมัติ…');
  const code = S.profile.employee_code;
  const { data } = await sb.from('change_requests').select('*')
    .eq('approver_employee_code', code).eq('status', 'pending').order('created_at');
  const rows = data || [];
  const names = {};
  if (rows.length) {
    const ids = [...new Set(rows.map(r => r.user_id))];
    const { data: ps } = await sb.from('profiles').select('id,full_name,employee_code').in('id', ids);
    (ps || []).forEach(p => names[p.id] = `${p.full_name || ''} ${p.employee_code || ''}`.trim());
  }
  const nodes = rows.length ? rows.map(r => el(`<div class="card">
      <div style="display:flex"><span class="pill w">รออนุมัติ</span><span class="sp"></span>
        <span class="lb">${thDT(new Date(r.created_at))}</span></div>
      <h3 style="margin-top:8px">${esc(r.field_label)}</h3>
      <div class="lb">${esc(names[r.user_id] || 'ไม่ทราบชื่อ')}</div>
      <div class="hr"></div>
      <div class="lb">จาก</div><div class="mono" style="color:var(--faint);text-decoration:line-through">${esc(r.old_value || '(ไม่มี)')}</div>
      ${r.new_value ? `<div class="lb" style="margin-top:5px">เป็น</div><div class="mono vl">${esc(r.new_value)}</div>` : ''}
      ${r.reason_code ? `<div class="lb" style="margin-top:5px">สาเหตุ</div><div>${{ damaged: 'บัตรชำรุด', lost: 'บัตรหาย', other: 'อื่นๆ' }[r.reason_code]}</div>` : ''}
      ${(r.effective_from || r.effective_to) ? `<div class="lb" style="margin-top:5px">ช่วงวันที่</div><div class="mono">${esc(r.effective_from || '')} – ${esc(r.effective_to || '')}</div>` : ''}
      <div class="lb" style="margin-top:5px">เหตุผล</div><div>${esc(r.reason)}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn gh" data-no="${r.id}" style="color:var(--stop)">ไม่อนุมัติ</button>
        <button class="btn" data-yes="${r.id}">อนุมัติ</button></div></div>`))
    : [el(`<div class="note g"><span>✓</span><span>ไม่มีคำขอที่รออนุมัติ</span></div>`)];
  shell('รออนุมัติ', nodes, { tabs: true });
  const decide = async (id, ok, note) => {
    const { data } = await sb.rpc('decide_change_request', { p_request: id, p_approve: ok, p_note: note || null });
    if (data?.ok !== true) return toast('ทำรายการไม่สำเร็จ (' + (data?.code || '') + ')', 1);
    toast(ok ? (data.sent_to_accounting ? 'อนุมัติแล้ว — ส่งเรื่องให้บัญชี ' + data.sent_to_accounting : 'อนุมัติเรียบร้อย')
             : 'บันทึกการไม่อนุมัติแล้ว');
    await refreshCounts(); go('approvals');
  };
  document.querySelectorAll('[data-yes]').forEach(b => b.onclick = async () => {
    if (await askConfirm('อนุมัติคำขอนี้?',
        'อนุมัติแล้วข้อมูลจะเปลี่ยนทันที และแจ้งผลกลับไปที่พนักงาน', 'อนุมัติ'))
      decide(b.dataset.yes, true); });
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
    const n = await askText('ไม่อนุมัติคำขอนี้', 'เหตุผลที่ไม่อนุมัติ',
      'อธิบายให้พนักงานทราบว่าต้องแก้อะไร', true);
    if (n !== null) decide(b.dataset.no, false, n); });
}

/* คิวคำขอ PIN ใบใหม่ — พนักงานที่กด "ลืม PIN" บนหน้าเข้าระบบ
   ต้องยืนยันตัวตนก่อนออก PIN ใบใหม่ให้ทุกครั้ง ระบบไม่ยืนยันแทนให้ */
/* คิวคำขอแก้ข้อมูลพนักงานที่หัวหน้าอนุมัติแล้ว รอ Admin แก้ที่ไฟล์ HR
   (sql/26_profile_request_to_admin.sql) */
async function loadProfileFixQueue() {
  const box = $('#pfbox');
  if (!box) return;
  let rows = [];
  try {
    const { data } = await sb.from('v_profile_fixes_todo').select('*').limit(100);
    rows = data || [];
  } catch { box.innerHTML = ''; return; }   // ยังไม่ได้รัน sql/26 ก็ไม่โชว์

  if (!rows.length) { box.innerHTML = ''; return; }

  box.innerHTML = `<div class="card" style="border-color:var(--warn);border-width:2px">
    <h3>รอแก้ข้อมูลพนักงาน (${rows.length})</h3>
    <div class="sub">หัวหน้าอนุมัติแล้ว — แก้ที่ไฟล์รายชื่อพนักงานต้นทาง แล้วกดว่าแก้แล้ว</div>
    ${rows.map(r => `<div class="item" style="align-items:flex-start">
      <div class="tx" style="flex:1">
        <div class="h">${esc(r.full_name || '')} <span class="mono lb">${esc(r.employee_code || '')}</span></div>
        <div class="s">เดิม: ${esc(r.old_value || '-')}</div>
        <div class="s"><b>ที่ถูก: ${esc(r.new_value || '-')}</b></div>
        ${r.reason ? `<div class="s">เหตุผล: ${esc(r.reason)}</div>` : ''}
        <button class="btn gh" style="width:auto;padding:7px 12px;margin-top:8px"
                data-pffix="${esc(r.id)}">✓ แก้ข้อมูลแล้ว</button>
      </div></div>`).join('')}</div>`;

  box.querySelectorAll('[data-pffix]').forEach(b => b.onclick = async () => {
    if (!await askConfirm('ยืนยันว่าแก้ข้อมูลแล้ว',
        'แก้ข้อมูลที่ไฟล์รายชื่อพนักงานเรียบร้อยแล้วใช่ไหม', 'ใช่ แก้แล้ว')) return;
    const { data } = await sb.rpc('admin_mark_profile_fixed', { p_request: b.dataset.pffix });
    if (data?.ok !== true) return toast('ทำรายการไม่สำเร็จ', 1);
    toast('บันทึกแล้ว — แจ้งพนักงานว่าแก้ให้แล้ว');
    loadProfileFixQueue();
  });
}

async function loadResetQueue() {
  const box = $('#rsbox');
  if (!box) return;
  let rows = [];
  try {
    const { data } = await sb.from('v_pin_resets_open').select('*').limit(100);
    rows = data || [];
  } catch { /* ยังไม่ได้รัน sql/18_pin_reset.sql ก็ไม่ต้องโชว์อะไร */ }

  if (!rows.length) { box.innerHTML = ''; return; }

  box.innerHTML = `<div class="card" style="border-color:var(--warn);border-width:2px">
    <h3>คำขอ PIN ใบใหม่ (${rows.length})</h3>
    <div class="sub">พนักงานกดแจ้งว่าลืม PIN — ยืนยันตัวตนก่อนออก PIN ใบใหม่ให้ทุกครั้ง</div>
    ${rows.map(r => `<div class="item" style="align-items:flex-start">
      <div class="tx" style="flex:1">
        <div class="h">${esc(r.full_name || 'ไม่พบชื่อในไฟล์ HR')}</div>
        <div class="s mono">${esc(r.employee_code)}</div>
        <div class="s">${
          !r.has_account ? 'ยังไม่เคยเข้าระบบสำเร็จ — นี่คือ PIN ใบแรกของเขา'
          : r.bound_device ? 'ผูกกับเครื่อง: ' + esc(r.bound_device)
          : 'เคยเข้าระบบแล้ว · ยังไม่ได้ผูกเครื่อง'}</div>
        <div class="s">${r.requested_at ? thDT(new Date(r.requested_at)) : ''}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          <button class="btn" style="width:auto;padding:7px 12px"
                  data-use="${esc(r.employee_code)}">ออก PIN ให้</button>
          ${r.bound_device ? `<button class="btn gh" style="width:auto;padding:7px 12px"
                  data-unbind="${esc(r.employee_code)}">ปลดล็อกอุปกรณ์</button>` : ''}
          <button class="link" data-close="${esc(r.id)}">ปิดคำขอ</button>
        </div>
      </div></div>`).join('')}</div>`;

  box.querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    $('#ac').value = b.dataset.use;
    $('#chk').click();
    $('#ac').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  box.querySelectorAll('[data-unbind]').forEach(b => b.onclick = async () => {
    const code = b.dataset.unbind;
    if (!await askConfirm('ปลดล็อกอุปกรณ์',
        `ปลดการผูกเครื่องของ ${code} ใช่ไหม\n\n` +
        'หลังปลดแล้ว เครื่องถัดไปที่เข้าระบบสำเร็จจะกลายเป็นเครื่องที่ผูกไว้แทน',
        'ปลดล็อก')) return;
    const { data } = await sb.rpc('admin_unbind_device', { p_employee_code: code });
    if (data?.ok !== true) return toast('ปลดล็อกไม่สำเร็จ', 1);
    toast('ปลดล็อกอุปกรณ์ของ ' + code + ' แล้ว');
    loadResetQueue();
  });

  box.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => {
    if (!await askConfirm('ปิดคำขอนี้',
        'ปิดคำขอโดยไม่ออก PIN ใบใหม่ใช่ไหม', 'ปิดคำขอ')) return;
    await sb.rpc('admin_close_pin_reset', { p_id: b.dataset.close });
    toast('ปิดคำขอแล้ว');
    loadResetQueue();
  });
}

async function loadUserList() {
  try {
    const { data } = await sb.from('v_user_accounts')
      .select('*').order('employee_code').limit(3000);
    U.rows = data || [];
  } catch (e) {
    U.rows = [];
    if ($('#ulist')) $('#ulist').innerHTML =
      `<div class="note e"><span>⚠</span><span>โหลดรายชื่อไม่ได้ — `
      + `ยังไม่ได้รัน sql/22_user_admin.sql หรือเปล่า (${esc(String(e?.message || e))})</span></div>`;
    return;
  }
  renderUserList();
}

    + (rows.length ? rows.map(r => `<div class="item" style="align-items:flex-start">
      <div class="tx" style="flex:1">
        <div class="h">${esc(r.full_name || '—')}</div>
        <div class="s mono">${esc(r.employee_code)}${r.cost_center_code ? ' · ' + esc(r.cost_center_code) : ''}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">

          ${['admin','superadmin'].includes(r.role) ? `<span class="pill b">${esc(r.role)}</span>` : ''}
          ${r.has_active_pin ? '<span class="pill w">มี PIN ยังไม่ได้ใช้</span>' : ''}
          ${r.device_label ? `<span class="pill">${esc(r.device_label)}</span>` : ''}
        </div>

          ${!r.has_account
            ? `<button class="btn" style="width:auto;padding:6px 11px" data-mk="${esc(r.employee_code)}">สร้างบัญชี + ออก PIN</button>`
            : `<button class="btn gh" style="width:auto;padding:6px 11px" data-mk="${esc(r.employee_code)}">ออก PIN ใบใหม่</button>`}
          ${r.has_account ? `
            <button class="link" data-role="${esc(r.employee_code)}"
              data-to="${['admin','superadmin'].includes(r.role) ? 'user' : 'admin'}">${
              ['admin','superadmin'].includes(r.role) ? 'ถอดสิทธิ์ Admin' : 'ตั้งเป็น Admin'}</button>
            <button class="link" data-act="${esc(r.employee_code)}"
              data-on="${r.active ? '0' : '1'}">${r.active ? 'ปิดใช้งาน' : 'เปิดใช้งาน'}</button>

          ` : ''}
        </div>
        <div id="r-${esc(r.employee_code)}"></div>
      </div></div>`).join('')

  box.querySelectorAll('[data-mk]').forEach(b => b.onclick =

    const { data } = await sb.rpc('admin_set_role',

  box.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {

/* สร้างบัญชี 1 คน — Edge Function สร้างบัญชีให้ถ้ายังไม่มี แล้วออก PIN */
/* อ่านรหัสจากช่องข้อความ/ไฟล์ — คั่นด้วยบรรทัด/จุลภาค/เว้นวรรค คัดเฉพาะที่รูปแบบถูก */
function parseBulkCodes() {
  const raw = ($('#bcodes')?.value || '').toUpperCase();
  const all = raw.split(/[\s,;]+/).map(x => x.replace(/[^A-Z0-9]/g, '')).filter(Boolean);
  const valid = [...new Set(all.filter(c => /^([0-9]{8}|[A-Z]{3}[0-9]{7})$/.test(c)))];
  const bad = [...new Set(all.filter(c => !/^([0-9]{8}|[A-Z]{3}[0-9]{7})$/.test(c)))];
  return { valid, bad };
}

function countBulkCodes() {
  const { valid, bad } = parseBulkCodes();
  $('#bcount').innerHTML = `พบรหัสถูกต้อง <b>${valid.length}</b> รายการ`
    + (bad.length ? ` · <span style="color:var(--r)">รูปแบบผิด ${bad.length}</span>` : '');
}

/* ปิดใช้งานทีละหลายคน — เรียก RPC เดียว (sql/29) */
async function bulkDeactivate() {
  const { valid } = parseBulkCodes();
  if (!valid.length) return toast('ยังไม่มีรหัสพนักงานที่ถูกต้อง', 1);
  if (!await askConfirm('ปิดใช้งานหลายคน',
      `จะปิดใช้งาน ${valid.length} บัญชี — พนักงานเหล่านี้จะเข้าระบบไม่ได้ทันที
`
      + 'ข้อมูลย้อนหลังยังอยู่ครบ (เปิดคืนได้ภายหลัง)', 'ปิดใช้งาน', true)) return;
  $('#bbres').innerHTML = '<div class="lb" style="margin-top:9px">กำลังปิดใช้งาน…</div>';
  const { data, error } = await sb.rpc('admin_bulk_set_active',
    { p_codes: valid, p_active: false });
  if (error || data?.ok !== true)
    return $('#bbres').innerHTML = `<div class="note e"><span>⚠</span><span>${
      esc(data?.code || error?.message || 'ไม่สำเร็จ')}</span></div>`;
  $('#bbres').innerHTML = `<div class="note g" style="margin-top:9px"><span>✅</span><span>
    ปิดใช้งานแล้ว <b>${data.affected}</b> บัญชี${
    data.not_found?.length ? `<br>ไม่พบบัญชี ${data.not_found.length} รหัส: ${esc(data.not_found.join(', '))}` : ''}${
    data.skipped_self ? '<br>ข้ามบัญชีตัวเอง 1 รายการ' : ''}${
    data.last_admin_blocked ? `<br>ข้าม Admin คนสุดท้าย ${data.last_admin_blocked} รายการ` : ''}</span></div>`;
  loadUserList();
}

/* สร้างบัญชี + ออก PIN ทีละหลายคนจากรายการ — วนเรียก issue-pin ทีละคน */
async function bulkCreate() {
  const { valid } = parseBulkCodes();
  if (!valid.length) return toast('ยังไม่มีรหัสพนักงานที่ถูกต้อง', 1);
  if (!await askConfirm('สร้างบัญชีหลายคน',
      `จะสร้างบัญชีและออก PIN ให้ ${valid.length} คน
`
      + 'PIN ทุกใบหมดอายุใน 7 วัน ต้องแจกให้ทันภายในสัปดาห์นี้', 'สร้างเลย')) return;
  const box = $('#bbres'); const out = [];
  for (let i = 0; i < valid.length; i++) {
    box.innerHTML = `<div class="lb" style="margin-top:9px">กำลังสร้าง ${i + 1} / ${valid.length} …</div>`;
    const r = await createOne(valid[i], null, true);
    out.push(r ? { code: r.employee_code, name: r.full_name, pin: r.pin, ok: true }
               : { code: valid[i], ok: false });
  }
  const good = out.filter(x => x.ok);
  box.innerHTML = `<div class="note ${good.length === out.length ? 'g' : 'w'}" style="margin-top:9px">
      <span>${good.length === out.length ? '✅' : '⚠'}</span><span>
      สำเร็จ ${good.length} จาก ${out.length} คน</span></div>
    <div class="note e"><span>🔐</span><span>คัดลอกเก็บเดี๋ยวนี้ — PIN แสดงครั้งเดียว</span></div>
    <button class="btn gh" id="bbcopy" style="margin-top:9px">📋 คัดลอกทั้งหมด</button>
    <div style="max-height:240px;overflow:auto;margin-top:9px">${out.map(x =>
      `<div class="lb mono">${esc(x.code)} · ${esc(x.name || '')} · ${
        x.ok ? '<b style="font-size:14px">' + esc(x.pin) + '</b>' : 'ไม่สำเร็จ'}</div>`).join('')}</div>`;
  $('#bbcopy').onclick = () => {
    const txt = good.map(x => `${x.code}\t${x.name || ''}\t${x.pin}`).join('\n');
    navigator.clipboard.writeText(txt).then(() => toast('คัดลอกแล้ว วางใน Excel ได้เลย'))
      .catch(() => toast('คัดลอกไม่ได้', 1));
  };
  loadUserList();
}

async function createOne(codeRaw, target, silent) {
  const code = String(codeRaw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const box = $(target);
  if (!/^([0-9]{8}|[A-Z]{3}[0-9]{7})$/.test(code))
    return toast('รหัสพนักงานต้องเป็นตัวเลข 8 หลัก หรือตัวอักษร 3 ตัว + เลข 7 หลัก', 1);
  if (box) box.innerHTML = '<div class="lb" style="margin-top:9px">กำลังสร้าง…</div>';

  const { data: r, error } = await sb.functions.invoke('issue-pin', { body: { employee_code: code } });
  if (error || !r || r.ok !== true) {
    const msg = r?.error || error?.message || 'ไม่ทราบสาเหตุ';
    if (box) box.innerHTML = `<div class="note e" style="margin-top:9px"><span>⚠</span><span>${
      esc(msg)}${/Function not found|404/i.test(msg)
        ? '<br><b>ยังไม่ได้ deploy Edge Function issue-pin</b> — ดู supabase/README_DEPLOY.md' : ''}</span></div>`;
    return null;
  }
  if (box) box.innerHTML = pinCardHtml(r);
  // เด้งกลางจอด้วย เพื่อไม่ให้การ์ด PIN หายตอน loadUserList รีเฟรชรายการ
  // (ตอนออกจากในแถว การ์ดที่วางในแถวจะถูกลบทิ้งเมื่อโหลดรายการใหม่)
  // โหมด batch (silent) ไม่เด้งรายคน — สรุปรวม+คัดลอกทั้งหมดทีเดียวตอนจบลูป
  if (!silent) showPinDialog(r);
  return r;
}

/* หมายเหตุการแจ้ง PIN — ต่างกันตามว่าพนักงานมีอีเมลหรือไม่
   มีอีเมล = PIN สุ่ม ต้องแจ้งทางอีเมล (ระบบส่งอัตโนมัติยังไม่เปิด แจ้งเองไปก่อน)
   ไม่มีอีเมล = PIN เริ่มต้น 111111 แจ้งด้วยตนเอง */
function pinDeliveryNote(r) {
  if (r.default_pin || r.has_email === false) {
    return `<div class="note i"><span>👤</span><span>พนักงานคนนี้<b>ไม่มีอีเมล</b>ในระบบ —
      PIN เริ่มต้นคือ <b>111111</b> แจ้งด้วยตนเอง (ระบบบังคับให้ตั้ง PIN ใหม่ตอนเข้าครั้งแรก)</span></div>`;
  }
  if (r.has_email && r.contact_email) {
    return `<div class="note i"><span>✉️</span><span>แจ้ง PIN นี้ให้พนักงานทางอีเมล
      <b>${esc(r.contact_email)}</b><br>(ระบบส่งอีเมลอัตโนมัติยังไม่เปิด — แจ้งเองไปก่อน
      ดูรายการที่ต้องแจ้งได้ที่ <b>รายงานการออก PIN</b>)</span></div>`;
  }
  return '';
}

/* กล่อง PIN กลางจอ — ค้างไว้จนกด "เสร็จแล้ว" เพราะ PIN โชว์ครั้งเดียว
   ต้องให้ Admin จดหรือคัดลอกก่อนปิด ไม่ใช่แวบหายเอง */
function showPinDialog(r) {
  const d = el(`<div class="dlg" data-dismiss="no">
    <div style="font-size:30px;text-align:center">🔑</div>
    <h3 style="text-align:center">${r.reissued ? 'PIN ใบใหม่' : 'สร้างบัญชีใหม่'}</h3>
    <div style="text-align:center">
      <div class="vl">${esc(r.full_name || '')}</div>
      <div class="lb mono">${esc(r.employee_code)}</div></div>
    <div class="mono" style="font-size:38px;font-weight:800;letter-spacing:9px;
      text-align:center;margin:14px 0;color:var(--ink)">${esc(r.pin)}</div>
    ${pinDeliveryNote(r)}

// ป้ายภาษาไทยของชนิดคำขอ + สถานะ ticket

  vehicle_replace: 'เปลี่ยน/ใช้รถทดแทน', backup_extend: 'ต่ออายุรถทดแทน',
  profile: 'แก้ข้อมูลพนักงาน', quota: 'ขอเพิ่มโควตาน้ำมัน' };
