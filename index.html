<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>CJx Travel Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="format-detection" content="telephone=no">

     โหลดไม่ได้ (ออฟไลน์) จะถอยไปวาดเส้นทางแบบเดิมบน canvas ให้อัตโนมัติ -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

<style>
:root{
  --y:#FFD400; --y-dk:#E6BE00; --r:#E30613; --b:#1B3A93; --g:#00A651;
  --ink:#14181C; --soft:#6B7280; --faint:#9CA3AF;
  --bg:#F6F7F9; --card:#FFFFFF; --rule:#E3E6EB; --field:#D8DCE3;
  --stop:#C00510; --warn:#9A6100; --warn-w:#FFF4DF;
  --g-w:#E4F3EB; --b-w:#EBF0FB; --r-w:#FDEAEB;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
h1,h2,h3,.disp{font-family:"Bai Jamjuree","IBM Plex Sans Thai",sans-serif;margin:0;line-height:1.3}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
.appbar{
  background:var(--y);color:var(--ink);padding:calc(6px + env(safe-area-inset-top,0px)) 14px 7px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20
}
.appbar .ttl{font-family:"Bai Jamjuree",sans-serif;font-weight:700;font-size:17px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar button{background:transparent;border:0;color:var(--ink);font-size:19px;padding:4px 6px;cursor:pointer;position:relative}
.badge{position:absolute;top:-2px;right:-2px;background:var(--r);color:#fff;border-radius:99px;
  font-size:9px;font-weight:800;padding:1px 4px;min-width:15px;text-align:center}
main{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;background:#fff;border-top:1px solid var(--rule);position:sticky;bottom:0;
  padding-bottom:var(--safe-b);z-index:20}
.nav button{flex:1;background:none;border:0;padding:7px 0 8px;font:inherit;font-size:10.5px;
  color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button.on{font-weight:700}
/* สีประจำปุ่มอยู่ในวงกลมรอบไอคอนเท่านั้น ไม่ทาทั้งปุ่ม
   ให้แยกปุ่มด้วยสายตาได้โดยไม่ต้องอ่านตัวหนังสือ — พนักงานใช้กลางแดดและรีบ */
.nav .g{font-size:19px;line-height:1;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--nav-c,#EEF0F3);transition:background .12s}
.nav button.on .g{box-shadow:inset 0 0 0 2px var(--nav-b,var(--y-dk))}
.nav button.on{color:var(--nav-t,var(--ink))}
.nav button[data-v="home"]     {--nav-c:#FFF3CC;--nav-b:#E6BE00;--nav-t:#8A6D00}
.nav button[data-v="history"]  {--nav-c:#E3ECFD;--nav-b:#2563EB;--nav-t:#1D4ED8}
.nav button[data-v="alerts"]   {--nav-c:#FFE9D9;--nav-b:#EA580C;--nav-t:#C2410C}
.nav button[data-v="requests"] {--nav-c:#EDE6FE;--nav-b:#7C3AED;--nav-t:#6D28D9}
.nav button[data-v="approvals"]{--nav-c:#DCF3E5;--nav-b:#16A34A;--nav-t:#15803D}
.nav button[data-v="requests"]{--nav-c:#EDE6FE;--nav-b:#7C3AED;--nav-t:#6D28D9}
.nav button[data-v="dashboard"]{--nav-c:#D9F2F0;--nav-b:#0D9488;--nav-t:#0F766E}
.nav button{font-size:10px}

/* ---------- blocks ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px}
.map{height:340px;border-radius:12px;overflow:hidden;background:#E9EFE8}
.map .leaflet-control-attribution{font-size:9px}
.card>h3{font-size:15px;font-weight:600;margin-bottom:4px}
.card>.sub{font-size:12.5px;color:var(--soft);margin-bottom:10px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.sp{flex:1}
.lb{font-size:11px;color:var(--soft)}
.vl{font-weight:600}
.hr{height:1px;background:var(--rule);margin:4px 0}

label.f{display:block;background:#fff;border:1px solid var(--field);border-radius:11px;padding:7px 11px;margin:0}
label.f>span{display:block;font-size:10.5px;color:var(--soft)}
label.f input,label.f select,label.f textarea{
  width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15px;
  color:var(--ink);padding:2px 0 1px
}
label.f textarea{resize:vertical;min-height:44px}
label.f:focus-within{border-color:var(--b);border-width:2px;padding:6px 10px}
label.f.big input{font-size:22px;font-weight:800;letter-spacing:1.5px}
label.f.code input{font-size:18px;font-weight:700;letter-spacing:2px}
label.f.pin input{font-size:24px;font-weight:800;letter-spacing:10px;text-align:center}
.hint{font-size:11.5px;color:var(--soft);padding:2px 4px}

button.btn{
  width:100%;background:var(--y);color:var(--ink);border:1px solid var(--y-dk);
  border-radius:11px;padding:13px;font:inherit;font-family:"Bai Jamjuree",sans-serif;
  font-weight:700;font-size:16px;cursor:pointer
}
button.btn.lg{padding:18px;font-size:18px}
button.btn.gh{background:#fff;border-color:var(--field);font-weight:600}
button.btn.stop{background:var(--stop);border-color:var(--stop);color:#fff}
button.btn[disabled]{background:#E5E8EC;border-color:#E5E8EC;color:#9AA3AE;cursor:default}
button.link{background:none;border:0;color:var(--b);font:inherit;font-size:14px;cursor:pointer;padding:8px}
.seg{display:flex;border:1px solid var(--field);border-radius:11px;overflow:hidden;background:#fff}
.seg button{flex:1;background:#fff;border:0;padding:10px 4px;font:inherit;font-size:13px;
  font-weight:600;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--y)}

.note{border-radius:10px;padding:10px 11px;font-size:12.5px;line-height:1.55;display:flex;gap:8px}
.note b{font-weight:600}
.note.i{background:var(--b-w);color:var(--b)}
.note.g{background:var(--g-w);color:#00713F}
.note.w{background:var(--warn-w);color:var(--warn)}
.note.e{background:var(--r-w);color:var(--r)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.pill.g{background:var(--g-w);color:#00713F}.pill.w{background:var(--warn-w);color:var(--warn)}
.pill.e{background:var(--r-w);color:var(--r)}.pill.b{background:var(--b-w);color:var(--b)}
.pill.n{background:#EDEFF3;color:var(--soft)}

.stat{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:9px 11px}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.01em}
.stat .v small{font-size:11px;font-weight:500;color:var(--soft);margin-left:3px}
.bar{height:9px;border-radius:99px;background:#E7EAEE;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .3s}
.bar i.w{background:#D8940B}.bar i.e{background:var(--r)}

.thumb{width:100%;height:150px;object-fit:cover;border-radius:11px;background:#DEE3EA;display:block}
.ph{height:96px;border:1px dashed var(--field);border-radius:11px;background:#F3F4F6;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;
  color:var(--faint);font-size:12.5px}
canvas.route{width:100%;height:190px;border-radius:11px;background:#E9EFE8;display:block}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid #EEF0F3;align-items:flex-start}
.item:first-child{border-top:0}
.item .n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--b);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.item .n.q{background:var(--y);color:var(--ink)}
.item .tx{flex:1;min-width:0}
.item .tx .h{font-size:14px;font-weight:600}
.item .tx .s{font-size:11.5px;color:var(--soft)}

/* ---------- overlay / sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;padding:0}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;
  padding:16px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:11px;
  max-height:90vh;overflow:auto}
.dlg{background:#fff;border-radius:16px;width:100%;max-width:420px;margin:auto;padding:18px;
  display:flex;flex-direction:column;gap:11px}
.mask.mid{align-items:center;padding:18px}
.sheet h3,.dlg h3{font-size:17px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + var(--safe-b));
  background:#14181C;color:#fff;padding:11px 16px;border-radius:11px;font-size:13.5px;
  z-index:90;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#toast.err{background:var(--stop)}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:26px;text-align:center}
.spin{width:26px;height:26px;border:3px solid #D8DCE3;border-top-color:var(--b);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logo{min-width:64px;height:64px;padding:0 10px;border-radius:15px;background:var(--y);
  display:inline-flex;align-items:center;justify-content:center;flex:none}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cjx" viewBox="0 0 100 74">
    <path d="M44 12a25 25 0 1 0 0 44" fill="none" stroke="#E30613" stroke-width="15"/>
    <ellipse cx="55" cy="7" rx="8" ry="6" fill="#1B3A93"/>
    <path d="M55 18v27c0 9-6 13-14 13H26" fill="none" stroke="#1B3A93" stroke-width="15"/>
    <path d="M70 27l26 31M96 27L70 58" fill="none" stroke="#00A651" stroke-width="13"/>
    <rect x="4" y="66" width="92" height="8" fill="#00A651"/>
  </symbol>
</svg>

<div id="app"><div class="center"><div class="spin"></div><div>กำลังเปิดแอป…</div></div></div>
<div id="toast"></div>
<div id="overlay"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* =====================================================================
   CJx Travel Log — เว็บแอปใช้งานจริง (ไฟล์เดียว)
   ---------------------------------------------------------------------
   2 บรรทัดล่างนี้ต้องมีค่าก่อนแจกให้พนักงาน — ตั้งด้วย
       py tools/set_supabase.py <Publishable key>
   ถ้าปล่อยว่าง เปิดเว็บมาจะเจอหน้าตั้งค่าของผู้ดูแลระบบแทนหน้าเข้าใช้งาน
   ซึ่งไม่ควรให้พนักงานเห็น

   Publishable / anon key เปิดเผยได้ตามปกติ ไม่ใช่ความลับ
   ความปลอดภัยอยู่ที่กฎ RLS ในฐานข้อมูล
   ===================================================================== */
const SUPABASE_URL = 'https://fyailrukbrioqdcshpas.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_j22tn7nwgpcZZ61rdoFLJA_sAjLEIIo';

const CFG = {
  url: SUPABASE_URL || localStorage.getItem('tl.url') || '',
  key: SUPABASE_ANON_KEY || localStorage.getItem('tl.key') || '',
  appName: 'CJx Travel Log',
  // เข้าระบบด้วยรหัสพนักงาน + PIN เท่านั้น (เลิกอีเมล OTP 21 ส.ค. 2569)
  // เพราะพนักงานภาคสนาม 1,078 จาก 1,905 คนไม่มีอีเมลบริษัท และ Admin
  // ต้องคุมได้ว่าใครเข้าระบบได้ ดู sql/10_pin_only.sql
  pinDomain: 'pin.cjx.local',
  pinLength: 6,
  consentVersion: '2026-08-21',
  bucket: 'triplog',
  dwellMinutes: 30,      // แวะเกินเท่านี้ = ระบบ stamp พิกัดให้เอง
  dwellRadiusM: 80,
  gpsMaxAccuracyM: 35,   // สัญญาณแย่กว่านี้ทิ้ง — กันเส้นหลอนในเมือง/ตึกสูง (multipath)
  gpsMinMoveM: 25,
  gpsMaxSpeedMps: 55,
  // ระยะจากเลขไมล์ต่างจากระยะ GPS เกินกี่ส่วน = ผิดปกติ ต้องแจ้งหัวหน้า
  // ต้องตรงกับ odo_gap_limit() ใน sql/23_trip_alerts.sql
  odoGapWarnPct: 0.10,
  // ช่อง "เลขไมล์ตอนเติม" ในหน้าเติมน้ำมัน — ปิดไว้ตามที่สั่ง 21 ส.ค. 2569
  // ยังไม่ต้องใช้ แต่คอลัมน์ fuel_records.odo_at_fill ยังอยู่
  // เปิดคืนเมื่อไหร่ก็เปลี่ยนเป็น true บรรทัดเดียว
  showFuelOdometer: false,
  // ห่างกันเกินเท่านี้ = ระบบไม่ได้รับสัญญาณช่วงนั้น ต้องวาดเป็นเส้นประ
  // ไม่ใช่เส้นตรงทึบที่ทำให้เข้าใจว่าขับไปตามนั้นจริง
  gpsBlindGapSec: 90,
  gpsMinGapSec: 3,          // อย่าเก็บจุดถี่กว่านี้ — 10 ชม. x 1 จุด/วินาที = localStorage ล้น
  keepPointsInDevice: 1500, // จุดที่ส่งขึ้นระบบแล้ว เก็บในเครื่องไว้เท่าที่พอวาดเส้นทาง
  curfewUserHour: 21,
  curfewSupHour: 22,
  syncEverySec: 60,
};

let sb = null;
const S = {                       // สถานะทั้งแอปอยู่ที่นี่
  ready: false, view: 'home', tab: 'home',
  profile: null, vehicles: [], quota: null, master: null,
  alerts: 0, approvals: 0, online: navigator.onLine,
  trip: null,                     // { id, startAt, distM, points, stops, fuels, dwell }
  watchId: null, wakeLock: null, lastPos: null,
  dwellAnchor: null, dwellSince: 0, dwellStopId: null, pendingDwell: null,
  curfewWarned: 0, pending: 0, busy: false,
};

/* เวอร์ชันก่อนหน้าเคยเข้าด้วยอีเมล — ล้างค่าที่ค้างไว้ทิ้ง */
try { localStorage.removeItem('tl.lastEmail'); } catch {}

/* ---------------------------------------------------------------- utils */
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const p2 = n => String(n).padStart(2, '0');
const thDate = d => `${d.getDate()} ${TH_M[d.getMonth()]} ${(d.getFullYear() + 543) % 100}`;
const thTime = d => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
const thSec  = d => `${thTime(d)}:${p2(d.getSeconds())}`;
const thDT   = d => `${thDate(d)} ${thTime(d)}`;
const nf = (n, d = 1) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const ni = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('th-TH');
const dur = ms => { const m = Math.floor(ms / 60000); return m < 60 ? `${m} นาที` : `${Math.floor(m / 60)} ชม. ${m % 60} น.`; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

/* โลโก้บริษัท — ใช้ไฟล์จริง logo.png ที่วางไว้ข้าง index.html
   ห้ามดัดแปลงรูป: แสดงตามสัดส่วนเดิมเสมอ (object-fit: contain)
   ถ้าไฟล์หาย onerror จะสลับไปใช้รูปวาดสำรอง เพื่อไม่ให้หน้าจอว่าง
   ใส่ไฟล์ด้วย:  python tools/set_logo.py "<โลโก้.png>"  */
function logoImg(h, cls) {
  return `<img src="logo.png" alt="CJx" data-h="${h}" class="${cls || ''}"
     style="height:${h}px;width:auto;max-width:100%;object-fit:contain;display:block"
     onerror="cjxLogoFallback(this)">`;
}

/* เรียกจาก onerror ของ <img> ด้านบน ต้องอยู่บน window เพราะสคริปต์นี้เป็น module
   (เคยยัด HTML ลงในแอตทริบิวต์ onerror ตรง ๆ แล้วเครื่องหมายคำพูดซ้อนกันพัง) */
window.cjxLogoFallback = (img) => {
  const h = +img.dataset.h || 22;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', Math.round(h * 1.35));
  svg.setAttribute('height', h);
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(NS, 'use');
  use.setAttribute('href', '#cjx');
  svg.append(use);
  img.replaceWith(svg);
};

function toast(msg, err, ms) {
  const t = $('#toast'); t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  // ms = ตั้งเวลาเอง ใช้กับข้อความยาวที่ต้องอ่านทัน เช่น สาเหตุที่เข้าระบบไม่ได้
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = '', ms || (err ? 4800 : 2600));
}

function haversineM(a, b, c, d) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLa = rad(c - a), dLo = rad(d - b);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(dLo / 2) ** 2;
  return R * 2 * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* -------------------------------------------------- local store (offline) */

/* รูปถ่ายเก็บใน IndexedDB เพราะ localStorage เล็กเกินไป */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('tl-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(id, blob) { const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('photos', 'readwrite');
      t.objectStore('photos').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(id) { const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('photos', 'readonly');
      const q = t.objectStore('photos').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async del(id) { const db = await this.open();
    return new Promise((res) => { const t = db.transaction('photos', 'readwrite');
      t.objectStore('photos').delete(id); t.oncomplete = res; }); },
};

/* ตรวจคีย์ที่ผู้ใช้วางมา — คืนข้อความปัญหา หรือ null ถ้าใช้ได้
   สำคัญที่สุดคือกันคีย์ลับ ไม่ใช่กันคีย์ผิดรูปแบบ
   ของเดิมเช็กแค่ความยาว ซึ่ง service_role ก็ผ่าน แล้วจะข้าม RLS ได้ทั้งหมด */
function keyProblem(k) {
  if (!k) return 'ยังไม่ได้ใส่ key';

  if (/^sb_secret_/i.test(k))
    return 'นี่คือ Secret key ห้ามใช้ในเว็บ — ต้องใช้ Publishable key (sb_publishable_…)';

  if (/^sb_publishable_/i.test(k))
    return k.length < 25 ? 'Publishable key ดูสั้นเกินไป คัดลอกมาไม่ครบ' : null;

  if (/^eyJ/.test(k)) {                       // JWT แบบเก่า อ่าน payload ดู role
    try {
      const p = JSON.parse(atob(k.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (p.role === 'service_role')
        return 'นี่คือ service_role key ห้ามใช้ในเว็บ — ต้องใช้ anon public key';
      if (p.role && p.role !== 'anon')
        return 'key นี้เป็น role "' + p.role + '" ต้องใช้ anon public key';
    } catch { /* อ่านไม่ออกก็ปล่อยผ่าน ให้ Supabase ตอบเองว่าใช้ไม่ได้ */ }
    return k.length < 100 ? 'anon key ดูสั้นเกินไป คัดลอกมาไม่ครบ' : null;
  }

  if (/supabase\.co/i.test(k)) return 'ช่องนี้ใส่ key ไม่ใช่ URL';
  return 'รูปแบบ key ไม่ถูกต้อง — ต้องขึ้นต้นด้วย sb_publishable_ หรือ eyJ';
}

/* แปลง error ตอนเข้าระบบเป็นภาษาคน
   เดิมยุบทุกอย่างเป็น "PIN ไม่ถูกต้อง" ซึ่งทำให้ key ผิดกลายเป็น PIN ผิด
   เสียเวลาหาสาเหตุ — ตอนนี้อะไรที่ไม่รู้จักจะโชว์ข้อความจริงออกมาตรง ๆ */
function signInProblem(error) {
  const m = String(error?.message || error || '');
  const st = error?.status;

  if (/fetch|network|Failed to fetch/i.test(m))
    return 'ต่อเซิร์ฟเวอร์ไม่ได้ — เช็กสัญญาณเน็ต หรือ Supabase project ถูกหยุดไว้';

  if (/Invalid API key|No API key/i.test(m) || st === 401 && /api key/i.test(m))
    return 'คีย์เชื่อมต่อไม่ถูกต้อง (ไม่ใช่เรื่อง PIN) — แจ้งผู้ดูแลระบบ '
         + 'ให้ตั้งค่าใหม่ด้วย tools/set_supabase.py';

  if (/Invalid login credentials/i.test(m))
    return 'รหัสพนักงานหรือ PIN ไม่ถูกต้อง — ลืม PIN ให้ติดต่อ Admin';

  if (/Email not confirmed/i.test(m))
    return 'บัญชีนี้ยังไม่ได้ยืนยัน — แจ้ง Admin ให้กด Confirm ที่ Supabase';

  if (/only request this after|rate limit|Too many/i.test(m))
    return 'ลองเข้าถี่เกินไป กรุณารอสักครู่แล้วลองใหม่';

  if (st === 500 || /Database error/i.test(m))
    return 'ฐานข้อมูลมีปัญหา — แจ้งผู้ดูแลระบบ (' + m + ')';

  // ไม่รู้จัก = โชว์ของจริง ดีกว่าเดาผิด
  return 'เข้าระบบไม่สำเร็จ' + (st ? ' [' + st + ']' : '') + ': ' + m;
}

function askConfirm(title, body, okLabel, danger) {
  return new Promise((done) => {
    const d = el(`<div class="dlg" data-dismiss="no">
      <h3>${esc(title)}</h3>
      ${body ? `<div style="font-size:13.5px;white-space:pre-line">${esc(body)}</div>` : ''}

    $('#dy').onclick = () => { closeOverlay(); done(true); };
    $('#dn').onclick = () => { closeOverlay(); done(false); };

    const d = el(`<div class="dlg" data-dismiss="no">

    const code = $('#ec').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    const pin = $('#pin').value.trim();
    if (!/^([0-9]{8}|[A-Z]{3}[0-9]{7})$/.test(code))
      return toast('รหัสพนักงานต้องเป็นตัวเลข 8 หลัก หรือตัวอักษร 3 ตัว + เลข 7 หลัก', 1);
    if (pin.length !== CFG.pinLength)
      return toast(`PIN ต้องเป็นตัวเลข ${CFG.pinLength} หลัก`, 1);
    btn.disabled = true; btn.textContent = 'กำลังเข้าระบบ…';

    const email = code.toLowerCase() + '@' + CFG.pinDomain;
    const { error } = await sb.auth.signInWithPassword({ email, password: pin });
    if (error) {
      btn.disabled = false; btn.textContent = 'เข้าใช้งาน';
      return toast(signInProblem(error), 1, 7000);
    }
    // ครั้งแรกต้องผูก profile กับรายชื่อ HR ด้วยรหัสพนักงาน
    const { data } = await sb.rpc('claim_pin_account', { p_employee_code: code });
    if (data && data.ok !== true) {
      toast(({ ALREADY_CLAIMED: 'รหัสพนักงานนี้ถูกใช้กับอีกบัญชีแล้ว แจ้ง Admin',
               NOT_IN_HR_LIST: 'ไม่พบรหัสพนักงานนี้ในรายชื่อ HR แจ้ง Admin',
               EMAIL_MISMATCH: 'ข้อมูลบัญชีไม่ตรงกัน แจ้ง Admin' })[data.code]
             || 'เข้าระบบไม่สมบูรณ์ (' + data.code + ')', 1, 7000);
      await sb.auth.signOut();
      btn.disabled = false; btn.textContent = 'เข้าใช้งาน';
      return;
    }
    localStorage.setItem('tl.lastCode', code);
    LS.del('consented');   // login ใหม่ -> ให้หน้ายินยอมขึ้น 1 ครั้งหลังเข้าระบบ
    boot();
  };

  $('#forgot').onclick = () => askPinReset($('#ec').value.trim());
  $('#pinin').onclick = go2;
  $('#pin').onkeydown = (e) => { if (e.key === 'Enter') go2(e); };
  setTimeout(() => { if (!$('#ec').value) $('#ec').focus(); else $('#pin').focus(); }, 150);
}

function friendly(e) {
  const s = String(e?.message || e);
  if (/invalid login credentials/i.test(s))
    return 'รหัสพนักงานหรือ PIN ไม่ถูกต้อง — ลืม PIN ให้ติดต่อ Admin';
  if (/invalid/i.test(s)) return 'ข้อมูลไม่ถูกต้อง ตรวจสอบอีกครั้ง';
  if (/rate limit|too many/i.test(s)) return 'ลองถี่เกินไป รอสักครู่แล้วลองใหม่';
  if (/fetch|network|failed to fetch/i.test(s)) return 'ไม่มีสัญญาณอินเทอร์เน็ต';
  return s.slice(0, 160);
}

/* ลืม PIN — ส่งคำขอให้ Admin ออกใบใหม่ (ดู sql/18_pin_reset.sql)
   ฐานข้อมูลตอบเหมือนกันทุกกรณี ไม่บอกว่ารหัสพนักงานนี้มีจริงไหม
   ไม่งั้นหน้านี้จะกลายเป็นเครื่องมือไล่เดารหัสพนักงานที่มีอยู่จริง */
function askPinReset(preset) {
  const d = el(`<div class="dlg">
    <div style="font-size:30px;text-align:center">🔓</div>
    <h3>ขอ PIN ใบใหม่</h3>

    <label class="f"><span>รหัสพนักงาน</span>
      <input id="rc" placeholder="80xxxxxx หรือ CMTxxxxxxx"
             value="${esc(preset || '')}"></label>
    <button class="btn" id="rs">ส่งคำขอ</button>
    <button class="link" id="rx">ยกเลิก</button></div>`);
  overlay(d);
  $('#rx').onclick = closeOverlay;
  $('#rs').onclick = async (e) => {
    const code = $('#rc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!/^([0-9]{8}|[A-Z]{3}[0-9]{7})$/.test(code))
      return toast('รหัสพนักงานต้องเป็นตัวเลข 8 หลัก หรือตัวอักษร 3 ตัว + เลข 7 หลัก', 1);
    e.target.disabled = true; e.target.textContent = 'กำลังส่ง…';
    try {
      await sb.rpc('request_pin_reset', { p_employee_code: code });
    } catch (err) {
      e.target.disabled = false; e.target.textContent = 'ส่งคำขอ';
      return toast('ส่งคำขอไม่สำเร็จ: ' + (err?.message || err), 1, 7000);
    }
    closeOverlay();
    toast('ส่งคำขอแล้ว — Admin จะติดต่อกลับเพื่อยืนยันตัวตนแล้วมอบ PIN ใบใหม่ให้',

}

/* forced = true  ถูกบังคับตั้งครั้งแรก ออกจากหน้านี้ไม่ได้
   forced = false พนักงานกดเปลี่ยนเอง มีปุ่มย้อนกลับหน้าหลัก */
function viewSetPin(forced = true) {
  const b = el(`<main>
    <div class="note w"><span>🛡</span><span>${forced
      ? `PIN ที่ Admin ออกให้ใช้ได้ครั้งเดียว
      กรุณาตั้ง PIN ใหม่ที่มีแค่คุณรู้ เพื่อป้องกันคนอื่นเข้ามาบันทึกการเดินทางแทนคุณ`
      : `ตั้ง PIN ใหม่ที่มีแค่คุณรู้`}<br>
      <b>จำ PIN นี้ให้ดี</b> ระบบไม่เก็บเป็นตัวเลขไว้ที่ไหน ลืมแล้วต้องขอ Admin ออกใบใหม่</span></div>
    <div class="card"><h3>บัญชีของคุณ</h3>
      <div class="lb">${esc(S.profile.full_name || '—')}</div>
      <div class="mono">${esc(S.profile.employee_code || '—')}</div></div>
    <label class="f pin"><span>PIN ใหม่ 6 หลัก</span>
      <input id="p1" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></label>
    <label class="f pin"><span>ยืนยัน PIN ใหม่</span>
      <input id="p2" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></label>
    <div class="hint">ห้ามใช้เลขซ้ำกันทั้งหมด (111111) และเลขเรียง (123456)</div>
    <button class="btn" id="ok">${forced ? 'บันทึก PIN และเริ่มใช้งาน' : 'บันทึก PIN ใหม่'}</button>
  </main>`);
  $('#app').innerHTML = '';
  // ปุ่มย้อนกลับมีเฉพาะตอนกดเปลี่ยนเอง — ตอนถูกบังคับตั้งครั้งแรกห้ามออก
  // ไม่งั้นจะค้างอยู่โดยที่ PIN ยังเป็นใบที่ผ่านมือ Admin มาแล้ว
  const bar = el(`<div class="appbar">${forced ? ''
      : '<button id="bk" aria-label="ย้อนกลับ">←</button>'}<div class="ttl">${
      forced ? 'ตั้ง PIN ของคุณ' : 'เปลี่ยน PIN'}</div></div>`);
  $('#app').append(bar, b);
  if ($('#bk')) $('#bk').onclick = () => go('home');
  $('#ok').onclick = async (e) => {
    const a = $('#p1').value.trim(), c = $('#p2').value.trim();
    if (a !== c) return toast('PIN ทั้งสองช่องไม่ตรงกัน', 1);
    if (!/^[0-9]{6}$/.test(a)) return toast('PIN ต้องเป็นตัวเลข 6 หลัก', 1);
    if (/^(\d)\1{5}$/.test(a) || a === '123456' || a === '654321')
      return toast('PIN นี้เดาง่ายเกินไป', 1);
    e.target.disabled = true; e.target.textContent = 'กำลังบันทึก…';
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { e.target.disabled = false;
      e.target.textContent = forced ? 'บันทึก PIN และเริ่มใช้งาน' : 'บันทึก PIN ใหม่';
      return toast(friendly(error), 1); }
    await sb.rpc('mark_pin_changed');
    toast(forced ? 'ตั้ง PIN เรียบร้อย' : 'เปลี่ยน PIN เรียบร้อยแล้ว');
    if (forced) { boot(); } else { S.profile.must_change_pin = false; go('home'); }
  };
}

  const isOther = (mid) => {
    const mm = m.models.find(x => x.id === +mid);
    return mm && mm.name.startsWith('อื่นๆ');
  };
  const toggleFree = () => $('#mfWrap').classList.toggle('hide', !isOther($('#md').value));
  const fillModels = () => {
    const bid = +$('#br').value;
    $('#md').innerHTML = '<option value="">—</option>' + m.models.filter(x => x.brand_id === bid)
      .map(x => `<option value="${x.id}" ${x.id === v?.model_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    toggleFree();
  };
  $('#br').onchange = fillModels; fillModels();
  $('#md').onchange = toggleFree;

  $('#ok').onclick = async (e) => {
    const plate = $('#pl').value.toUpperCase().replace(/\s+/g, '');
    if (plate.length < 4 || !/[0-9]/.test(plate)) return toast('ทะเบียนรถไม่ถูกต้อง', 1);
    if (!$('#pv').value || !$('#br').value || !$('#md').value || !$('#ft').value)
      return toast('กรอกข้อมูลรถให้ครบ', 1);
    const otherModel = isOther($('#md').value);
    const modelFree = otherModel ? $('#mf').value.trim() : null;
    if (otherModel && !modelFree) return toast('เลือกรุ่น "อื่นๆ" แล้ว กรุณาพิมพ์ชื่อรุ่น', 1);
    const row = {
      user_id: S.profile.id, ownership: own, plate,
      province_id: +$('#pv').value, brand_id: +$('#br').value, model_id: +$('#md').value,
      model_free: modelFree,
      fuel_type: $('#ft').value, fleet_card_no: $('#fc').value.trim() || null,
      is_primary: !backup && !S.vehicles.some(x => x.is_primary && x.id !== v?.id),
      is_backup: backup, active: true,
      approval_status: backup ? 'pending' : 'approved',
      use_from: backup ? $('#uf').value : null, use_to: backup ? $('#ut').value : null,
    };
    if (backup && row.use_to < row.use_from) return toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่มใช้', 1);
    if (!backup && !S.vehicles.length) row.is_primary = true;
    e.target.disabled = true; e.target.textContent = 'กำลังบันทึก…';
    if (row.is_primary) await sb.from('vehicles').update({ is_primary: false }).eq('user_id', S.profile.id);
    const q = v ? sb.from('vehicles').update(row).eq('id', v.id) : sb.from('vehicles').insert(row);
    const { error } = await q;
    if (error) { e.target.disabled = false; e.target.textContent = 'บันทึก'; return toast(friendly(error), 1); }
    toast(backup ? 'ส่งคำขอให้หัวหน้าแล้ว' : 'บันทึกข้อมูลรถแล้ว');
    boot();
  };
}

      <b>ชนิดน้ำมันต่างจากรถประจำ</b> (${esc(main.fuel_name || main.fuel_type)} → ${esc(name)})<br>
      Fleet card ของบริษัทผูกกับทะเบียนและชนิดน้ำมัน <b>ใช้บัตรใบเดิมเติมไม่ได้</b><br>
      ต้องสำรองจ่ายแล้วเบิกคืน หรือแจ้งบัญชีจัดบัตรให้ — ระบุเรื่องนี้ในเหตุผลด้วย</span></div>`));
  };
  $('#bft').onchange = checkFuel;

  const showDays = () => {
    const f = $('#bf').value, t = $('#bt').value;
    if (!f || !t) return;
    const d = Math.round((new Date(t) - new Date(f)) / 864e5) + 1;
    $('#bdays').textContent = d > 0
      ? `รวม ${d} วัน (ขอครั้งละไม่เกิน 30 วัน ถ้าต้องใช้นานกว่านั้นยื่นคำขอใหม่)`
      : 'วันสิ้นสุดต้องไม่ก่อนวันเริ่มใช้';
  };
  $('#bf').onchange = showDays; $('#bt').onchange = showDays; showDays();

  $('#bsub').onclick = async (e) => {
    const plate = $('#bp').value.toUpperCase().replace(/\s+/g, '');
    if (plate.length < 4 || !/[0-9]/.test(plate)) return toast('ทะเบียนรถไม่ถูกต้อง', 1);
    if (!$('#bpv').value || !$('#bbr').value || !$('#bmd').value || !$('#bft').value)
      return toast('กรอกข้อมูลรถสำรองให้ครบ', 1);
    const bModelFree = $('#bmf').value.trim();
    if (bIsOther() && !bModelFree) return toast('เลือกรุ่น "อื่นๆ" แล้ว กรุณาพิมพ์ชื่อรุ่น', 1);
    if ($('#br').value.trim().length < 5) return toast('อธิบายเหตุผลให้หัวหน้าเข้าใจ', 1);
    if ($('#bt').value < $('#bf').value) return toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่มใช้', 1);

    e.target.disabled = true; e.target.textContent = 'กำลังส่ง…';
    const { data, error } = await sb.rpc('submit_backup_vehicle_request', {
      p_plate: plate, p_province_id: +$('#bpv').value,
      p_brand_id: +$('#bbr').value, p_model_id: +$('#bmd').value,
      p_fuel_type: $('#bft').value, p_ownership: own,
      p_fleet_card: $('#bfc').value.trim() || null,
      p_from: $('#bf').value, p_to: $('#bt').value,
      p_reason: $('#br').value.trim(),
      p_model_free: bModelFree || null });

    if (error || data?.ok !== true) {
      e.target.disabled = false; e.target.textContent = 'ส่งคำขอให้หัวหน้าอนุมัติ';
      return toast(({
        NO_PRIMARY_VEHICLE: 'ต้องมีรถประจำในระบบก่อน',
        BAD_PLATE: 'ทะเบียนรถไม่ถูกต้อง',
        SAME_AS_PRIMARY: 'ทะเบียนซ้ำกับรถประจำของคุณ',
        BAD_FUEL_TYPE: 'ชนิดน้ำมันไม่ถูกต้อง',
        NO_REASON: 'ต้องกรอกเหตุผล',
        NO_DATE_RANGE: 'ต้องระบุช่วงวันที่',
        BAD_DATE_RANGE: 'วันสิ้นสุดต้องไม่ก่อนวันเริ่มใช้',
        FROM_IN_PAST: 'วันเริ่มใช้ย้อนหลังเกินไป',
        RANGE_TOO_LONG: 'ขอได้ครั้งละไม่เกิน ' + (data?.max_days || 30) + ' วัน',
        ALREADY_HAS_BACKUP: 'คุณมีรถสำรองที่ยังใช้ได้อยู่แล้ว',
        REQUEST_PENDING: 'มีคำขอรออนุมัติอยู่แล้ว',
      })[data?.code] || (error ? friendly(error) : 'ส่งคำขอไม่สำเร็จ'), 1);
    }

    toast(data.has_supervisor
      ? `ส่งคำขอแล้ว (${data.days} วัน) รอหัวหน้าอนุมัติ`
      : 'บันทึกคำขอแล้ว แต่ยังไม่พบหัวหน้าในระบบ');
    if (data.fuel_warning) alertLike(data.fuel_warning);
    go('requests');
  };
}

/* แจ้งเตือนยาว ๆ ที่ toast แสดงไม่พอ */
function alertLike(text) {
  const d = el(`<div class="dlg"><h3>⛽ ข้อควรทราบเรื่อง Fleet card</h3>
    <div style="font-size:13.5px;white-space:pre-line">${esc(text)}</div>
    <button class="btn" id="ok2">รับทราบ</button></div>`);

  $('#ok2').onclick = closeOverlay;
}

/* รถประจำ (ถาวร) — มีได้คนละคันเดียวตามกฎ Fleet card ผูกทะเบียน + ชนิดน้ำมัน */
/* ชื่อหัวหน้างานคู่กับรหัส — พนักงานจำรหัสหัวหน้าไม่ได้ ต้องเห็นชื่อ
   ชื่อมาจาก my_bootstrap (sql/17_supervisor_name.sql) ถ้าเซิร์ฟเวอร์ยัง
   ไม่ได้อัปเดตก็ยังใช้ได้ แค่เหลือรหัสอย่างเดียวเหมือนเดิม */
function supervisorLabel() {
  const code = S.profile?.supervisor_employee_code || '';
  const name = S.supervisorName || '';
  if (!code) return 'ยังไม่มีข้อมูลหัวหน้างาน';
  return name ? esc(name) + ' (รหัส ' + esc(code) + ')' : 'รหัส ' + esc(code);
}

function primaryVehicle() {
  return S.vehicles.find(v => !v.is_backup && v.approval_status === 'approved')
      || S.vehicles.find(v => !v.is_backup) || null;
}

/* รถสำรองที่ "ใช้ได้วันนี้" — อนุมัติแล้ว + อยู่ในช่วงวันที่
   เงื่อนไขเดียวที่ทำให้โมดูล "วันนี้ใช้รถสำรอง" โผล่ขึ้นมา
   พ้นกำหนดแล้วต้องยื่นคำขอใหม่และรอหัวหน้าอนุมัติ จึงจะกลับมา */
function activeBackup() {
  const t = new Date().toISOString().slice(0, 10);
  return S.vehicles.find(v => v.is_backup && v.approval_status === 'approved'
    && v.use_from && v.use_to && v.use_from <= t && v.use_to >= t) || null;
}

function daysLeft(iso) {
  return Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
}

function pickedVehicle() {
  const bk = activeBackup();
  // ติ๊ก "วันนี้ใช้รถสำรอง" ได้เฉพาะตอนมีรถสำรองที่ใช้ได้จริง
  if (LS.get('useBackup') && bk) return bk;
  if (LS.get('useBackup') && !bk) LS.set('useBackup', false);   // ล้างค่าที่ค้าง
  return primaryVehicle() || S.vehicles[0] || null;
}
function usableToday(v) {
  if (!v) return false;
  if (v.approval_status !== 'approved') return false;
  if (!v.is_backup) return true;
  const t = new Date().toISOString().slice(0, 10);
  if (v.use_from && t < v.use_from) return false;
  if (v.use_to && t > v.use_to) return false;
  return true;
}

function quotaCard(compact) {
  const q = S.quota;
  if (!q || q.state === 'no_quota')
    return el(`<div class="note i"><span>⛽</span><span>ยังไม่ได้กำหนดโควต้า Fleet card ของคุณ — แจ้ง Admin</span></div>`);
  const unit = q.unit === 'thb' ? 'บาท' : 'ลิตร', dg = q.unit === 'thb' ? 0 : 1;
  const pct = Math.min((q.used_pct || 0) * 100, 130);
  const cls = q.state === 'exceeded' ? 'e' : q.state === 'near' ? 'w' : '';
  const col = q.state === 'exceeded' ? 'var(--r)' : q.state === 'near' ? 'var(--warn)' : '#00713F';
  const mon = q.month ? thDate(new Date(q.month)) .replace(/^\d+ /, '') : '';
  return el(`<div class="card">
    <div style="display:flex;align-items:center;gap:7px">
      <span>⛽</span><div class="vl" style="flex:1;font-size:13.5px">โควต้า Fleet card ${esc(mon)}</div>
      <span class="pill ${cls === 'e' ? 'e' : cls === 'w' ? 'w' : 'g'}">ใช้ไป ${Math.round((q.used_pct || 0) * 100)}%</span></div>
    <div class="bar" style="margin:9px 0"><i class="${cls}" style="width:${Math.min(pct, 100)}%"></i></div>
    <div style="display:flex">
      <div><div class="lb">ใช้ไป</div><div class="vl mono" style="font-size:16px">${nf(q.used, dg)} ${unit}</div></div>
      <div class="sp"></div>
      <div style="text-align:right"><div class="lb">${q.state === 'exceeded' ? 'เกินโควต้า' : 'เหลือ'}</div>
        <div class="vl mono" style="font-size:16px;color:${col}">
          ${nf(q.state === 'exceeded' ? q.used - q.quota : q.remaining, dg)} ${unit}</div></div></div>
    ${compact ? '' : (q.quota_note ? `<div class="lb" style="font-size:10px;margin-top:6px">${esc(q.quota_note)}</div>` : '')}
    ${(q.state === 'near' || q.state === 'exceeded') ? `<div class="note w" style="margin-top:9px"><span>🗺</span><span>
      <b>กรุณาวางแผนการเดินทางอย่างรอบคอบทุกครั้งก่อนเดินทาง</b></span></div>` : ''}
  </div>`);
}

          ถ้ายังต้องใช้ต่อ ต้องยื่นคำขอใหม่ให้หัวหน้าอนุมัติ</span></div></div>`));
    } else {

        <div style="display:flex;align-items:center;gap:9px">

        <button class="btn gh" id="askbk" style="margin-top:10px">ขอใช้รถทดแทนชั่วคราว</button></div>`));

    nodes.push(el(`<div class="note g"><span>🔒</span><span>ระบบจะเริ่มบันทึกเส้นทางเมื่อกดปุ่มนี้ และหยุดทันทีที่กด "สิ้นสุดการทำงาน"</span></div>`));

      nodes.push(el(`<div class="note e"><span>📱</span><span>

        Safari จะหยุดส่งพิกัดทันที ระยะทางช่วงนั้นจะไม่ถูกนับและเบิกไม่ได้
        — เสียบสายชาร์จแล้วเปิดแอปค้างไว้</span></div>`));

    nodes.push(el(`<div class="card" style="border:2px solid var(--g)">
      <div style="display:flex;align-items:center;gap:8px">

      <div class="row" style="margin-top:10px">
        <div class="stat"><div class="lb">ระยะทาง GPS</div><div class="v">${nf(t.distM / 1000)}<small>กม.</small></div></div>
        <div class="stat"><div class="lb">จุดพิกัด</div><div class="v">${(t.points || []).length}<small>จุด</small></div></div></div>
      <button class="btn" id="open" style="margin-top:11px">เปิดหน้างานที่กำลังทำ</button></div>`));
  }

  shell(CFG.appName, nodes, { tabs: true });
  if ($('#chv')) $('#chv').onclick = () => go('garage');
  if ($('#askbk')) $('#askbk').onclick = () => go('backup');
  if ($('#bkc')) $('#bkc').onchange = e => {
    LS.set('useBackup', e.target.checked);
    toast(e.target.checked ? 'เลือกใช้รถสำรองสำหรับรอบนี้' : 'กลับไปใช้รถประจำ');
    go('home');
  };
  if ($('#start')) $('#start').onclick = startFlow;
  if ($('#open')) $('#open').onclick = () => go('active');
  checkBackupExpiry();
}

function checkBackupExpiry() {
  if (S._expShown) return;
  const t = new Date().toISOString().slice(0, 10);
  const soon = S.vehicles.filter(v => v.is_backup && v.use_to &&
    (new Date(v.use_to) - new Date(t)) / 864e5 <= 1);
  if (!soon.length) return;
  S._expShown = true;
  const v = soon[0], late = v.use_to < t;
  const d = el(`<div class="dlg" data-dismiss="no">
    <div style="font-size:30px;text-align:center">📅</div>
    <h3>รถสำรอง ${esc(v.plate)} ${late ? 'หมดกำหนดใช้งานแล้ว' : 'ใกล้หมดกำหนด'}</h3>
    <div style="font-size:13.5px">กำหนดใช้ถึง ${esc(v.use_to)}<br>

/* ==================================================================== */
/*  GPS + การติดตาม                                                     */
/* ==================================================================== */
function getPos(timeout = 20000) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('เครื่องนี้ไม่รองรับ GPS'));
    navigator.geolocation.getCurrentPosition(
      p => res(p), e => rej(e),
      { enableHighAccuracy: true, timeout, maximumAge: 0 });
  });
}

/* ==================================================================
   สะพานคุยกับเปลือกแอป Android (โฟลเดอร์ shell/)
   ------------------------------------------------------------------
   เปิดในเบราว์เซอร์ธรรมดา -> NATIVE.on = false ใช้ GPS ของเบราว์เซอร์เหมือนเดิม
   เปิดในเปลือกแอป        -> NATIVE.on = true  ใช้ GPS ของแอปที่เก็บต่อได้แม้ล็อกจอ

   ตั้งใจให้เปลือกไม่แตะ token และไม่คุยกับ Supabase เอง มันแค่พักพิกัดไว้
   แล้วเว็บมาดึงไปเข้าคิวเดิม ลดจุดที่จะพลาดเรื่องสิทธิ์เหลือที่เดียว
   ================================================================== */
const NATIVE = {
  get on() { return !!(window.CJX_NATIVE && window.CJXNative); },
  _seq: 0,
  _waiting: new Map(),

  call(cmd, extra) {
    if (!this.on) return Promise.resolve(null);
    const reqId = 'r' + (++this._seq);
    return new Promise((resolve) => {
      this._waiting.set(reqId, resolve);
      // ไม่ตอบใน 8 วินาที ถือว่าเปลือกมีปัญหา อย่าค้างรอ
      setTimeout(() => {
        if (this._waiting.has(reqId)) { this._waiting.delete(reqId); resolve(null); }
      }, 8000);
      try {
        window.CJXNative.postMessage(JSON.stringify({ cmd, reqId, ...(extra || {}) }));
      } catch (e) {
        this._waiting.delete(reqId); resolve(null);
      }
    });
  },

  startTracking(sessionId) { return this.call('start', { sessionId }); },
  stopTracking()           { return this.call('stop'); },
  drain()                  { return this.call('drain'); },
  permStatus()             { return this.call('perm_status'); },
  permRequest()            { return this.call('perm_request'); },
  openSettings()           { return this.call('open_settings'); },
};

/* บังคับสิทธิ์ตำแหน่ง "ตลอดเวลา" ก่อนเริ่มงาน — เฉพาะในเปลือกแอป Android
   คืน true = ผ่าน (เริ่มงานได้) · false = ยังไม่ผ่าน (บล็อกไว้ แสดงวิธีแก้)
   Android ตั้ง default ให้ไม่ได้ จึงบังคับด้วยการไม่ให้เริ่มงานจนกว่าจะตั้งถูก */
async function ensureAlwaysLocation() {
  if (!NATIVE.on) return true;                 // เว็บ/iPhone ไม่มีสิทธิ์นี้ ข้าม
  let st = await NATIVE.permStatus();
  if (st?.level === 'always') return true;

  // ยังไม่เคยให้/ให้แค่ขณะใช้ -> ลองขอผ่าน dialog ก่อน
  if (st?.level === 'denied' || st?.level === 'whenInUse') {
    st = await NATIVE.permRequest();
    if (st?.level === 'always') return true;
  }
  blockUntilAlways(st?.level || 'denied');
  return false;
}

function blockUntilAlways(level) {
  const serviceOff = level === 'serviceOff';
  const d = el(`<div class="dlg" data-dismiss="no">
    <div style="font-size:30px;text-align:center">📍</div>
    <h3 style="text-align:center">ต้องเปิดตำแหน่ง "ตลอดเวลา" ก่อนเริ่มงาน</h3>
    <div style="font-size:13.5px;line-height:1.7">${serviceOff
      ? 'ยังไม่ได้เปิด GPS ของเครื่อง — เปิด GPS แล้วลองใหม่'
      : 'แอปต้องบันทึกเส้นทางต่อเนื่องแม้ล็อกหน้าจอ จึงต้องตั้งสิทธิ์ตำแหน่งเป็น '
        + '<b>"อนุญาตตลอดเวลา"</b> ถ้าตั้งเป็น "ขณะใช้แอป" ระบบจะจับพิกัดไม่ครบ '
        + 'และระยะทางจะขาดหาย เบิกไม่ได้'}</div>
    <div class="note w"><span>👉</span><span>กดปุ่มด้านล่าง → เลือก <b>ตำแหน่ง</b>
      → เลือก <b>อนุญาตตลอดเวลา</b> แล้วกลับมากดเริ่มงานอีกครั้ง</span></div>
    <button class="btn" id="permset">เปิดหน้าตั้งค่าสิทธิ์</button>
    <button class="link" id="permre">ฉันตั้งเป็น "ตลอดเวลา" แล้ว ลองอีกครั้ง</button></div>`);
  overlay(d);
  $('#permset').onclick = () => NATIVE.openSettings();
  $('#permre').onclick = async () => {
    const st = await NATIVE.permStatus();
    if (st?.level === 'always') { closeOverlay(); toast('ตั้งค่าถูกต้องแล้ว กดเริ่มงานได้เลย'); }
    else toast('ยังไม่ใช่ "อนุญาตตลอดเวลา" — กดเปิดหน้าตั้งค่าแล้วเลือกให้ถูก', 1, 6000);
  };
}

window.cjxNativeReply = (reqId, payload) => {
  const fn = NATIVE._waiting.get(reqId);
  if (fn) { NATIVE._waiting.delete(reqId); fn(payload); }
};

/* กลับเข้าแอปแล้ว เปลือกเรียกตัวนี้ให้มาเก็บพิกัดที่ค้างไว้ */
window.cjxNativeResumed = () => { drainNativePoints(); };

/* เปลือกตั้ง window.CJX_NATIVE ตอนหน้าโหลดเสร็จ ซึ่งอาจช้ากว่าที่เว็บ
   กู้ทริปค้างแล้วสั่ง startWatch() ไปแล้ว ถ้าไม่สลับตรงนี้ ทริปนั้นจะถูก
   เบราว์เซอร์เก็บแทน แล้วพอล็อกจอก็ขาดช่วง ทั้งที่ติดตั้งแอปไว้แล้ว */
window.addEventListener('cjx-native-ready', () => {
  if (!S.trip) return;
  if (S.watchId != null) {                 // กำลังใช้ของเบราว์เซอร์อยู่ -> เลิก
    try { navigator.geolocation.clearWatch(S.watchId); } catch {}
    S.watchId = null;
  }
  startWatch();                            // คราวนี้เข้าทางเปลือก
  if (S.view === 'active') go('active');   // อัปเดตข้อความสถานะบนหน้าจอ
});

/* ดึงพิกัดที่เปลือกเก็บไว้เข้าคิวเดิมของเว็บ
   ผ่าน onPos ตัวเดียวกับ GPS ของเบราว์เซอร์ จะได้คิดระยะทาง ตรวจการแวะ
   และบันทึกด้วยตรรกะชุดเดียวกันทั้งหมด ไม่มีทางสองมาตรฐาน */
async function drainNativePoints() {
  if (!NATIVE.on || !S.trip) return 0;
  const r = await NATIVE.drain();
  const pts = r?.points || [];
  for (const p of pts) {
    onPos({
      coords: {
        latitude: p.lat, longitude: p.lng, accuracy: p.acc,
        speed: p.spd, heading: p.hdg, altitude: p.alt,
      },
      timestamp: new Date(p.at).getTime(),
    });
  }
  if (pts.length) { detectDwellStops(S.trip); saveTrip(); paintActive(); }
  return pts.length;
}

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* เตือนช่วงที่ระบบตาบอด — เรียกตอนกลับเข้าแอประหว่างมีทริปเปิดอยู่ */
function warnGpsGap() {
  const t = S.trip;
  if (!t) return;
  if (NATIVE.on) return;        // เปลือกเก็บต่อให้ตลอด ไม่มีช่วงตาบอด
  const last = t.points[t.points.length - 1];
  const since = last ? Date.now() - new Date(last.at) : 0;
  const mins = Math.round(since / 60000);
  if (mins < 3) return;
  toast(`ระบบไม่ได้รับพิกัดมา ${mins} นาที — ระยะทางช่วงนั้นไม่ถูกนับ `
      + 'กรุณาเปิดแอปค้างไว้ตลอดการเดินทาง', 1, 9000);
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !S.wakeLock) {
      S.wakeLock = await navigator.wakeLock.request('screen');
      S.wakeLock.addEventListener('release', () => S.wakeLock = null);
    }
  } catch { /* บางเครื่อง/บางเบราว์เซอร์ไม่รองรับ */ }
}
function releaseAwake() { try { S.wakeLock?.release(); } catch {} S.wakeLock = null; }

/* กำลังบันทึกเส้นทางอยู่จริงไหม
   โหมดเปลือกแอปไม่ได้ใช้ watchPosition ของเบราว์เซอร์ จึงดูที่ตัวจับเวลาแทน */
function tracking() { return NATIVE.on ? S.nativeTimer != null : S.watchId != null; }

function startWatch() {
  // อยู่ในเปลือกแอป -> ให้แอปเก็บแทน เพราะเก็บต่อได้แม้ล็อกหน้าจอ
  // ไม่เปิด watchPosition ของเบราว์เซอร์ซ้ำ จะได้ไม่นับจุดซ้ำสองทาง
  if (NATIVE.on) {
    NATIVE.startTracking(S.trip?.id).then(r => {
      if (r && r.ok === false && r.error) toast(r.error, 1, 8000);
    });
    if (S.nativeTimer == null) {
      // ระหว่างที่ดูหน้าจออยู่ ดึงมาแสดงผลทุก 5 วินาที ให้ตัวเลขขยับตามจริง
      S.nativeTimer = setInterval(drainNativePoints, 5000);
    }
    return;
  }
  if (S.watchId != null || !navigator.geolocation) return;
  S.watchId = navigator.geolocation.watchPosition(onPos,
    e => console.warn('gps', e.message),
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
  keepAwake();
}
function stopWatch() {
  if (S.nativeTimer != null) { clearInterval(S.nativeTimer); S.nativeTimer = null; }
  if (NATIVE.on) { NATIVE.stopTracking(); }
  if (S.watchId != null) navigator.geolocation.clearWatch(S.watchId);
  S.watchId = null; releaseAwake();
}

function onPos(p) {
  const t = S.trip; if (!t) return;
  const c = p.coords, now = p.timestamp || Date.now();
  S.lastPos = p;

  // watchPosition ยิงได้ถึงวินาทีละครั้ง — ทริป 10 ชม. จะได้หลายหมื่นจุด
  // localStorage มีแค่ ~5MB เก็บไม่ไหว จึงเว้นช่วงขั้นต่ำก่อนบันทึก
  // (ยังคิดระยะจากทุกจุดที่บันทึก ความคลาดเคลื่อนที่ 3 วินาทีถือว่ารับได้)
  const lastPt = t.points[t.points.length - 1];
  if (lastPt && (now - new Date(lastPt.at)) < CFG.gpsMinGapSec * 1000) return;

  // สัญญาณแม่นพอไหม — จุดที่แม่นยำแย่คือต้นเหตุหลักของเส้นทางหลอน
  const accOk = c.accuracy != null && c.accuracy <= CFG.gpsMaxAccuracyM;

  // ระยะสั่น = มากสุดระหว่าง 25 ม. กับ "2 เท่า" ของค่าความคลาดเคลื่อนของจุดนี้
  // ต้องขยับเกินสองเท่าของวงคลาดเคลื่อนจึงนับว่าไปจริง — กันเส้นหลอนตอนเดินช้า/จอด
  // ในเมืองที่ตึกสูงทำให้พิกัดเด้ง (จุด acc 20 ม. ที่เด้ง 30 ม. จะไม่ถูกนับ)
  const jitter = Math.max(CFG.gpsMinMoveM, 2 * (c.accuracy || 0));
  const anchor = t._counted;
  const movedFromAnchor = anchor
    ? haversineM(anchor.lat, anchor.lng, c.latitude, c.longitude) : Infinity;

  // จุดแรกของทริป (ยังไม่มี anchor) บันทึกเสมอ เพื่อปักหมุดจุดเริ่ม
  // จุดถัดไปบันทึกลงเส้นทางเฉพาะเมื่อสัญญาณแม่น + ขยับเกินระยะสั่น
  if (!anchor || (accOk && movedFromAnchor >= jitter)) {
    t.points.push({ at: new Date(now).toISOString(), lat: c.latitude, lng: c.longitude,
      acc: c.accuracy, spd: c.speed, hdg: c.heading, alt: c.altitude });

    if (anchor && accOk) {
      const secs = Math.max((now - anchor.at) / 1000, .001);
      // กันจุดกระโดดเพราะสัญญาณเพี้ยน (เร็วเกินจริง) ไม่นับเข้าระยะ
      if (movedFromAnchor / secs <= CFG.gpsMaxSpeedMps) t.distM += movedFromAnchor;
    }
    t._counted = { lat: c.latitude, lng: c.longitude, at: now };
  }
  checkDwell(c, now);
  prunePoints();
  saveTrip();
  if (S.view === 'active') paintActive();
  if (S.view === 'home') { /* หน้าหลักอัปเดตตอน render ถัดไป */ }
}

/* จุดที่ส่งขึ้นระบบแล้วไม่ต้องเก็บครบในเครื่อง — เหลือไว้พอวาดเส้นทาง
   ทริปยาวมากจะได้ไม่ชนเพดาน localStorage แล้วข้อมูลหายทั้งก้อน */
function prunePoints() {
  const t = S.trip;
  if (!t || t.points.length <= CFG.keepPointsInDevice) return;
  const sent = t.points.filter(p => p._s), unsent = t.points.filter(p => !p._s);
  if (sent.length < 200) return;                  // ยังส่งไม่ทัน อย่าทิ้ง
  const keep = Math.max(CFG.keepPointsInDevice - unsent.length, 100);
  const step = Math.ceil(sent.length / keep);
  const thin = sent.filter((_, i) => i % step === 0 || i === sent.length - 1);
  t.points = thin.concat(unsent);
  t._pruned = (t._pruned || 0) + (sent.length - thin.length);
}

/* แวะเกิน 30 นาที = stamp พิกัดให้เอง แล้วให้ผู้ใช้เลือกว่าแวะทำอะไร */
function checkDwell(c, now) {
  const t = S.trip;
  if (!S.dwellAnchor) { S.dwellAnchor = { lat: c.latitude, lng: c.longitude }; S.dwellSince = now; return; }
  const moved = haversineM(S.dwellAnchor.lat, S.dwellAnchor.lng, c.latitude, c.longitude);
  if (moved > CFG.dwellRadiusM) {
    if (S.dwellStopId) {
      const st = t.stops.find(s => s.id === S.dwellStopId);
      if (st && !st.depart_at) { st.depart_at = new Date(now).toISOString();
        st.depart_lat = c.latitude; st.depart_lng = c.longitude; st._dirty = 1; }
      S.dwellStopId = null;
    }
    S.dwellAnchor = { lat: c.latitude, lng: c.longitude }; S.dwellSince = now; return;
  }
  const mins = Math.floor((now - S.dwellSince) / 60000);
  if (mins < CFG.dwellMinutes || S.dwellStopId) return;

  const id = uuid();
  t.stops.push({ id, session_id: t.id, seq: t.stops.length + 1, job_type_code: null,
    source: 'auto_dwell', dwell_minutes: mins, needs_reason: true,
    arrive_at: new Date(S.dwellSince).toISOString(),
    arrive_lat: S.dwellAnchor.lat, arrive_lng: S.dwellAnchor.lng, _dirty: 1 });
  S.dwellStopId = id; S.pendingDwell = { id, mins };
  saveTrip();
  toast(`ตรวจพบว่าคุณแวะที่นี่ ${mins} นาที — ช่วยระบุว่าแวะทำอะไร`);
  if (S.view === 'active') askDwell(id, mins);
}

/* จับ "จุดจอดนาน" จากเส้นทางที่บันทึกไว้ทั้งเส้น — สำคัญสำหรับโหมดพื้นหลัง
   เพราะตอนจอดนิ่ง เปลือกแอปไม่ส่งพิกัดใหม่ (distanceFilter) checkDwell แบบสด
   จึงจับไม่ได้ วิธีนี้ดูจาก "คู่จุดที่อยู่ติดกัน" ที่ห่างกันไม่เกิน dwellRadius
   แต่เวลาต่างกันเกิน dwellMinutes = จอดอยู่ตรงนั้นนาน (ไม่ใช่สัญญาณขาดตอนวิ่ง
   เพราะถ้าวิ่งจุดถัดไปจะอยู่ไกล) แล้วสร้างจุดปฏิบัติงานให้อัตโนมัติรอผู้ใช้ระบุงาน
   เรียกได้บ่อย ๆ ระหว่างทริปและตอนปิดงาน — กันซ้ำด้วยช่วงเวลาที่มีจุดอยู่แล้ว */
function detectDwellStops(t) {
  if (!t || !(t.points || []).length || t.points.length < 2) return 0;
  const minMs = CFG.dwellMinutes * 60000;
  const pts = t.points;
  let added = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const gap = new Date(b.at) - new Date(a.at);
    if (gap < minMs) continue;                                   // เวลาห่างไม่ถึงเกณฑ์
    if (haversineM(a.lat, a.lng, b.lat, b.lng) > CFG.dwellRadiusM) continue; // ไกล = สัญญาณขาดตอนวิ่ง ไม่ใช่จอด
    const arrive = new Date(a.at).getTime();
    // มีจุด (สด/manual) ครอบเวลานี้อยู่แล้วหรือยัง — กันซ้ำ
    const dup = (t.stops || []).some(s => {
      const sa = new Date(s.arrive_at).getTime();
      const sd = s.depart_at ? new Date(s.depart_at).getTime()
                             : sa + (s.dwell_minutes || 0) * 60000;
      return arrive >= sa - 5 * 60000 && arrive <= sd + 5 * 60000;
    });
    if (dup) continue;
    t.stops.push({ id: uuid(), session_id: t.id, seq: t.stops.length + 1,
      job_type_code: null, source: 'auto_dwell', dwell_minutes: Math.round(gap / 60000),
      needs_reason: true, arrive_at: a.at, arrive_lat: a.lat, arrive_lng: a.lng,
      depart_at: b.at, depart_lat: b.lat, depart_lng: b.lng, _dirty: 1 });
    added++;
  }
  if (added) {
    // เรียงจุดตามเวลา แล้วรันเลขลำดับใหม่ให้ต่อเนื่อง
    t.stops.sort((x, y) => new Date(x.arrive_at) - new Date(y.arrive_at));
    t.stops.forEach((s, i) => s.seq = i + 1);
    saveTrip();
  }
  return added;
}

/* เตือน 21:00 ที่ตัวเอง · 22:00 ระบบฝั่งเซิร์ฟเวอร์แจ้งหัวหน้า */
function checkCurfew() {
  if (!S.trip) return;
  const h = new Date().getHours();
  if (h >= CFG.curfewUserHour && S.curfewWarned < 1) {
    S.curfewWarned = 1;
    toast(`ใกล้ ${CFG.curfewSupHour}:00 — ถ้าเลิกงานแล้วกรุณากดสิ้นสุดการทำงาน`, 1);
  }
  if (h >= CFG.curfewSupHour && S.curfewWarned < 2) {
    S.curfewWarned = 2;
    toast(`เลย ${CFG.curfewSupHour}:00 แล้วยังไม่ปิดงาน — ระบบแจ้งหัวหน้างานของคุณแล้ว`, 1);
  }
}

function saveTrip() { if (S.trip) LS.set('trip', S.trip); }

async function startFlow() {
  const v = pickedVehicle();
  if (!v) return toast('ยังไม่มีรถในระบบ', 1);
  if (!usableToday(v)) return toast(
    v.approval_status === 'pending' ? 'รถสำรองคันนี้ยังรอหัวหน้าอนุมัติ' : 'รถคันนี้เลยกำหนดใช้งาน', 1);
  if (!window.isSecureContext) return toast('ต้องเปิดผ่าน https จึงจะใช้ GPS ได้', 1);
  // ในเปลือกแอป Android: ต้องเป็นสิทธิ์ "ตลอดเวลา" เท่านั้นจึงเริ่มงานได้
  if (!await ensureAlwaysLocation()) return;
  loading('กำลังขอสิทธิ์และจับพิกัด GPS…');
  try {
    const p = await getPos();
    viewTripStart(p);
  } catch (e) {
    viewHome();
    toast(e.code === 1 ? 'ไม่อนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ตำแหน่งในเบราว์เซอร์ก่อน'
                       : 'จับพิกัดไม่ได้ ลองออกไปที่โล่งแล้วลองใหม่', 1);
  }
}

function photoField(id, label) {

    <label class="btn gh" style="margin-top:9px;display:block;text-align:center;cursor:pointer">
      ถ่ายรูป<input type="file" id="${id}" accept="image/*" capture="environment" class="hide"></label></div>`;
}

/* คืนค่า { status, data }
     'read'        = AI อ่านตัวเลขได้
     'unreadable'  = AI ตอบกลับแล้วแต่อ่านไม่ออก -> ถือว่าภาพไม่ชัด ต้องถ่ายใหม่
     'unavailable' = เรียกบริการไม่ได้ (ออฟไลน์ / ยังไม่ deploy) -> ให้กรอกเอง
   ต้องแยก 2 กรณีหลังออกจากกัน ไม่งั้นวันที่บริการล่มพนักงานจะเริ่มงานไม่ได้เลย */
async function readImage(file, kind) {
  const b64 = await new Promise(r => { const fr = new FileReader();
    fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(file); });
  if (!navigator.onLine) return { status: 'unavailable', data: null };
  try {
    const { data, error } = await sb.functions.invoke('read-image',
      { body: { kind, media_type: file.type || 'image/jpeg', image_base64: b64 } });
    if (error || !data) return { status: 'unavailable', data: null };
    if (data.ok !== true) return { status: 'unreadable', data: null };
    const d = data.data || {};
    const got = kind === 'odometer' ? d.odometer_km : (d.liters ?? d.amount_thb);
    return { status: (got == null ? 'unreadable' : 'read'), data: d };
  } catch { return { status: 'unavailable', data: null }; }
}

/* บังคับถ่ายสด — capture="environment" บอกเบราว์เซอร์ให้เปิดกล้อง
   แต่ Android บางรุ่นไม่สนใจแล้วเปิดตัวเลือกไฟล์ให้อยู่ดี
   จึงต้องกันอีกชั้นด้วยเวลาที่ไฟล์ถูกสร้าง รูปที่เพิ่งถ่ายจะมีเวลาเป็นเดี๋ยวนี้
   ส่วนรูปจากอัลบั้มจะเป็นเวลาที่ถ่ายไว้เมื่อก่อน */
const FRESH_PHOTO_SEC = 180;

function freshPhotoProblem(file) {
  const lm = Number(file?.lastModified || 0);
  if (!lm) return null;                       // อ่านเวลาไม่ได้ ปล่อยผ่าน
  const ageSec = (Date.now() - lm) / 1000;
  if (ageSec <= FRESH_PHOTO_SEC) return null;
  const mins = Math.round(ageSec / 60);
  return 'รูปนี้ถ่ายไว้เมื่อ ' + (mins < 60 ? mins + ' นาทีที่แล้ว'
      : Math.round(mins / 60) + ' ชั่วโมงที่แล้ว')
    + ' — ต้องถ่ายสดตอนนี้เท่านั้น ห้ามเลือกรูปจากอัลบั้ม';
}

/* เลขไมล์ที่พิมพ์ต้องตรงกับที่ AI อ่านได้จากรูป
   คืน null = ผ่าน, คืนข้อความ = ไม่ผ่าน
   ถ้า AI อ่านไม่ได้เลย (ไม่มีสัญญาณ/บริการล่ม) จะไม่บล็อก ไม่งั้นพนักงาน
   ภาคสนามที่เน็ตไม่ดีจะเริ่มงานไม่ได้ทั้งวัน */
function odoMismatch(typed, aiKm) {
  if (aiKm == null) return null;
  if (Number(typed) === Number(aiKm)) return null;
  return 'เลขไมล์ที่กรอก (' + ni(typed) + ') ไม่ตรงกับที่อ่านได้จากรูป ('
    + ni(aiKm) + ') — แก้ให้ตรง หรือถ่ายรูปใหม่ให้ชัด';
}

function viewTripStart(pos) {
  const v = pickedVehicle(), c = pos.coords, stamped = new Date();
  let photo = null, ocr = null, photoOk = false;
  const b = el(`<main>
    <div class="card"><h3>จุดเริ่มต้นการทำงาน</h3>
      <div style="margin-top:7px"><div class="lb">วันที่-เวลา</div><div class="vl mono">${thDate(stamped)} ${thSec(stamped)}</div></div>
      <div style="margin-top:5px"><div class="lb">พิกัด (lat, long)</div>
        <div class="vl mono" style="font-size:13px">${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)}</div></div>
      <div style="margin-top:5px"><div class="lb">ความแม่นยำ</div><div class="vl mono">± ${Math.round(c.accuracy)} เมตร</div></div>
      ${c.accuracy > 50 ? '<div class="note w" style="margin-top:9px"><span>🛰</span><span>สัญญาณยังไม่ค่อยแม่น ถ้าอยู่ในอาคารแนะนำออกมาที่โล่งแล้วกดจับพิกัดใหม่</span></div>' : ''}</div>
    <div class="card"><h3>รถที่ใช้</h3>
      <div class="vl mono" style="font-size:17px">${esc(v.plate)}</div>
      <div class="lb">${esc(v.brand_name || '')} ${esc(v.model_name || '')} · ${esc(v.fuel_name || '')}</div></div>
    <div class="card"><h3>เลขไมล์ต้นทาง</h3>
      <div class="sub">ถ่ายรูปหน้าปัดให้เห็นเลข ODO ชัด ๆ AI จะอ่านตัวเลขมาเติมให้</div>
      ${photoField('op', 'ยังไม่ได้ถ่ายรูปเลขไมล์')}
      <label class="f big" style="margin-top:11px"><span>เลขไมล์ต้นทาง (กม.)</span>
        <input id="odo" inputmode="numeric" maxlength="7" placeholder="128470"></label>
      <div class="hint" id="ohint">AI จะเติมให้จากรูป — เลขที่กรอกต้องตรงกับรูป</div>
      <div id="omis"></div></div>
    <button class="btn lg" id="go">✓ ยืนยันเริ่มงาน และเริ่มบันทึกเส้นทาง</button>
    <button class="link" id="re">จับพิกัดใหม่</button>
  </main>`);
  shell('เริ่มปฏิบัติงาน', [...b.childNodes], { back: () => go('home'), tabs: false, actions: false });

  $('#re').onclick = startFlow;
  $('#op').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const stale = freshPhotoProblem(f);
    if (stale) {
      e.target.value = '';
      $('#ohint').innerHTML = `<b style="color:var(--r)">${esc(stale)}</b>`;
      return toast(stale, 1, 8000);
    }
    photo = f; photoOk = false; ocr = null;
    $('#opph').outerHTML = `<img class="thumb" id="opph" alt="เลขไมล์ต้นทาง" src="${URL.createObjectURL(f)}">`;
    $('#ohint').textContent = 'กำลังให้ AI อ่านเลขไมล์…';
    $('#go').disabled = true;
    const r = await readImage(f, 'odometer');
    ocr = r.data;
    if (r.status === 'read') {
      photoOk = true;
      $('#odo').value = r.data.odometer_km;
      $('#odo').readOnly = false;
      $('#ohint').innerHTML = `AI อ่านได้ <b>${r.data.odometer_km}</b> · ความมั่นใจ ${
        r.data.confidence || '-'} — ถ้าอ่านผิดให้ถ่ายรูปใหม่ ไม่ใช่แก้ตัวเลข`;
      checkStartOdo();
    } else if (r.status === 'unreadable') {
      // AI อ่านเลขจากรูปไม่ได้ -> ไม่บังคับถ่ายใหม่จนติดตาย ให้กรอกเองได้
      // (รูปถูกเก็บเป็นหลักฐาน หัวหน้าตรวจเทียบรูปได้ในหน้ารายละเอียด)
      photoOk = true;
      $('#odo').readOnly = false;
      $('#ohint').innerHTML = '<b style="color:var(--warn)">AI อ่านเลขจากรูปนี้ไม่ได้</b>'
        + ' — ถ้ารูปเบลอ/ย้อนแสง แนะนำถ่ายใหม่ให้ชัด หรือ<b>กรอกเลขไมล์เอง</b>'
        + ' (รูปถูกบันทึกไว้แล้ว หัวหน้าจะตรวจเทียบกับรูป)';
    } else {
      photoOk = true;                 // บริการอ่านรูปใช้ไม่ได้ตอนนี้ ให้กรอกเอง
      $('#ohint').innerHTML = '<b style="color:var(--warn)">ยังตรวจรูปอัตโนมัติไม่ได้</b>' +
        ' (ไม่มีสัญญาณ หรือระบบอ่านรูปไม่พร้อม) กรุณากรอกเลขไมล์เอง' +
        ' — ระบบจะตรวจรูปให้อีกครั้งเมื่อส่งขึ้นระบบ';
    }
    $('#go').disabled = false;
  };

  // เทียบเลขที่พิมพ์กับเลขที่ AI อ่านได้ ทุกครั้งที่พิมพ์
  const checkStartOdo = () => {
    const typed = parseInt(String($('#odo').value).replace(/\D/g, ''), 10);
    const bad = typed ? odoMismatch(typed, ocr?.odometer_km ?? null) : null;
    const box = $('#omis');
    box.innerHTML = bad
      ? `<div class="note e" style="margin-top:9px"><span>⛔</span><span>${esc(bad)}</span></div>`
      : '';
    $('#go').disabled = !!bad;
  };
  $('#odo').oninput = checkStartOdo;

  $('#go').onclick = async (e) => {
    const odo = parseInt($('#odo').value.replace(/\D/g, ''), 10);
    if (!photo) return toast('ต้องถ่ายรูปเลขไมล์ต้นทางก่อน', 1);
    if (!photoOk) return toast('รูปเลขไมล์ไม่ชัด กรุณาถ่ายใหม่ให้เห็นตัวเลขชัดเจน', 1);
    if (!odo) return toast('กรอกเลขไมล์ต้นทาง', 1);
    const mis = odoMismatch(odo, ocr?.odometer_km ?? null);
    if (mis) return toast(mis, 1, 8000);
    e.target.disabled = true; e.target.textContent = 'กำลังเริ่ม…';

    const id = uuid();
    S.trip = {
      id, user_id: S.profile.id, vehicle_id: v.id, is_backup_vehicle: !!v.is_backup,
      status: 'active', startAt: new Date().toISOString(),
      start_lat: c.latitude, start_lng: c.longitude, start_accuracy_m: c.accuracy,
      odo_start: odo, odo_start_ai: ocr?.odometer_km ?? null,
      distM: 0, points: [], stops: [], fuels: [], media: [], _counted: null, _synced: false,
    };
    S.trip.points.push({ at: S.trip.startAt, lat: c.latitude, lng: c.longitude, acc: c.accuracy });
    S.dwellAnchor = { lat: c.latitude, lng: c.longitude }; S.dwellSince = Date.now();
    S.dwellStopId = null; S.curfewWarned = 0;

    await queuePhoto(id, 'odo_start', photo, c, ocr);
    saveTrip(); startWatch(); sync();
    go('active');
  };
}

async function queuePhoto(sessionId, kind, file, coords, ai) {
  const id = uuid();
  await IDB.put(id, file);
  S.trip.media.push({ id, session_id: sessionId, kind,
    taken_at: new Date().toISOString(), lat: coords?.latitude, lng: coords?.longitude,
    from_camera: true, ai_result: ai || null, by_user: S.profile.id, _uploaded: false });
  saveTrip();
}
