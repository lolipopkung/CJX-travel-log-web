const REQ_STATUS_PILL = { pending: 'w', approved: 'g', rejected: 'e', cancelled: 'n' };

const isoDate = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const dDate = (x) => x ? thDate(new Date(x)) : '';
const dDT = (x) => x ? thDT(new Date(x)) : '';
const dTime = (x) => x ? thTime(new Date(x)) : '';

// ---- ตัวช่วย Export ----------------------------------------------------
// ในเปลือกแอป Android: WebView ดาวน์โหลดไฟล์เอง (a[download]/blob) ไม่ได้
// จึงส่งเนื้อไฟล์เป็น base64 ให้เปลือกเขียนไฟล์แล้วเปิดเมนูแชร์/บันทึกแทน
// ในเบราว์เซอร์ปกติ (คอม/iPhone Safari): ดาวน์โหลดตรงแบบเดิม
function dlFile(name, mime, content) {
  if (NATIVE.on) { nativeSave(name, mime, content); return; }
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}
async function nativeSave(name, mime, content) {
  try {
    // btoa รับได้เฉพาะ binary-string จึงแปลง UTF-8 -> binary ก่อน (ภาษาไทยไม่เพี้ยน)
    const b64 = btoa(unescape(encodeURIComponent(content)));
    toast('กำลังเตรียมไฟล์…');
    const r = await NATIVE.call('save_file', { name, mime, b64 });
    if (r?.ok) toast('เลือกที่บันทึก/แชร์ไฟล์ได้เลย');
    else toast('บันทึกไฟล์ไม่สำเร็จ' + (r?.error ? ': ' + r.error : ''), 1, 6000);
  } catch (e) { toast('บันทึกไฟล์ไม่สำเร็จ: ' + (e?.message || e), 1, 6000); }
}
function csvVal(v) {
  if (v == null) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
// cols = [{h:'หัวคอลัมน์', v: row => ค่า}]
function exportCSV(base, cols, rows) {
  const head = cols.map(c => csvVal(c.h)).join(',');
  const body = rows.map(r => cols.map(c => csvVal(c.v(r))).join(',')).join('\r\n');
  // BOM เพื่อให้ Excel อ่านภาษาไทยถูก (ใช้ ﻿ กันอักขระล่องหนหายตอน bundle)
  dlFile(base + '.csv', 'text/csv', '﻿' + head + '\r\n' + body);
}
function exportXLS(base, sheet, cols, rows) {
  const th = cols.map(c => `<th style="background:#FFD400;border:1px solid #ccc;padding:4px">${esc(c.h)}</th>`).join('');
  const trs = rows.map(r => '<tr>' + cols.map(c => {
    // คอลัมน์แบบลิงก์ -> ทำเป็น hyperlink คลิกได้ใน Excel
    const href = c.link && c.link(r);
    if (href) return `<td style="border:1px solid #ddd;padding:3px"><a href="${esc(href)}">${esc(c.linkText || 'เปิด')}</a></td>`;
    const val = c.v(r);
    const num = (typeof val === 'number');
    // บังคับ text format กับ "ข้อความ/รหัส" กันรหัสพนักงานกลายเป็นเลขวิทยาศาสตร์
    // ปล่อยตัวเลข (กม./บาท/ชม.) เป็นตัวเลขจริง เพื่อให้ sort/รวมยอดใน Excel ได้
    return `<td style="border:1px solid #ddd;padding:3px${num ? '' : ';mso-number-format:\\@'}">${esc(val)}</td>`;
  }).join('') + '</tr>').join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
    <head><meta charset="utf-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
    <x:Name>${esc(sheet)}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
    </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    </head><body><table>${'<tr>' + th + '</tr>'}${trs}</table></body></html>`;
  dlFile(base + '.xls', 'application/vnd.ms-excel', '﻿' + html);
}

// แถบกราฟแนวนอนอย่างง่าย (ไม่พึ่งไลบรารีภายนอก — CSP ปลอดภัย)
function barRows(items, labelOf, valOf, unit, cls) {
  const max = Math.max(1, ...items.map(valOf));
  return items.map(it => {
    const v = valOf(it), pct = Math.round(v / max * 100);
    return `<div style="margin:7px 0">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(labelOf(it))}</span>
        <span class="mono" style="flex:none;margin-left:8px;color:var(--soft)">${nf(v, unit === 'กม.' ? 1 : 0)}${unit ? ' ' + unit : ''}</span></div>
      <div class="bar"><i class="${cls || ''}" style="width:${pct}%"></i></div></div>`;
  }).join('') || '<div class="lb">ไม่มีข้อมูลในช่วงนี้</div>';
}

// ตารางแบบเลื่อนแนวนอนได้ — cols เดียวกับที่ใช้ Export
function dataTable(cols, rows, render, rowId) {
  if (!rows.length) return '<div class="note i"><span>ℹ</span><span>ไม่มีข้อมูลในช่วงที่เลือก</span></div>';
  const head = cols.map(c => `<th style="text-align:left;padding:6px 9px;border-bottom:2px solid var(--rule);
    font-size:11px;color:var(--soft);white-space:nowrap;position:sticky;top:0;background:var(--card)">${esc(c.h)}</th>`).join('');
  const body = rows.map(r => {
    const rid = rowId && rowId(r);
    return `<tr${rid ? ` data-sid="${esc(rid)}" style="cursor:pointer"` : ''}>` + cols.map(c => {
    const href = c.link && c.link(r);
    // ในเปลือกแอป: ลิงก์ปกติ (ไม่ target=_blank) ให้เปลือกดักเปิดภายนอกเอง
    // บนเบราว์เซอร์คอม: เปิดแท็บใหม่ตามปกติ
    const cell = href
      ? `<a href="${esc(href)}" ${NATIVE.on ? '' : 'target="_blank" rel="noopener"'} style="color:var(--b)">${esc(c.linkText || 'เปิด')}</a>`
      : (render ? render(c, r) : esc(c.v(r)));
    return `<td style="padding:6px 9px;border-bottom:1px solid #EEF0F3;font-size:12.5px;white-space:nowrap">${cell}</td>`;
    }).join('') + '</tr>';
  }).join('');
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table style="border-collapse:collapse;min-width:100%">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

async function viewDashboard() {
  S.tab = 'dashboard';

  //   superadmin = ทั้งหมด · หัวหน้า = ตัวเอง+ลูกน้องสายตรง · พนักงาน = เฉพาะตัวเอง
  const role = S.profile.role;
  const isAdmin = ['admin', 'superadmin'].includes(role);
  const isSuper = role === 'superadmin';
  const isSup = !!S.profile.is_supervisor;
  const canPickPeople = isAdmin || isSup;    // เลือกกรอง CC/รายคนได้เมื่อดูได้หลายคน
  const scopeLabel = isSuper ? 'ทั้งหมด' : (canPickPeople ? 'ทีมของฉัน' : 'ของฉัน');
  if (!canPickPeople) { DASH.cc = ''; DASH.emp = ''; }   // พนักงานทั่วไป: ล้างตัวกรองคน

  const now = new Date();
  if (!DASH.from) DASH.from = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  if (!DASH.to) DASH.to = isoDate(now);
  const ccOpts = (S.master.cost_centers || [])
    .map(c => `<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');

  const filterCard = el(`<div class="card">
    <h3>📊 รายงานการเดินทาง (${esc(scopeLabel)})</h3>
    <div class="sub">${canPickPeople
      ? (isSuper ? 'สรุปการปฏิบัติงานทั้งองค์กร — เลือกช่วงวัน / Cost center / รายคน'
                 : 'เห็นเฉพาะตัวเองและลูกน้องในสายอนุมัติ — เลือกช่วงวัน / รายคน')
      : 'สรุปการปฏิบัติงานของคุณ — เลือกช่วงวันที่'}</div>
    <div class="seg" id="dpreset" style="margin-bottom:10px">
      <button data-p="today">วันนี้</button>
      <button data-p="7">7 วัน</button>
      <button data-p="month">เดือนนี้</button>
      <button data-p="prev">เดือนก่อน</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="f"><span>ตั้งแต่วันที่</span><input type="date" id="dfrom" value="${DASH.from}"></label>
      <label class="f"><span>ถึงวันที่</span><input type="date" id="dto" value="${DASH.to}"></label>
    </div>
    ${canPickPeople ? `
    ${isSuper ? `<label class="f" style="margin-top:8px"><span>Cost center</span>
      <select id="dcc"><option value="">— ทุก Cost center —</option>${ccOpts}</select></label>` : ''}
    <label class="f" style="margin-top:8px"><span>พนักงาน (รหัส หรือ ชื่อ)</span>
      <input id="demp" placeholder="เว้นว่าง = ทุกคนที่ดูได้" value="${esc(DASH.emp)}"></label>` : ''}
    <button class="btn" id="dload" style="margin-top:11px">🔍 ดูรายงาน</button>
  </div>`);

  const tabCard = el(`<div class="seg" id="dtabs" style="margin:2px 0 4px;flex-wrap:wrap">
    <button data-t="overview">ภาพรวม</button>
    <button data-t="sessions">รายทริป</button>
    <button data-t="stops">จุดปฏิบัติงาน</button>
    <button data-t="vehicles">รถ</button>
    <button data-t="requests">คำขอ/Ticket</button>
  </div>`);

  const body = el('<div id="dashbody"></div>');
  shell('รายงานการเดินทาง', [filterCard, tabCard, body], { tabs: true });

  const setTabUI = () => tabCard.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === DASH.tab));
  setTabUI();

  tabCard.querySelectorAll('button').forEach(b => b.onclick = () => {
    DASH.tab = b.dataset.t; setTabUI(); loadDash();
  });

  $('#dpreset').querySelectorAll('button').forEach(b => b.onclick = () => {
    const t = new Date(); let f;
    if (b.dataset.p === 'today') { f = new Date(); }
    else if (b.dataset.p === '7') { f = new Date(); f.setDate(f.getDate() - 6); }
    else if (b.dataset.p === 'month') { f = new Date(t.getFullYear(), t.getMonth(), 1); }
    else if (b.dataset.p === 'prev') {
      f = new Date(t.getFullYear(), t.getMonth() - 1, 1);
      $('#dto').value = isoDate(new Date(t.getFullYear(), t.getMonth(), 0));
    }
    if (b.dataset.p !== 'prev') $('#dto').value = isoDate(t);
    $('#dfrom').value = isoDate(f);
    $('#dpreset').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });

  $('#dload').onclick = () => { readFilters(); loadDash(); };
  readFilters(); loadDash();
}

async function loadDash() {
  const box = $('#dashbody');
  if (!box) return;
  box.innerHTML = '<div class="card"><div class="lb">กำลังโหลดรายงาน…</div></div>';
  const args = { p_from: DASH.from, p_to: DASH.to,
    p_cc: DASH.cc || null, p_emp: DASH.emp || null };
  try {
    if (DASH.tab === 'overview') {
      const { data, error } = await sb.rpc('admin_dashboard', args);
      if (error || data?.ok !== true) throw error || new Error(data?.code);
      DASH.data.overview = data; renderOverview(data);
    } else if (DASH.tab === 'sessions') {
      const { data, error } = await sb.rpc('admin_report_sessions', args);
      if (error || data?.ok !== true) throw error || new Error(data?.code);
      DASH.data.sessions = data.rows; renderSessions(data.rows);
    } else if (DASH.tab === 'stops') {
      const { data, error } = await sb.rpc('admin_report_stops', args);
      if (error || data?.ok !== true) throw error || new Error(data?.code);
      DASH.data.stops = data.rows; renderStops(data.rows);
    } else if (DASH.tab === 'vehicles') {
      const { data, error } = await sb.rpc('admin_report_vehicles', args);
      if (error || data?.ok !== true) throw error || new Error(data?.code);
      DASH.data.vehicles = data.rows; renderVehicles(data.rows);
    } else if (DASH.tab === 'requests') {
      const { data, error } = await sb.rpc('admin_report_requests',
        { ...args, p_status: null });
      if (error || data?.ok !== true) throw error || new Error(data?.code);
      DASH.data.requests = data.rows; renderRequests(data.rows);
    }
  } catch (e) {
    box.innerHTML = `<div class="note e"><span>⚠</span><span>โหลดรายงานไม่ได้: ${
      esc(e?.message || 'ไม่ทราบสาเหตุ')}</span></div>`;
  }
}

function rangeLabel() {
  return `${dDate(DASH.from)} – ${dDate(DASH.to)}`;
}
// YYYY-MM-DD -> DDMMYY (พ.ศ.สองหลักไม่ใช้ ใช้ค.ศ.สองหลักตามตัวอย่าง 010826)
function ddmmyy(s) { const [y, m, d] = s.split('-'); return d + m + y.slice(2); }

// ชื่อไฟล์รายงาน: รหัส_ชื่อต้น_โมดูล_ddmmyy-ddmmyy
// ถ้าเป็นพนักงานคนเดียว ใช้รหัส+ชื่อต้นจากข้อมูลจริง · หลายคน = "หลายคน" · ไม่มีข้อมูล = "ทุกคน"
function reportFileName(moduleLabel, rows) {
  const period = `${ddmmyy(DASH.from)}-${ddmmyy(DASH.to)}`;
  const codes = [...new Set((rows || []).map(r => r.employee_code).filter(Boolean))];
  let who;
  if (codes.length === 1) {
    const first = ((rows.find(r => r.employee_code === codes[0]) || {}).full_name || '')
      .trim().split(/\s+/)[0] || '';
    who = codes[0] + (first ? '_' + first : '');
  } else {
    who = codes.length ? 'หลายคน' : (DASH.emp || 'ทุกคน');
  }
  return `${who}_${moduleLabel}_${period}`;
}

function exportBar(kind, n) {
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 2px 9px">

function wireExport(kind, label, cols, rows) {
  const base = reportFileName(label, rows);
  const ex = $('#xexcel'), cv = $('#xcsv');
  if (ex) ex.onclick = () => {
    if (!rows.length) return toast('ไม่มีข้อมูลให้ส่งออก', 1);
    exportXLS(base, label, cols, rows); toast('ดาวน์โหลด Excel แล้ว');
  };
  if (cv) cv.onclick = () => {
    if (!rows.length) return toast('ไม่มีข้อมูลให้ส่งออก', 1);
    exportCSV(base, cols, rows); toast('ดาวน์โหลด CSV แล้ว');
  };
}

/* รายงานการออก PIN (เฉพาะ superadmin) — ดูว่าออก user+PIN ให้ใครแล้ว
   จะได้ตามไปแจ้ง PIN ให้พนักงานรายคน · ไม่โชว์ PIN ของคนมีอีเมล (ความปลอดภัย) */
const PINREP = { rows: [], q: '' };
function pinReportCols() {
  return [
    { h: 'ชื่อ', v: r => r.full_name || '' },
    { h: 'รหัสพนักงาน', v: r => r.employee_code || '' },
    { h: 'Cost center', v: r => r.cost_center_code || '' },
    { h: 'อีเมลพนักงาน', v: r => r.contact_email || 'ไม่มีอีเมล' },
    { h: 'PIN', v: r => r.default_pin ? r.default_pin : 'ส่งทางอีเมล (ไม่แสดง)' },
    { h: 'ช่องทางแจ้ง', v: r => r.has_email ? 'อีเมล' : 'แจ้งด้วยตนเอง' },
    { h: 'ออก PIN เมื่อ', v: r => r.pin_issued_at ? dDT(r.pin_issued_at) : '' },
    { h: 'ออกโดย', v: r => r.issued_by || '' },
    { h: 'สถานะ', v: r => r.status || '' },
  ];
}
async function viewPinReport() {
  loading('กำลังโหลดรายงานการออก PIN…');
  try {
    const { data, error } = await sb.rpc('admin_pin_report', { p_search: PINREP.q || null });
    if (error || data?.ok !== true) throw error || new Error(data?.code || 'โหลดไม่ได้');
    PINREP.rows = data.rows || [];
  } catch (e) {
    return shell('รายงานการออก PIN', [el(`<div class="note e"><span>⚠</span><span>${
      /NOT_SUPERADMIN/.test(String(e?.message || e)) ? 'เฉพาะ superadmin เท่านั้น'
        : 'โหลดไม่ได้: ' + esc(String(e?.message || e)) + ' — รัน sql/40_pin_report.sql แล้วหรือยัง'}</span></div>`)],
      { back: () => go('admin') });
  }

  const rows = PINREP.rows;
  const nEmail = rows.filter(r => r.has_email).length;
  const nNoEmail = rows.length - nEmail;
  const nPending = rows.filter(r => !r.used).length;
  const cols = pinReportCols();

  const nodes = [
    el(`<div class="card"><h3>🔑 รายงานการออก PIN</h3>
      <div class="sub">ออก user+PIN ให้แล้ว ${ni(rows.length)} คน · มีอีเมล ${ni(nEmail)} · ไม่มีอีเมล ${ni(nNoEmail)} (PIN 111111) · ยังไม่เข้าใช้ ${ni(nPending)}</div>
      <div class="note i" style="margin-top:8px"><span>🔒</span><span>PIN ของคนมีอีเมลไม่แสดงในรายงาน (สุ่มให้แต่ละคน เก็บเป็น hash เท่านั้น)
        — แจ้งพนักงานทางอีเมลที่ระบุ · ส่วนคนไม่มีอีเมลใช้ PIN เริ่มต้น <b>111111</b> แจ้งด้วยตนเอง</span></div>
      <label class="f" style="margin-top:10px"><span>ค้นหา ชื่อ / รหัสพนักงาน</span>
        <input id="pq" placeholder="พิมพ์เพื่อค้นหา" value="${esc(PINREP.q)}"></label></div>`),
    el(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 2px 9px">
      <div class="lb" style="flex:1">พบ ${ni(rows.length)} รายการ</div>
      <button class="btn gh" id="pxe" style="width:auto;padding:8px 12px">📗 Excel</button>
      <button class="btn gh" id="pxc" style="width:auto;padding:8px 12px">📄 CSV</button></div>`),
    el(`<div>${dataTable(cols, rows, (c, r) => {
      if (c.h === 'PIN' && r.default_pin) return `<b>${esc(r.default_pin)}</b>`;
      if (c.h === 'สถานะ') return r.used
        ? '<span class="pill g">เข้าใช้แล้ว</span>' : '<span class="pill w">รอเข้าใช้</span>';
      return esc(c.v(r));
    })}</div>`),
  ];
  shell('รายงานการออก PIN', nodes, { back: () => go('admin') });

  const fname = 'รายงานการออกPIN_' + ymdCompact(new Date());
  $('#pxe').onclick = () => rows.length ? (exportXLS(fname, 'ออก PIN', cols, rows), toast('ดาวน์โหลด Excel แล้ว')) : toast('ไม่มีข้อมูล', 1);
  $('#pxc').onclick = () => rows.length ? (exportCSV(fname, cols, rows), toast('ดาวน์โหลด CSV แล้ว')) : toast('ไม่มีข้อมูล', 1);
  let t;
  $('#pq').oninput = e => { clearTimeout(t); PINREP.q = e.target.value.trim(); t = setTimeout(viewPinReport, 350); };
}
function ymdCompact(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + p(d.getMonth() + 1) + String(d.getFullYear()).slice(2);
}

async function viewSyncStatus() {
  loading('กำลังตรวจสถานะ…');

  let qErr = null;
  try {
    const { data, error } = await sb.from('work_sessions')
      .select('id,start_at,status')
      .eq('user_id', S.profile.id).eq('status', 'active')
      .order('start_at', { ascending: false });
    if (error) qErr = error.message; else open = data || [];
  } catch (e) { qErr = e?.message || String(e); }
  countPending();

  const nodes = [
    el(`<div class="card"><h3>สถานะการส่งข้อมูล</h3>
      <div class="item"><div class="tx">
        <div class="h">${S.online === false ? '🔴 ออฟไลน์' : '🟢 ออนไลน์'}</div>
        <div class="s">ข้อมูลที่ยังไม่ได้ส่งขึ้นระบบ: <b>${S.pending || 0}</b> รายการ</div></div></div>
      ${S.lastCloseError ? `<div class="note e" style="margin-top:8px"><span>⚠</span><span>
        ปิดงานล่าสุดมีปัญหา: ${esc(S.lastCloseError)}</span></div>` : ''}
      ${qErr ? `<div class="note e" style="margin-top:8px"><span>⚠</span><span>อ่านสถานะไม่ได้: ${esc(qErr)}</span></div>` : ''}
      <button class="btn gh" id="dosync" style="margin-top:9px">🔄 ซิงค์เดี๋ยวนี้</button></div>`),
  ];

  if (!qErr && !open.length) {
    nodes.push(el('<div class="note g"><span>✓</span><span>ไม่มีงานที่ค้างเปิดอยู่ — ปิดครบทุกทริปแล้ว</span></div>'));
  } else if (open.length) {
    nodes.push(el(`<div class="note w"><span>⚠</span><span>
      มีงานที่ยังไม่ปิด <b>${open.length}</b> รายการ — กด "ปิดงานนี้ให้จบ" เพื่อปิด</span></div>`));
    open.forEach(o => {
      const st = new Date(o.start_at);
      nodes.push(el(`<div class="card" data-oid="${esc(o.id)}">
        <div style="display:flex;align-items:center"><div style="flex:1">
          <div class="vl">${thDT(st)}</div>
          <div class="lb">🕐 เริ่ม ${thTime(st)} · ยังเปิดอยู่</div></div>
          <span class="pill g">กำลังทำงาน</span></div>
        <button class="btn cls" style="margin-top:9px">ปิดงานนี้ให้จบ</button>
        <div class="ff lb" style="margin-top:6px"></div></div>`));
    });
  }

  shell('สถานะการซิงค์', nodes, { back: () => go('settings') });

  $('#dosync').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'กำลังซิงค์…';
    try { await sync(); } catch {}
    toast('ซิงค์เรียบร้อย'); go('syncstatus');
  };

  document.querySelectorAll('[data-oid]').forEach(card => {
    const btn = card.querySelector('.cls'), ff = card.querySelector('.ff');
    btn.onclick = async () => {
      if (!await askConfirm('ปิดงานที่ค้าง',
          'ระบบจะปิดงานนี้ให้จบทันที (คำนวณระยะจากพิกัดที่มี)', 'ปิดงาน', true)) return;
      btn.disabled = true; btn.textContent = 'กำลังปิด…'; ff.innerHTML = '';
      // ชั้น 1: RPC (ปิด + คำนวณระยะ)
      let closed = false, msg = '';
      try {
        const { data, error } = await sb.rpc('close_my_active_session', { p_note: 'ปิดจากหน้าสถานะซิงค์' });
        if (error) msg = 'RPC: ' + error.message;
        else if (data?.ok === true || data?.code === 'NO_ACTIVE') closed = true;
        else msg = 'RPC: ' + (data?.code || 'ไม่สำเร็จ');
      } catch (e) { msg = 'RPC: ' + (e?.message || e); }
      // ชั้น 2 (ถ้า RPC ล้ม): อัปเดตสถานะตรง ๆ
      if (!closed) {
        try {
          const { error } = await sb.from('work_sessions')
            .update({ status: 'ended', end_at: new Date().toISOString() })
            .eq('id', card.dataset.oid).eq('status', 'active');
          if (!error) closed = true; else msg += ' · update: ' + error.message;
        } catch (e) { msg += ' · update: ' + (e?.message || e); }
      }
      if (closed) {
        LS.del('trip'); LS.del('lastTrip'); S.trip = null;
        ff.innerHTML = '<span style="color:var(--g)">✅ ปิดเรียบร้อย</span>';
        setTimeout(() => go('syncstatus'), 900);
      } else {
        ff.innerHTML = '<span style="color:var(--r)">❌ ' + esc(msg) + '</span>';
        btn.disabled = false; btn.textContent = 'ลองใหม่';
      }
    };
  });
}

/*  sync ขึ้น Supabase                                                  */
/* ==================================================================== */
let syncing = false;
async function sync() {
  if (syncing || !navigator.onLine || !S.profile) { countPending(); return; }
  syncing = true;
  try {
    const t = S.trip || LS.get('lastTrip');
    if (t) {
      const row = { id: t.id, user_id: t.user_id, vehicle_id: t.vehicle_id,
        is_backup_vehicle: !!t.is_backup_vehicle, status: t.status,
        start_at: t.startAt, start_lat: t.start_lat, start_lng: t.start_lng,
        start_accuracy_m: t.start_accuracy_m, odo_start: t.odo_start, odo_start_ai: t.odo_start_ai,
        gps_distance_m: Math.round(t.distM || 0), point_count: (t.points || []).length };
      if (t.status !== 'active') Object.assign(row, { end_at: t.end_at, end_lat: t.end_lat,
        end_lng: t.end_lng, end_accuracy_m: t.end_accuracy_m, odo_end: t.odo_end,
        odo_end_ai: t.odo_end_ai, note: t.note });
      Object.keys(row).forEach(k => row[k] == null && k !== 'note' && delete row[k]);
      const { error: e1 } = await sb.from('work_sessions').upsert(row);
      if (e1) throw e1;

      // จุดพิกัด
      const unsent = (t.points || []).filter(p => !p._s);
      for (let i = 0; i < unsent.length; i += 200) {
        const batch = unsent.slice(i, i + 200);
        const { error } = await sb.from('session_points').upsert(batch.map(p => ({
          session_id: t.id, at: p.at, lat: p.lat, lng: p.lng,
          accuracy_m: p.acc ?? null, speed_mps: p.spd ?? null,
          heading: p.hdg ?? null, altitude_m: p.alt ?? null })),
          { onConflict: 'session_id,at', ignoreDuplicates: true });
        if (error) throw error;
        batch.forEach(p => p._s = 1);
      }
      // จุดปฏิบัติงาน + น้ำมัน
      for (const s of (t.stops || []).filter(x => x._dirty)) {
        const { _dirty, ...row2 } = s;
        const { error } = await sb.from('stops').upsert(row2);
        if (!error) delete s._dirty;
      }
      for (const f of (t.fuels || []).filter(x => x._dirty)) {
        const { _dirty, ...row2 } = f;
        const { error } = await sb.from('fuel_records').upsert(row2);
        if (!error) delete f._dirty;
      }
      // รูป
      for (const m of (t.media || []).filter(x => !x._uploaded)) {
        const blob = await IDB.get(m.id);
        if (!blob) { m._uploaded = true; continue; }
        const path = `${S.profile.id}/${t.id}/${m.kind}_${m.id}.jpg`;
        const up = await sb.storage.from(CFG.bucket).upload(path, blob,
          { contentType: blob.type || 'image/jpeg', upsert: true });
        if (up.error) continue;
        const { _uploaded, ...mm } = m;
        const { error } = await sb.from('media').insert({ ...mm, path });
        if (!error) { m._uploaded = true; await IDB.del(m.id); }
      }
      saveTrip();
      if (t.status !== 'active') {
        const clean = (t.points || []).every(p => p._s) && (t.media || []).every(m => m._uploaded)
          && !(t.stops || []).some(s => s._dirty) && !(t.fuels || []).some(f => f._dirty);
        if (clean) LS.del('lastTrip');
      }
    }
  } catch (e) {
    console.warn('sync', e?.message || e);
  } finally { syncing = false; countPending(); }
}

function countPending() {
  const t = S.trip || LS.get('lastTrip');
  let n = 0;
  if (t) {
    n += (t.points || []).filter(p => !p._s).length;
    n += (t.stops || []).filter(s => s._dirty).length;
    n += (t.fuels || []).filter(f => f._dirty).length;
    n += (t.media || []).filter(m => !m._uploaded).length;
  }
  S.pending = n;
}

async function refreshQuota() {
  try { const { data } = await sb.rpc('my_quota_status'); if (data?.ok) S.quota = data; } catch {}
}
async function refreshCounts() {
  try {
    const { data } = await sb.rpc('my_bootstrap');
    if (data?.ok) { S.alerts = data.unread_alerts || 0; S.approvals = data.pending_approvals || 0; }
  } catch {}
}

/* ==================================================================== */
/*  router + boot                                                       */
/* ==================================================================== */
function go(v, opts) {
  S.view = v;
  const map = {
    home: viewHome, garage: viewGarage, active: viewActive, history: viewHistory,
    backup: viewBackupRequest, platechange: viewPlateChange,
    alerts: viewAlerts, requests: () => viewRequests(opts || {}), approvals: viewApprovals,
    admin: viewAdmin, users: viewUsers, dashboard: viewDashboard, settings: viewSettings,
    syncstatus: viewSyncStatus, pinreport: viewPinReport,
  };
  (map[v] || viewHome)();
}

async function loadMaster() {
  const one = (t, cols, order) => sb.from(t).select(cols).eq('active', true).order(order);
  const pageAll = async (t, cols) => {
    const out = []; let from = 0;
    for (;;) {
      const { data, error } = await sb.from(t).select(cols).eq('active', true)
        .order('code').range(from, from + 999);
      if (error) throw error;
      out.push(...(data || []));
      if (!data || data.length < 1000) break;
      from += 1000; if (from > 40000) break;
    }
    return out;
  };
  const [cc, pv, br, md, ft, jt, st] = await Promise.all([
    one('cost_centers', 'code,name', 'sort'),
    sb.from('provinces').select('id,name_th').order('name_th'),
    one('vehicle_brands', 'id,name', 'sort'),
    one('vehicle_models', 'id,brand_id,name', 'sort'),
    one('fuel_types', 'code,name_th', 'sort'),
    one('job_types', 'code,name_th,billable,needs_store,requires_note', 'sort'),
    pageAll('stores', 'code,name,legacy_code,chain,lat,lng'),
  ]);
  const m = { cost_centers: cc.data || [], provinces: pv.data || [], brands: br.data || [],
    models: md.data || [], fuel_types: ft.data || [], job_types: jt.data || [], stores: st || [] };
  LS.set('master', m); return m;
}

async function boot() {
  loading('กำลังเตรียมระบบ…');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.profile = null; return viewLogin(); }

  // สลับบัญชีบนเครื่องเดียวกัน -> ล้างแคชของคนก่อนหน้า (กันข้อมูลรั่วข้ามคน / PDPA)
  const prevUid = LS.get('uid');
  if (prevUid && prevUid !== session.user.id) wipeUserCache();
  LS.set('uid', session.user.id);

  // ผูกอุปกรณ์ (1 บัญชี = 1 เครื่อง)
  let devId = localStorage.getItem('tl.device');
  if (!devId) { devId = uuid(); localStorage.setItem('tl.device', devId); }
  try {
    const { data: bind } = await sb.rpc('bind_device',
      { p_device_id: devId, p_label: navigator.userAgent.slice(0, 60) });
    if (bind && bind.ok !== true && bind.code === 'OTHER_DEVICE') {
      wipeUserCache(); LS.del('uid');
      await sb.auth.signOut();
      $('#app').innerHTML = '';
      $('#app').append(el(`<div class="center"><div style="font-size:40px">📵</div>
        <h2>ยังเข้าใช้งานไม่ได้</h2>
        <div>บัญชีนี้ผูกไว้กับเครื่อง/เบราว์เซอร์อื่นอยู่แล้ว<br>
        (${esc(bind.bound_label || 'ไม่ทราบ')})<br><br>
        ถ้าเปลี่ยนเครื่อง กรุณาติดต่อ Admin เพื่อปลดล็อกอุปกรณ์</div>
        <button class="btn" onclick="location.reload()">กลับหน้าเข้าสู่ระบบ</button></div>`));
      return;
    }
  } catch (e) { console.warn('bind', e?.message); }

  let bs = null;
  try { const { data } = await sb.rpc('my_bootstrap'); bs = data; } catch (e) {
    const cached = LS.get('bootstrap');
    if (!cached) { $('#app').innerHTML = '';
      $('#app').append(el(`<div class="center"><div style="font-size:36px">📴</div>
        <div>เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ และยังไม่มีข้อมูลที่เคยโหลดไว้</div>
        <button class="btn" onclick="location.reload()">ลองใหม่</button></div>`));
      return; }
    bs = cached; S.online = false;
  }
  if (bs?.ok !== true) {
    if (bs?.code === 'DISABLED') { wipeUserCache(); LS.del('uid'); await sb.auth.signOut();
      return fatalNotice('บัญชีนี้ถูกปิดการใช้งาน',
        'กรุณาติดต่อผู้ดูแลระบบ (Admin) เพื่อเปิดการใช้งานอีกครั้ง'); }
    // ครั้งแรกที่ login ด้วยอีเมล — ผูกกับข้อมูล HR ให้ก่อน
    try { await sb.rpc('link_profile_to_employee'); const { data } = await sb.rpc('my_bootstrap'); bs = data; } catch {}
  }
  if (bs?.ok !== true) { await sb.auth.signOut();
    return fatalNotice('เข้าสู่ระบบไม่สมบูรณ์',
      'ยังไม่พบข้อมูลพนักงานของบัญชีนี้ในระบบ ลองเข้าใหม่อีกครั้ง — ถ้ายังไม่ได้ให้แจ้ง Admin'); }

  LS.set('bootstrap', bs);
  S.profile = bs.profile; S.vehicles = bs.vehicles || [];
  S.quota = bs.quota?.ok ? bs.quota : null;
  S.alerts = bs.unread_alerts || 0; S.approvals = bs.pending_approvals || 0;
  S.supervisorName = bs.supervisor_name || '';

  try { S.master = await loadMaster(); }
  catch { S.master = LS.get('master'); if (!S.master) { toast('โหลดข้อมูลตั้งต้นไม่ได้', 1); } }
  if (!S.master) return;

  if (S.profile.must_change_pin) return viewSetPin();
  // แสดงหน้าความยินยอม 1 ครั้งต่อการ "login จริง" (ตามนโยบาย PDPA)
  // เก็บธงเป็น uid ที่ยินยอมแล้วใน localStorage — คงอยู่ข้าม boot()/รีโหลด/เปิดแอปซ้ำ
  // จึงไม่เด้งซ้ำระหว่าง onboarding หรือก่อนเริ่มงาน · login ใหม่จะล้างธง (ดู viewLogin) ให้ขึ้นอีก
  if (LS.get('consented') !== session.user.id) return viewConsent();
  if (!S.profile.full_name || !S.profile.employee_code || !S.profile.cost_center_code)
    return viewProfile(true);
  if (!S.vehicles.length) return viewVehicle({});

  // กู้ทริปที่ค้าง — เฉพาะทริปของบัญชีนี้เท่านั้น (กันปลุกทริปของคนอื่นบนเครื่องเดิม)
  const saved = LS.get('trip');
  const lastT = LS.get('lastTrip');
  if (saved && saved.status === 'active' && saved.user_id === S.profile.id) {
    S.trip = saved;
    S.dwellAnchor = null; S.dwellSince = Date.now(); S.dwellStopId = null;
    startWatch();
  } else if (bs.active_session && bs.active_session.user_id === S.profile.id) {
    const a = bs.active_session;
    // ผู้ใช้ปิดงานนี้ไปแล้วในเครื่อง แต่ยัง sync ปิดขึ้นเซิร์ฟเวอร์ไม่สำเร็จ
    // -> อย่าปลุกกลับมาเป็น "กำลังทำงาน" ให้ปล่อย sync() ปิดงานให้จบแทน
    if (lastT && lastT.id === a.id && lastT.status && lastT.status !== 'active') {
      S.trip = null;
    } else {
      // ทริปเปิดจริงที่เซิร์ฟเวอร์แต่เครื่องนี้ไม่มีข้อมูล (เช่นลงแอปใหม่กลางทริป)
      S.trip = { id: a.id, user_id: a.user_id, vehicle_id: a.vehicle_id, status: 'active',
        startAt: a.start_at, start_lat: a.start_lat, start_lng: a.start_lng,
        odo_start: a.odo_start, distM: a.gps_distance_m || 0,
        points: [], stops: [], fuels: [], media: [], _counted: null, _recovered: true };
      const [{ data: sts }, { data: fus }] = await Promise.all([
        sb.from('stops').select('*').eq('session_id', a.id).order('seq'),
        sb.from('fuel_records').select('*').eq('session_id', a.id)]);
      S.trip.stops = sts || []; S.trip.fuels = fus || [];
      saveTrip(); startWatch();
    }
  }

  S.ready = true; countPending();
  go(S.trip ? 'active' : 'home');
  sync();
}

/* ---------------------------------------------------------- lifecycle */
window.addEventListener('online', () => { S.online = true; sync(); if (S.view === 'home') go('home'); });
window.addEventListener('offline', () => { S.online = false; if (S.view === 'home') go('home'); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (S.trip && !tracking()) startWatch();
    keepAwake(); sync();
    // กลับเข้าแอปแล้วเช็กว่าช่วงที่ไม่ได้ดูอยู่ ระบบตาบอดไปนานแค่ไหน
    warnGpsGap();
  }
});
setInterval(() => {
  if (!S.ready) return;
  sync(); checkCurfew();
  if (S.view === 'active') paintActive();
}, CFG.syncEverySec * 1000);
window.addEventListener('beforeunload', (e) => {
  if (S.trip) { saveTrip(); e.preventDefault(); e.returnValue = ''; }
});

/* ------------------------------------------------------------- start */
async function startApp() {
// ?demo=1 เปิดโหมดทดลอง / ?demo=0 ออก — ไว้ให้ทีมทดสอบเข้าได้
// โดยไม่ต้องผ่านหน้าตั้งค่า (ซึ่งพนักงานจะไม่เห็นแล้วหลังฝังค่า)
const qDemo = new URLSearchParams(location.search).get('demo');
if (qDemo === '1') localStorage.setItem('tl.demo', '1');
if (qDemo === '0') localStorage.removeItem('tl.demo');

if (localStorage.getItem('tl.demo') === '1') {
  // โหมด Demo — ไม่ต่อ Supabase เลย ใช้ฐานข้อมูลปลอม + GPS จำลองในเครื่อง
  try {
    const d = await import('./demo.js');
    d.installDemo(CFG);
    sb = d.createDemoClient();
    boot();
  } catch (e) {
    localStorage.removeItem('tl.demo');
    renderSetup(location.protocol === 'file:'
      ? 'โหมด Demo เปิดไม่ได้เพราะเปิดไฟล์แบบดับเบิลคลิก — ดับเบิลคลิก start-local.bat แทน'
      : 'เปิดโหมด Demo ไม่ได้ (' + (e?.message || e) + ') — ต้องมีไฟล์ demo.js อยู่ข้าง index.html');
  }
} else if (!CFG.url || !CFG.key) {
  renderSetup();
} else {
  try {
    sb = createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
    sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
    boot();
  } catch (e) {
    renderSetup('เชื่อมต่อไม่สำเร็จ: ' + (e?.message || e));
  }
}
}

// เปิดแบบ file:// = ใช้ไม่ได้ ขึ้นหน้าอธิบายก่อน (กดข้ามได้ถ้าอยากดูหน้าตาเฉย ๆ)
if (location.protocol === 'file:' && !sessionStorage.getItem('tl.ignoreFile')) {
  renderFileProtocolHelp();
} else {
  startApp();
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
